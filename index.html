<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stickman Project Lab 📐</title>
    <!-- Google Fonts: Space Grotesk & Nunito for Blueprint / Technical Studio theme -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        tech: ['Space Grotesk', 'sans-serif'],
                        fredoka: ['Fredoka', 'sans-serif'],
                        nunito: ['Nunito', 'sans-serif'],
                    },
                    colors: {
                        blueprint: {
                            bg: '#0b1329',
                            card: '#132042',
                            grid: '#1e305e',
                            amber: '#f59e0b',
                            emerald: '#10b981',
                            cyan: '#06b6d4',
                            magenta: '#ec4899',
                            purple: '#a855f7',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Technical Blueprint Grid Pattern Background */
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #0b1329;
            background-image: 
                linear-gradient(rgba(30, 48, 94, 0.4) 1px, transparent 1px),
                linear-gradient(90deg, rgba(30, 48, 94, 0.4) 1px, transparent 1px);
            background-size: 24px 24px;
            color: #f1f5f9;
        }

        /* Technical Blueprint Border Accents */
        .blueprint-card {
            background: #132042;
            border: 2px solid #2a437e;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            position: relative;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .blueprint-card:hover {
            transform: translateY(-4px);
            border-color: #3b82f6;
            box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.7), 0 0 15px rgba(59, 130, 246, 0.3);
        }

        /* 3D Touch-Friendly Chromebook Buttons */
        .btn-touch {
            transition: all 0.12s ease-in-out;
            box-shadow: 0 6px 0 0 rgba(0, 0, 0, 0.4);
        }
        .btn-touch:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 0 0 rgba(0, 0, 0, 0.4);
        }
        .btn-touch:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 0 rgba(0, 0, 0, 0.4);
        }

        /* Blueprint Corner Marks */
        .blueprint-card::before {
            content: "+";
            position: absolute;
            top: 4px;
            left: 6px;
            font-family: monospace;
            font-size: 10px;
            color: #64748b;
        }
        .blueprint-card::after {
            content: "+";
            position: absolute;
            top: 4px;
            right: 6px;
            font-family: monospace;
