<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Stickman Engine - Aztec Temple Quest</title>
 <style>
 * {
 box-sizing: border-box;
 user-select: none;
 margin: 0;
 padding: 0;
 font-family: 'Courier New', Courier, monospace, sans-serif;
 }

 body {
 background-color: #0b1d0e;
 color: #ffffff;
 display: flex;
 flex-direction: column;
 align-items: center;
 justify-content: flex-start;
 height: 100vh;
 overflow: hidden;
 padding: 16px;
 }

 /* Top Header Bar */
 #header {
 display: flex;
 justify-content: space-between;
 align-items: center;
 width: 100%;
 max-width: 1100px;
 margin-bottom: 12px;
 padding-bottom: 8px;
 border-bottom: 2px solid #ffd700;
 }

 h1 {
 font-size: 18px;
 letter-spacing: 2px;
 text-transform: uppercase;
 font-weight: bold;
 color: #ffd700;
 text-shadow: 2px 2px 4px #000000;
 }

 .btn-reset {
 background: #1b4332;
 color: #ffd700;
 border: 2px solid #ffd700;
 padding: 6px 16px;
 font-size: 13px;
 font-weight: bold;
 cursor: pointer;
 text-transform: uppercase;
 letter-spacing: 1px;
 border-radius: 4px;
 transition: all 0.15s ease-in-out;
 }

 .btn-reset:hover {
 background: #ffd700;
 color: #000000;
 }

 /* Main Canvas Container */
 #canvas-wrapper {
 position: relative;
 width: 100%;
 max-width: 1100px;
 flex-grow: 1;
 display: flex;
 justify-content: center;
 align-items: center;
 }

 canvas {
 background-color: #122b14;
 border: 3px solid #ffd700;
 border-radius: 6px;
 display: block;
 width: 100%;
 height: 100%;
 box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
 }

 .instructions {
 margin-top: 8px;
 font-size: 12px;
 color: #a3e635;
 text-align: center;
 font-weight: bold;
 text-shadow: 1px 1px 2px #000;
 }
 </style>
</head>
<body>

 <!-- Header Section -->
 <div id="header">
 <h1 id="gameTitle">Stickman Engine: Level 1 - Jungle Approach</h1>
 <button class="btn-reset" onclick="resetGame()">Reset Game</button>
 </div>

 <!-- Canvas Container -->
 <div id="canvas-wrapper">
 <canvas id="simCanvas"></canvas>
 </div>

 <div class="instructions" id="instructionBar">
 Move: [W][A][S][D] Only (Arrow Keys Disabled) | Escape Squeeze: Spam [W]&amp;[S] | Escape Vine: Spam [A]&amp;[D]
 </div>

 <script>
 const canvas = document.getElementById('simCanvas');
 const ctx = canvas.getContext('2d');

 // GAME STATE & PROGRESSION
 let currentLevel = 1;
 const keys = {};

 // PLAYER STATE
 const player = {
 x: 0,
 y: 0,
 speed: 4.5,
 facing: 1, // 1 = Right, -1 = Left
 walkFrame: 0,
 coinsCollected: 0,
 armor: { helmet: false, chestplate: false, leggings: false, shield: false },
 trappedBy: null, // null, 'anaconda', 'vine'
 trapProgress: 0,
 trapTarget: 8,
 trappedEnemy: null,
 invincibleTimer: 0, // 5 seconds (300 frames @ 60fps)
 goldenBananas: 0
 };

 // GAME OBJECTS & HAZARDS
 let coins = [];
 let armorItems = [];
 let trees = [];
 let flowers = [];
 let monkeys = [];
 let birds = [];
 let anacondas = [];
 let angryRocks = [];
 let rockSpawnTimer = 0;
 let portal = null;
 let bananaTrees = [];
 let minions = [];
 let bananaProjectiles = [];
 let levers = [];
 let bossDoorOpen = false;

 function resizeCanvas() {
 const wrapper = document.getElementById('canvas-wrapper');
 canvas.width = wrapper.clientWidth;
 canvas.height = wrapper.clientHeight;
 resetGame();
 }

 window.addEventListener('resize', resizeCanvas);

 // KEYBOARD CONTROLS HANDLER (EXCLUDES ARROW KEYS STRICTLY)
 window.addEventListener('keydown', (e) => {
 const key = e.key.toLowerCase();

 // Block Arrow Keys
 if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(key)) {
 e.preventDefault();
 return;
 }

 // Action: Throw Golden Banana in Level 2
 if (e.code === 'Space' || key === ' ') {
 e.preventDefault();
 if (currentLevel === 2 && player.goldenBananas > 0) {
 player.goldenBananas--;
 bananaProjectiles.push({
 x: player.x,
 y: player.y - 10,
 vx: player.facing * 8,
 vy: -1.5,
 rotation: 0
 });
 }
 return;
 }

 // WASD Movement & Escape Mechanics
 if (['w', 'a', 's', 'd'].includes(key)) {
 e.preventDefault();

 // Escape Anaconda Squeeze: Spam W and S
 if (player.trappedBy === 'anaconda') {
 if (!e.repeat && (key === 'w' || key === 's')) {
 player.trapProgress++;
 if (player.trapProgress >= player.trapTarget) {
 player.trappedBy = null;
 player.invincibleTimer = 300; // 5 Seconds Invincibility!
 if (player.trappedEnemy) player.trappedEnemy.cooldown = 180;
 }
 }
 return;
 }

 // Escape Vine Tangle: Spam A and D
 if (player.trappedBy === 'vine') {
 if (!e.repeat && (key === 'a' || key === 'd')) {
 player.trapProgress++;
 if (player.trapProgress >= player.trapTarget) {
 player.trappedBy = null;
 player.invincibleTimer = 300; // 5 Seconds Invincibility!
 if (player.trappedEnemy) player.trappedEnemy.vineCooldown = 240;
 }
 }
 return;
 }

 keys[key] = true;
 }
 });

 window.addEventListener('keyup', (e) => {
 const key = e.key.toLowerCase();
 if (['w', 'a', 's', 'd'].includes(key)) {
 keys[key] = false;
 }
 });

 function initLevel(level) {
 const w = canvas.width;
 const h = canvas.height;
 const groundTop = h * 0.38;

 player.x = w / 2;
 player.y = h * 0.65;
 player.facing = 1;
 player.walkFrame = 0;
 player.trappedBy = null;
 player.trappedEnemy = null;
 player.invincibleTimer = 0;

 portal = null;
 bananaProjectiles = [];

 if (level === 1) {
 document.getElementById('gameTitle').innerText = "Stickman Engine: Level 1 - Jungle Approach";
 document.getElementById('instructionBar').innerText = "Move: [W][A][S][D] Only (Arrow Keys Disabled) | Escape Squeeze: Spam [W]&[S] | Escape Vine: Spam [A]&[D]";
 
 player.coinsCollected = 0;
 player.armor = { helmet: false, chestplate: false, leggings: false, shield: false };

 // Trees with Vine Traps
 trees = [];
 for (let i = 0; i < 6; i++) {
 trees.push({
 x: (w / 7) * (i + 1) + (Math.random() * 30 - 15),
 y: groundTop + Math.random() * (h - groundTop - 80),
 scale: 0.8 + Math.random() * 0.4,
 hasVine: i % 2 === 0,
 vineLength: 45,
 vineCooldown: 0
 });
 }

 flowers = [];
 const colors = ['#ff4d6d', '#ff007f', '#00f5d4', '#e0aaff', '#ff6b35'];
 for (let i = 0; i < 20; i++) {
 flowers.push({
 x: Math.random() * (w - 40) + 20,
 y: groundTop + 30 + Math.random() * (h - groundTop - 50),
 color: colors[Math.floor(Math.random() * colors.length)],
 radius: 3 + Math.random() * 3
 });
 }

 monkeys = trees.slice(0, 3).map(t => ({ x: t.x + 10, y: t.y - 40 * t.scale }));
 birds = [
 { x: w * 0.2, y: h * 0.18, color: '#ff0055', wing: 0 },
 { x: w * 0.75, y: h * 0.22, color: '#00bbf9', wing: 1 }
 ];

 coins = [];
 for (let i = 0; i < 10; i++) {
 coins.push({ x: 50 + Math.random() * (w - 100), y: groundTop + 40 + Math.random() * (h - groundTop - 80), collected: false });
 }

 armorItems = [
 { type: 'helmet', name: 'Golden Helmet', x: w * 0.2, y: groundTop + 60, collected: false },
 { type: 'chestplate', name: 'Golden Chestplate', x: w * 0.8, y: groundTop + 80, collected: false },
 { type: 'leggings', name: 'Golden Leggings', x: w * 0.35, y: h - 60, collected: false },
 { type: 'shield', name: 'Golden Shield', x: w * 0.65, y: h - 100, collected: false }
 ];

 anacondas = [
 { x: w * 0.25, y: groundTop + 100, speed: 1.2, cooldown: 0, anim: 0 },
 { x: w * 0.75, y: h - 90, speed: 1.4, cooldown: 0, anim: 1.5 }
 ];
 angryRocks = [];
 rockSpawnTimer = 0;
 } 
 else if (level === 2) {
 document.getElementById('gameTitle').innerText = "Stickman Engine: Level 2 - Temple Courtyard";
 document.getElementById('instructionBar').innerText = "Move: [W][A][S][D] | Collect Bananas from Trees | Press [SPACEBAR] to Throw Bananas at Minions!";

 player.goldenBananas = 5;

 // Banana Trees
 bananaTrees = [
 { x: w * 0.15, y: groundTop + 50, bananas: 3 },
 { x: w * 0.85, y: groundTop + 50, bananas: 3 },
 { x: w * 0.5, y: h - 70, bananas: 3 }
 ];

 // Anaconda King Minions
 minions = [];
 for (let i = 0; i < 5; i++) {
 minions.push({
 x: 80 + i * (w - 160) / 4,
 y: groundTop + 60 + (i % 2) * 80,
 speed: 1.5 + Math.random() * 0.5,
 vx: (Math.random() < 0.5 ? 1 : -1) * 2,
 health: 1,
 alive: true,
 anim: i
 });
 }

 anacondas = [];
 angryRocks = [];
 trees = [];
 }
 else if (level === 3) {
 document.getElementById('gameTitle').innerText = "Stickman Engine: Level 3 - Inner Temple Sanctum";
 document.getElementById('instructionBar').innerText = "Move: [W][A][S][D] | Walk to all 4 Gold Levers to unlock the Boss Chamber Door!";

 bossDoorOpen = false;
 levers = [
 { id: 1, x: w * 0.15, y: h * 0.45, active: false },
 { id: 2, x: w * 0.85, y: h * 0.45, active: false },
 { id: 3, x: w * 0.20, y: h * 0.82, active: false },
 { id: 4, x: w * 0.80, y: h * 0.82, active: false }
 ];
 minions = [];
 }
 }

 function resetGame() {
 currentLevel = 1;
 initLevel(1);
 }

 function spawnAngryRock() {
 const w = canvas.width;
 const h = canvas.height;
 const groundTop = h * 0.38;
 const fromLeft = Math.random() < 0.5;
 angryRocks.push({
 x: fromLeft ? -30 : w + 30,
 y: groundTop + Math.random() * (h - groundTop - 40),
 vx: (3 + Math.random() * 2) * (fromLeft ? 1 : -1),
 radius: 18,
 angle: 0
 });
 }

 function updatePhysics() {
 // Invincibility Timer Tick
 if (player.invincibleTimer > 0) {
 player.invincibleTimer--;
 }

 // Movement Handling
 if (!player.trappedBy) {
 let dx = 0;
 let dy = 0;
 if (keys['w']) dy -= 1;
 if (keys['s']) dy += 1;
 if (keys['a']) { dx -= 1; player.facing = -1; }
 if (keys['d']) { dx += 1; player.facing = 1; }

 if (dx !== 0 && dy !== 0) {
 dx *= 0.7071;
 dy *= 0.7071;
 }

 player.x += dx * player.speed;
 player.y += dy * player.speed;

 const margin = 20;
 const minY = canvas.height * 0.38;
 const maxY = canvas.height - 20;
 player.x = Math.max(margin, Math.min(canvas.width - margin, player.x));
 player.y = Math.max(minY, Math.min(maxY, player.y));

 if (dx !== 0 || dy !== 0) player.walkFrame += 0.25;
 else player.walkFrame = 0;
 }

 // --- LEVEL 1 PHYSICS ---
 if (currentLevel === 1) {
 const pickupRadius = 22;

 coins.forEach(coin => {
 if (!coin.collected && Math.hypot(player.x - coin.x, player.y - coin.y) < pickupRadius) {
 coin.collected = true;
 player.coinsCollected++;
 }
 });

 armorItems.forEach(item => {
 if (!item.collected && Math.hypot(player.x - item.x, player.y - item.y) < pickupRadius) {
 item.collected = true;
 player.armor[item.type] = true;
 }
 });

 // Check Portal Spawn Condition (All Gold & Armor Collected)
 const allCoins = player.coinsCollected === coins.length;
 const allArmor = Object.values(player.armor).every(Boolean);

 if (allCoins && allArmor && !portal) {
 portal = { x: canvas.width / 2, y: canvas.height * 0.55, radius: 28, anim: 0 };
 }

 // Enter Portal -> Level 2
 if (portal) {
 portal.anim += 0.08;
 if (Math.hypot(player.x - portal.x, player.y - portal.y) < portal.radius) {
 currentLevel = 2;
 initLevel(2);
 return;
 }
 }

 // Anaconda Hazards (Disabled while invincible)
 if (player.invincibleTimer === 0) {
 anacondas.forEach(snake => {
 snake.anim += 0.08;
 if (snake.cooldown > 0) { snake.cooldown--; return; }

 if (player.trappedBy === 'anaconda' && player.trappedEnemy === snake) {
 snake.x = player.x;
 snake.y = player.y;
 return;
 }

 const dist = Math.hypot(player.x - snake.x, player.y - snake.y);
 if (dist > 10) {
 snake.x += ((player.x - snake.x) / dist) * snake.speed;
 snake.y += ((player.y - snake.y) / dist) * snake.speed;
 }

 if (!player.trappedBy && dist < 18) {
 player.trappedBy = 'anaconda';
 player.trapProgress = 0;
 player.trappedEnemy = snake;
 }
 });
 }

 // Angry Rocks
 rockSpawnTimer++;
 if (rockSpawnTimer > 180) { spawnAngryRock(); rockSpawnTimer = 0; }
 for (let i = angryRocks.length - 1; i >= 0; i--) {
 const rock = angryRocks[i];
 rock.x += rock.vx;
 rock.angle += rock.vx * 0.08;
 if (Math.hypot(player.x - rock.x, player.y - rock.y) < rock.radius + 10) {
 player.x += rock.vx * 2;
 }
 if (rock.x < -50 || rock.x > canvas.width + 50) angryRocks.splice(i, 1);
 }

 // Vine Traps (Disabled while invincible)
 if (player.invincibleTimer === 0) {
 trees.forEach(tree => {
 if (tree.hasVine) {
 if (tree.vineCooldown > 0) { tree.vineCooldown--; return; }
 if (!player.trappedBy && Math.hypot(player.x - tree.x, player.y - (tree.y + tree.vineLength)) < 22) {
 player.trappedBy = 'vine';
 player.trapProgress = 0;
 player.trappedEnemy = tree;
 }
 }
 });
 }
 }

 // --- LEVEL 2 PHYSICS ---
 else if (currentLevel === 2) {
 // Pick Bananas from Trees
 bananaTrees.forEach(bt => {
 if (bt.bananas > 0 && Math.hypot(player.x - bt.x, player.y - bt.y) < 35) {
 bt.bananas--;
 player.goldenBananas += 2;
 }
 });

 // Update thrown banana projectiles
 for (let i = bananaProjectiles.length - 1; i >= 0; i--) {
 const b = bananaProjectiles[i];
 b.x += b.vx;
 b.y += b.vy;
 b.rotation += 0.2;

 // Collision with Minions
 minions.forEach(m => {
 if (m.alive && Math.hypot(b.x - m.x, b.y - m.y) < 25) {
 m.alive = false;
 bananaProjectiles.splice(i, 1);
 }
 });

 if (b.x < 0 || b.x > canvas.width) bananaProjectiles.splice(i, 1);
 }

 // Update Minions AI
 minions.forEach(m => {
 if (m.alive) {
 m.x += m.vx;
 m.anim += 0.1;
 if (m.x < 50 || m.x > canvas.width - 50) m.vx *= -1;
 }
 });

 // Check Level 2 Victory (All Minions Defeated)
 const allDefeated = minions.every(m => !m.alive);
 if (allDefeated && !portal) {
 portal = { x: canvas.width / 2, y: canvas.height * 0.5, radius: 28, anim: 0 };
 }

 if (portal) {
 portal.anim += 0.08;
 if (Math.hypot(player.x - portal.x, player.y - portal.y) < portal.radius) {
 currentLevel = 3;
 initLevel(3);
 return;
 }
 }
 }

 // --- LEVEL 3 PHYSICS ---
 else if (currentLevel === 3) {
 // Flip Levers when touched
 levers.forEach(l => {
 if (!l.active && Math.hypot(player.x - l.x, player.y - l.y) < 28) {
 l.active = true;
 }
 });

 // Unlock Boss Chamber Door when all 4 levers flipped
 if (levers.every(l => l.active)) {
 bossDoorOpen = true;
 }
 }
 }

 // GRAPHICS & RENDERING FUNCTIONS
 function drawBackground() {
 const w = canvas.width;
 const h = canvas.height;
 const groundTop = h * 0.38;

 if (currentLevel === 1) {
 // Far distance Aztec Pyramid
 const skyGrad = ctx.createLinearGradient(0, 0, 0, groundTop);
 skyGrad.addColorStop(0, '#1a3c40');
 skyGrad.addColorStop(1, '#2d5a27');
 ctx.fillStyle = skyGrad;
 ctx.fillRect(0, 0, w, groundTop);

 // Pyramid Steps
 const steps = 6;
 const stepHeight = 14;
 const pyramidBaseWidth = Math.min(320, w * 0.4);
 let currentWidth = pyramidBaseWidth;

 for (let i = 0; i < steps; i++) {
 const stepY = groundTop - (i + 1) * stepHeight;
 const stepX = (w * 0.5) - currentWidth / 2;
 const goldGrad = ctx.createLinearGradient(stepX, stepY, stepX + currentWidth, stepY + stepHeight);
 goldGrad.addColorStop(0, '#b8860b');
 goldGrad.addColorStop(0.5, '#ffd700');
 goldGrad.addColorStop(1, '#996515');
 ctx.fillStyle = goldGrad;
 ctx.fillRect(stepX, stepY, currentWidth, stepHeight);
 ctx.strokeStyle = '#5c4033';
 ctx.strokeRect(stepX, stepY, currentWidth, stepHeight);
 currentWidth -= pyramidBaseWidth / (steps + 2);
 }

 // Jungle Ground
 const groundGrad = ctx.createLinearGradient(0, groundTop, 0, h);
 groundGrad.addColorStop(0, '#1e4620');
 groundGrad.addColorStop(1, '#0d280f');
 ctx.fillStyle = groundGrad;
 ctx.fillRect(0, groundTop, w, h - groundTop);

 // Flowers, Trees, Animals
 flowers.forEach(f => {
 ctx.fillStyle = f.color;
 ctx.beginPath(); ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2); ctx.fill();
 ctx.fillStyle = '#ffffff';
 ctx.beginPath(); ctx.arc(f.x, f.y, f.radius * 0.4, 0, Math.PI * 2); ctx.fill();
 });

 trees.forEach(t => {
 ctx.fillStyle = '#4a2c11';
 ctx.fillRect(t.x - 7 * t.scale, t.y - 60 * t.scale, 14 * t.scale, 60 * t.scale);
 ctx.fillStyle = '#1b5e20';
 ctx.beginPath();
 ctx.arc(t.x, t.y - 70 * t.scale, 30 * t.scale, 0, Math.PI * 2);
 ctx.fill();

 if (t.hasVine && t.vineCooldown === 0) {
 ctx.strokeStyle = '#2d6a4f';
 ctx.lineWidth = 3;
 ctx.beginPath();
 ctx.moveTo(t.x, t.y - 50 * t.scale);
 ctx.quadraticCurveTo(t.x + Math.sin(Date.now() * 0.003) * 6, t.y, t.x, t.y + t.vineLength);
 ctx.stroke();
 }
 });
 } 
 else if (currentLevel === 2) {
 // Level 2: Temple Entrance Courtyard (Closer view of Giant Golden Temple Wall)
 const skyGrad = ctx.createLinearGradient(0, 0, 0, h);
 skyGrad.addColorStop(0, '#3a1c02');
 skyGrad.addColorStop(1, '#0d280f');
 ctx.fillStyle = skyGrad;
 ctx.fillRect(0, 0, w, h);

 // Massive Temple Steps Backdrop
 ctx.fillStyle = '#b8860b';
 ctx.fillRect(w * 0.1, 0, w * 0.8, groundTop);
 ctx.strokeStyle = '#ffd700';
 ctx.lineWidth = 4;
 ctx.strokeRect(w * 0.1, 0, w * 0.8, groundTop);

 // Banana Trees
 bananaTrees.forEach(bt => {
 ctx.fillStyle = '#5c4033';
 ctx.fillRect(bt.x - 10, bt.y - 40, 20, 40);
 ctx.fillStyle = '#2b9348';
 ctx.beginPath();
 ctx.arc(bt.x, bt.y - 50, 35, 0, Math.PI * 2);
 ctx.fill();

 // Hanging Golden Bananas
 for (let i = 0; i < bt.bananas; i++) {
 ctx.fillStyle = '#ffd700';
 ctx.beginPath();
 ctx.arc(bt.x - 12 + i * 12, bt.y - 35, 6, 0, Math.PI);
 ctx.fill();
 }
 });
 } 
 else if (currentLevel === 3) {
 // Level 3: Inside Temple Room with Boss Door
 ctx.fillStyle = '#1a0f00';
 ctx.fillRect(0, 0, w, h);

 // Stone Wall Carvings
 ctx.strokeStyle = '#3d2600';
 ctx.lineWidth = 2;
 for (let x = 0; x < w; x += 60) {
 for (let y = 0; y < h; y += 60) {
 ctx.strokeRect(x, y, 60, 60);
 }
 }

 // Giant Boss Chamber Door at Top Center
 const doorW = 140;
 const doorH = 120;
 const doorX = w / 2 - doorW / 2;
 const doorY = h * 0.15;

 ctx.fillStyle = bossDoorOpen ? '#ffd700' : '#4a2c11';
 ctx.fillRect(doorX, doorY, doorW, doorH);
 ctx.strokeStyle = '#ffd700';
 ctx.lineWidth = 4;
 ctx.strokeRect(doorX, doorY, doorW, doorH);

 ctx.fillStyle = '#ffffff';
 ctx.font = 'bold 14px "Courier New", monospace';
 ctx.textAlign = 'center';
 ctx.fillText(bossDoorOpen ? "BOSS CHAMBER UNLOCKED!" : "LOCKED BOSS DOOR", w / 2, doorY + doorH / 2);
 }
 }

 function drawEntities() {
 // Draw Portal if active
 if (portal) {
 ctx.save();
 ctx.translate(portal.x, portal.y);
 ctx.rotate(portal.anim);
 const grad = ctx.createRadialGradient(0, 0, 5, 0, 0, portal.radius);
 grad.addColorStop(0, '#ffffff');
 grad.addColorStop(0.5, '#00f5d4');
 grad.addColorStop(1, '#ff007f');
 ctx.fillStyle = grad;
 ctx.beginPath();
 ctx.arc(0, 0, portal.radius, 0, Math.PI * 2);
 ctx.fill();
 ctx.restore();
 }

 // Draw Thrown Golden Bananas (Level 2)
 bananaProjectiles.forEach(b => {
 ctx.save();
 ctx.translate(b.x, b.y);
 ctx.rotate(b.rotation);
 ctx.fillStyle = '#ffd700';
 ctx.beginPath();
 ctx.arc(0, 0, 8, 0, Math.PI);
 ctx.fill();
 ctx.restore();
 });

 // Draw Anaconda King Minions (Level 2)
 minions.forEach(m => {
 if (m.alive) {
 ctx.save();
 ctx.translate(m.x, m.y);
 ctx.strokeStyle = '#d00000';
 ctx.lineWidth = 6;
 ctx.beginPath();
 ctx.moveTo(-15, 0);
 ctx.quadraticCurveTo(0, Math.sin(m.anim) * 10, 15, 0);
 ctx.stroke();
 // Minion Red Crown
 ctx.fillStyle = '#ffd700';
 ctx.beginPath();
 ctx.arc(12, -4, 5, 0, Math.PI * 2);
 ctx.fill();
 ctx.restore();
 }
 });

 // Draw 4 Levers (Level 3)
 if (currentLevel === 3) {
 levers.forEach(l => {
 ctx.fillStyle = l.active ? '#52b788' : '#e63946';
 ctx.fillRect(l.x - 12, l.y - 12, 24, 24);
 ctx.strokeStyle = '#ffd700';
 ctx.lineWidth = 2;
 ctx.strokeRect(l.x - 12, l.y - 12, 24, 24);

 // Handle orientation
 ctx.strokeStyle = '#ffffff';
 ctx.lineWidth = 4;
 ctx.beginPath();
 ctx.moveTo(l.x, l.y);
 ctx.lineTo(l.x + (l.active ? 10 : -10), l.y - 15);
 ctx.stroke();
 });
 }
 }

 function drawHazards() {
 if (currentLevel !== 1) return;

 // Anacondas
 anacondas.forEach(snake => {
 const isTrapping = player.trappedBy === 'anaconda' && player.trappedEnemy === snake;
 ctx.save();
 ctx.translate(snake.x, snake.y);
 ctx.strokeStyle = '#2d6a4f';
 ctx.lineWidth = 6;
 ctx.beginPath();
 if (isTrapping) {
 ctx.arc(0, -10, 14, 0, Math.PI * 2);
 } else {
 ctx.moveTo(-20, 0);
 ctx.quadraticCurveTo(-10, Math.sin(snake.anim) * 8, 0, 0);
 ctx.quadraticCurveTo(10, Math.sin(snake.anim + 1.5) * 8, 20, 0);
 }
 ctx.stroke();
 ctx.restore();
 });

 // Angry Rocks
 angryRocks.forEach(rock => {
 ctx.save();
 ctx.translate(rock.x, rock.y);
 ctx.rotate(rock.angle);
 ctx.fillStyle = '#6c757d';
 ctx.beginPath(); ctx.arc(0, 0, rock.radius, 0, Math.PI * 2); ctx.fill();
 ctx.fillStyle = '#ff0000';
 ctx.beginPath(); ctx.arc(-5, -3, 3, 0, Math.PI * 2); ctx.arc(5, -3, 3, 0, Math.PI * 2); ctx.fill();
 ctx.restore();
 });
 }

 function drawCollectibles() {
 if (currentLevel !== 1) return;

 coins.forEach(coin => {
 if (!coin.collected) {
 ctx.fillStyle = '#ffd700';
 ctx.beginPath(); ctx.arc(coin.x, coin.y, 6, 0, Math.PI * 2); ctx.fill();
 }
 });

 armorItems.forEach(item => {
 if (!item.collected) {
 ctx.fillStyle = '#ffd700';
 ctx.fillRect(item.x - 6, item.y - 6, 12, 12);
 }
 });
 }

 function drawStickman(x, y, facing, walkFrame) {
 ctx.strokeStyle = '#ffffff';
 ctx.fillStyle = '#ffffff';
 ctx.lineWidth = 1.8;
 ctx.lineCap = 'round';

 const headRadius = 5;
 const bodyLength = 15;
 const legLength = 11;
 const neckY = y - bodyLength;
 const headY = neckY - headRadius;
 const shoulderY = neckY + 4;
 const legSwing = Math.sin(walkFrame) * 6;
 const armSwing = Math.sin(walkFrame + Math.PI) * 4;

 // Invincibility Rainbow Aura Effect
 if (player.invincibleTimer > 0) {
 ctx.save();
 ctx.strokeStyle = `hsl(${(Date.now() / 5) % 360}, 100%, 50%)`;
 ctx.lineWidth = 3;
 ctx.beginPath();
 ctx.arc(x, y - 10, 24, 0, Math.PI * 2);
 ctx.stroke();
 ctx.restore();
 }

 // Head
 ctx.beginPath(); ctx.arc(x, headY, headRadius, 0, Math.PI * 2); ctx.stroke();

 // Armor Overlay
 if (player.armor.helmet) {
 ctx.fillStyle = '#ffd700';
 ctx.beginPath(); ctx.arc(x, headY, headRadius + 1.5, Math.PI * 0.8, Math.PI * 2.2); ctx.fill();
 }

 // Torso
 ctx.beginPath(); ctx.moveTo(x, neckY); ctx.lineTo(x, y); ctx.stroke();
 if (player.armor.chestplate) {
 ctx.fillStyle = '#ffd700'; ctx.fillRect(x - 4, neckY + 2, 8, bodyLength - 3);
 }

 // Legs
 ctx.strokeStyle = player.armor.leggings ? '#ffd700' : '#ffffff';
 ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - legSwing, y + legLength); ctx.stroke();
 ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + legSwing, y + legLength); ctx.stroke();

 // Arms
 ctx.strokeStyle = '#ffffff';
 ctx.beginPath(); ctx.moveTo(x, shoulderY); ctx.lineTo(x - facing * 4 - armSwing, shoulderY + 6); ctx.stroke();
 ctx.beginPath(); ctx.moveTo(x, shoulderY); ctx.lineTo(x + facing * 4 + armSwing, shoulderY + 6); ctx.stroke();

 if (player.armor.shield) {
 ctx.fillStyle = '#ffd700';
 ctx.beginPath(); ctx.arc(x + facing * 8, shoulderY + 6, 6, 0, Math.PI * 2); ctx.fill();
 }
 }

 function drawHUD() {
 const w = canvas.width;
 const h = canvas.height;

 ctx.fillStyle = '#ffffff';
 ctx.font = '12px "Courier New", monospace';
 ctx.textAlign = 'left';

 // Invincibility HUD Indicator
 if (player.invincibleTimer > 0) {
 const secondsLeft = (player.invincibleTimer / 60).toFixed(1);
 ctx.fillStyle = '#00f5d4';
 ctx.font = 'bold 14px "Courier New", monospace';
 ctx.fillText(`INVINCIBLE SHIELD: ${secondsLeft}s`, 15, 80);
 }

 // Level Specific HUD Elements
 if (currentLevel === 1) {
 ctx.fillStyle = '#ffd700';
 ctx.fillText(`COINS: ${player.coinsCollected} / ${coins.length}`, 15, 25);
 const collectedArmorCount = Object.values(player.armor).filter(Boolean).length;
 ctx.fillText(`ARMOR: ${collectedArmorCount} / 4`, 15, 45);
 if (portal) {
 ctx.fillStyle = '#00f5d4';
 ctx.fillText("PORTAL OPEN! STEP INTO THE PORTAL!", 15, 62);
 }
 } else if (currentLevel === 2) {
 ctx.fillStyle = '#ffd700';
 ctx.fillText(`GOLDEN BANANAS: ${player.goldenBananas}`, 15, 25);
 const remainingMinions = minions.filter(m => m.alive).length;
 ctx.fillText(`MINIONS REMAINING: ${remainingMinions}`, 15, 45);
 } else if (currentLevel === 3) {
 const activeLevers = levers.filter(l => l.active).length;
 ctx.fillStyle = '#ffd700';
 ctx.fillText(`LEVERS PULLED: ${activeLevers} / 4`, 15, 25);
 }

 // Trap Prompts
 if (player.trappedBy === 'anaconda') {
 ctx.fillStyle = '#ff4d4d';
 ctx.font = 'bold 18px "Courier New", monospace';
 ctx.textAlign = 'center';
 ctx.fillText('ANACONDA SQUEEZE! SPAM [W] AND [S] TO ESCAPE!', w / 2, h * 0.2);
 } else if (player.trappedBy === 'vine') {
 ctx.fillStyle = '#52b788';
 ctx.font = 'bold 18px "Courier New", monospace';
 ctx.textAlign = 'center';
 ctx.fillText('TANGLED IN VINES! SPAM [A] AND [D] TO CUT FREE!', w / 2, h * 0.2);
 }
 }

 function draw() {
 drawBackground();
 drawHazards();
 drawCollectibles();
 drawEntities();
 drawStickman(player.x, player.y, player.facing, player.walkFrame);
 drawHUD();
 }

 function animate() {
 updatePhysics();
 draw();
 requestAnimationFrame(animate);
 }

 window.onload = function() {
 resizeCanvas();
 animate();
 };
 </script>
</body>
</html>
