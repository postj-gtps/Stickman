<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stickman Engine - Dragon's Forest & Chasing Mimics</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f1923;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      height: 100vh;
      overflow: hidden;
      padding: 12px;
    }

    /* Top Header Bar */
    #header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 1280px;
      margin-bottom: 6px;
      padding-bottom: 6px;
      border-bottom: 3px solid #ff4757;
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    h1 {
      font-size: 20px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 900;
      color: #fffa65;
      text-shadow: 2px 2px 0px #000;
    }

    .hud-badge {
      background: #ff4757;
      color: #ffffff;
      padding: 4px 14px;
      border-radius: 16px;
      font-size: 14px;
      font-weight: 800;
      box-shadow: 0 3px 0px #b21f2d;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .gold-badge {
      background: #ffa502;
      box-shadow: 0 3px 0px #cc8e00;
    }

    .btn-reset {
      background: #2ed573;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 8px 18px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 4px 0px #1e90ff;
      transition: all 0.1s ease-in-out;
    }

    .btn-reset:hover {
      background: #1e90ff;
      transform: translateY(-1px);
    }

    .btn-reset:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0px #1e90ff;
    }

    /* Distance Meter HUD */
    #hud {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      max-width: 1280px;
      margin-bottom: 6px;
      background: #2f3542;
      padding: 8px 16px;
      border-radius: 8px;
      border: 2px solid #57606f;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .meter-label {
      font-size: 13px;
      font-weight: 900;
      color: #70a1ff;
      white-space: nowrap;
      letter-spacing: 1px;
    }

    .meter-container {
      flex-grow: 1;
      height: 20px;
      background-color: #57606f;
      border: 2px solid #2f3542;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }

    .meter-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff4757, #ffa502, #eccc68, #2ed573);
      transition: width 0.08s ease-out;
      border-radius: 10px;
    }

    .meter-text {
      font-size: 13px;
      font-weight: 800;
      color: #ffffff;
      min-width: 220px;
      text-align: right;
    }

    /* Main Canvas Container */
    #canvas-wrapper {
      position: relative;
      width: 100%;
      max-width: 1280px;
      flex-grow: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      background-color: #70a1ff;
      border: 4px solid #2f3542;
      border-radius: 10px;
      display: block;
      width: 100%;
      height: 100%;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }

    .instructions {
      margin-top: 6px;
      font-size: 13px;
      font-weight: 800;
      color: #70a1ff;
      text-align: center;
    }

    /* Game Over / Victory Overlay */
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 25, 35, 0.85);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
      border-radius: 8px;
    }

    #overlay h2 {
      font-size: 36px;
      font-weight: 900;
      color: #ff4757;
      text-shadow: 3px 3px 0 #000;
      margin-bottom: 12px;
    }

    #overlay button {
      background: #fffa65;
      color: #000;
      font-size: 18px;
      font-weight: 900;
      padding: 10px 24px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 0 #ffa502;
    }
  </style>
</head>
<body>

  <!-- Header Section -->
  <div id="header">
    <div class="title-group">
      <h1>Stickman Engine</h1>
      <div id="livesBadge" class="hud-badge">Lives: ❤️❤️❤️</div>
      <div id="scoreBadge" class="hud-badge gold-badge">Gold: 0</div>
    </div>
    <button class="btn-reset" onclick="resetSimulation()">Reset Level</button>
  </div>

  <!-- HUD Distance Meter Bar -->
  <div id="hud">
    <span class="meter-label">TREASURE RADAR:</span>
    <div class="meter-container">
      <div id="meterBar" class="meter-bar"></div>
    </div>
    <span id="meterText" class="meter-text">Distance: ---</span>
  </div>

  <!-- Canvas Container -->
  <div id="canvas-wrapper">
    <canvas id="simCanvas"></canvas>

    <!-- Overlay Screen -->
    <div id="overlay">
      <h2 id="overlayTitle">GAME OVER</h2>
      <button onclick="resetSimulation()">Try Again!</button>
    </div>
  </div>

  <div class="instructions">
    [WASD] Movement | [SPACEBAR] Dig / Open Chest
  </div>

  <script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');

    // WORLD CONFIGURATION
    const WORLD_WIDTH = 4200;

    // KEYBOARD INPUT STATE (EXCLUSIVE WASD MOVEMENT)
    const keys = {};

    // CAMERA STATE
    const camera = {
      x: 0,
      y: 0,
      shake: 0
    };

    // STICKMAN PLAYER STATE
    const player = {
      x: 250,
      y: 0,
      speed: 5.8,
      facing: 1, // 1 = Right, -1 = Left
      walkFrame: 0,
      isDigging: false,
      digTimer: 0,
      score: 0,
      lives: 3,
      maxLives: 3,
      invulnerableTimer: 0,
      knockbackVx: 0,
      knockbackVy: 0,
      isDead: false
    };

    // REAL HIDDEN TREASURE STATE
    const treasure = {
      x: 0,
      y: 0,
      state: 'hidden', // 'hidden' -> 'uncovered' -> 'opened'
      digRadius: 45,
      totalCoins: 25
    };

    // ABOVEGROUND CHASING FAKE TREASURE CHESTS (MIMICS)
    let fakeTreasures = [];

    // DRAGON ENEMY
    const dragon = {
      x: 0,
      y: 0,
      baseY: 0,
      hoverTimer: 0,
      fireballCooldown: 0,
      facing: -1
    };

    // EVIL SOCCER GOAL POSTS
    let soccerGoals = [];

    // PROJECTILES, COINS & PARTICLES
    let fireballs = [];
    let coins = [];
    let clouds = [];
    let backgroundTrees = [];
    let worldTrees = [];
    let foregroundTrees = [];
    let birds = [];
    let squirrels = [];
    let particles = [];
    let floatingTexts = [];

    function resizeCanvas() {
      const wrapper = document.getElementById('canvas-wrapper');
      canvas.width = wrapper.clientWidth;
      canvas.height = wrapper.clientHeight;

      if (player.y === 0) {
        resetSimulation();
      }
    }

    window.addEventListener('resize', resizeCanvas);

    // KEYBOARD INPUT - WASD IS EXCLUSIVE FOR MOVEMENT (Arrow Keys Explicitly Ignored)
    window.addEventListener('keydown', (e) => {
      if (['KeyW', 'KeyA', 'KeyS', 'KeyD', 'Space'].includes(e.code)) {
        e.preventDefault();
      }

      // STRICT REQUIREMENT: ONLY WASD allowed for movement
      if (['KeyW', 'KeyA', 'KeyS', 'KeyD'].includes(e.code)) {
        keys[e.code] = true;
      }

      if (e.code === 'Space' && !player.isDigging && !player.isDead) {
        handleActionKey();
      }
    });

    window.addEventListener('keyup', (e) => {
      if (['KeyW', 'KeyA', 'KeyS', 'KeyD'].includes(e.code)) {
        keys[e.code] = false;
      }
    });

    function resetSimulation() {
      document.getElementById('overlay').style.display = 'none';
      const groundY = canvas.height * 0.72;

      player.x = 250;
      player.y = groundY;
      player.facing = 1;
      player.walkFrame = 0;
      player.isDigging = false;
      player.digTimer = 0;
      player.score = 0;
      player.lives = 3;
      player.invulnerableTimer = 0;
      player.knockbackVx = 0;
      player.knockbackVy = 0;
      player.isDead = false;

      // Real Treasure Location
      treasure.x = 2200 + Math.random() * (WORLD_WIDTH - 2600);
      treasure.y = groundY + Math.random() * (canvas.height * 0.14);
      treasure.state = 'hidden';

      // Dragon positioned guarding real treasure
      dragon.x = treasure.x + 120;
      dragon.baseY = canvas.height * 0.38;
      dragon.y = dragon.baseY;
      dragon.hoverTimer = 0;
      dragon.fireballCooldown = 60;

      // Aboveground Chasing Fake Treasure Chests
      fakeTreasures = [];
      const fakeCount = 4;
      for (let i = 0; i < fakeCount; i++) {
        let fakeX = 700 + Math.random() * (WORLD_WIDTH - 1000);
        while (Math.abs(fakeX - treasure.x) < 350) {
          fakeX = 700 + Math.random() * (WORLD_WIDTH - 1000);
        }
        fakeTreasures.push({
          x: fakeX,
          y: groundY + Math.random() * (canvas.height * 0.12),
          speed: 2.2 + Math.random() * 0.8,
          chaseRadius: 650,
          mouthOpenFrame: 0
        });
      }

      // Evil Soccer Goal Posts
      soccerGoals = [];
      const goalPositions = [900, 1700, 2800, 3600];
      goalPositions.forEach(gx => {
        soccerGoals.push({
          x: gx,
          y: groundY + 10,
          width: 70,
          height: 55,
          mouthOpen: 0
        });
      });

      coins = [];
      fireballs = [];
      particles = [];
      floatingTexts = [];

      // Clouds
      clouds = [];
      for (let i = 0; i < 24; i++) {
        clouds.push({
          x: Math.random() * WORLD_WIDTH,
          y: 20 + Math.random() * (canvas.height * 0.22),
          scale: 0.7 + Math.random() * 0.8,
          speed: 0.2 + Math.random() * 0.3
        });
      }

      // Background Pine Trees
      backgroundTrees = [];
      for (let x = 0; x < WORLD_WIDTH; x += 70 + Math.random() * 40) {
        backgroundTrees.push({
          x: x,
          y: canvas.height * 0.58,
          scale: 0.75 + Math.random() * 0.35
        });
      }

      // World Trees
      worldTrees = [];
      for (let x = 80; x < WORLD_WIDTH; x += 110 + Math.random() * 70) {
        worldTrees.push({
          x: x,
          y: groundY - 10 + Math.random() * (canvas.height * 0.18),
          scale: 1.0 + Math.random() * 0.45
        });
      }

      // Foreground Trees
      foregroundTrees = [];
      for (let x = 150; x < WORLD_WIDTH; x += 320 + Math.random() * 220) {
        foregroundTrees.push({
          x: x,
          y: canvas.height * 0.88,
          scale: 1.9 + Math.random() * 0.5
        });
      }

      // Wildlife: Birds & Squirrels
      birds = [];
      for (let i = 0; i < 10; i++) {
        birds.push({
          x: Math.random() * WORLD_WIDTH,
          y: 35 + Math.random() * (canvas.height * 0.3),
          vx: 1.2 + Math.random() * 1.8,
          wingPhase: Math.random() * Math.PI * 2,
          size: 5 + Math.random() * 3.5
        });
      }

      squirrels = [];
      for (let i = 0; i < 12; i++) {
        squirrels.push({
          x: 200 + Math.random() * (WORLD_WIDTH - 300),
          y: groundY + Math.random() * (canvas.height * 0.15),
          vx: (Math.random() - 0.5) * 1.6,
          stateTimer: Math.random() * 100,
          tailPhase: Math.random() * Math.PI
        });
      }

      updateUI();
    }

    function handleActionKey() {
      if (player.isDead) return;

      player.isDigging = true;
      player.digTimer = 22;

      // Dirt particle burst
      for (let i = 0; i < 12; i++) {
        particles.push({
          x: player.x,
          y: player.y + 10,
          vx: (Math.random() - 0.5) * 5,
          vy: -Math.random() * 4 - 2,
          color: Math.random() > 0.5 ? '#7f5539' : '#b08968',
          life: 25
        });
      }

      // Check Interaction with Real Hidden Treasure
      const distToReal = Math.hypot(player.x - treasure.x, player.y - treasure.y);
      if (treasure.state === 'hidden' && distToReal <= treasure.digRadius) {
        treasure.state = 'uncovered';
        spawnSparkles(treasure.x, treasure.y, '#fffa65', 25);
        addFloatingText("Real Treasure Uncovered!", treasure.x, treasure.y - 20, '#2ed573');
      } else if (treasure.state === 'uncovered' && distToReal <= treasure.digRadius + 20) {
        treasure.state = 'opened';
        spawnGoldFountain();
      }
    }

    function damagePlayer(reasonText, knockVx, knockVy) {
      if (player.invulnerableTimer > 0 || player.isDead) return;

      player.lives--;
      player.invulnerableTimer = 60; // Invulnerability window
      player.knockbackVx = knockVx;
      player.knockbackVy = knockVy;

      camera.shake = 15;
      addFloatingText(reasonText, player.x, player.y - 30, '#ff4757');
      updateUI();

      if (player.lives <= 0) {
        player.isDead = true;
        document.getElementById('overlayTitle').textContent = "GAME OVER!";
        document.getElementById('overlay').style.display = 'flex';
      }
    }

    function spawnGoldFountain() {
      coins = [];
      for (let i = 0; i < treasure.totalCoins; i++) {
        const angle = -Math.PI / 2 + (Math.random() - 0.5) * 1.3;
        const speed = 7 + Math.random() * 7;
        coins.push({
          x: treasure.x,
          y: treasure.y - 10,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          groundY: treasure.y + (Math.random() - 0.5) * 20,
          bounceCount: 0,
          collected: false,
          rotation: Math.random() * Math.PI * 2,
          rotSpeed: (Math.random() - 0.5) * 0.3
        });
      }
      spawnSparkles(treasure.x, treasure.y - 10, '#ffd700', 35);
    }

    function spawnSparkles(x, y, color, count) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x: x,
          y: y,
          vx: (Math.random() - 0.5) * 8,
          vy: -Math.random() * 6 - 2,
          color: color,
          life: 30 + Math.random() * 20
        });
      }
    }

    function addFloatingText(text, x, y, color) {
      floatingTexts.push({ text, x, y, color, life: 50, vy: -1.2 });
    }

    function updatePhysics() {
      if (camera.shake > 0) camera.shake *= 0.88;

      // Apply Knockback forces
      if (Math.abs(player.knockbackVx) > 0.2 || Math.abs(player.knockbackVy) > 0.2) {
        player.x += player.knockbackVx;
        player.y += player.knockbackVy;
        player.knockbackVx *= 0.85;
        player.knockbackVy *= 0.85;
      } else if (!player.isDead) {
        // WASD Movement Processing
        let dx = 0;
        let dy = 0;

        if (keys['KeyW']) dy -= 1;
        if (keys['KeyS']) dy += 1;
        if (keys['KeyA']) { dx -= 1; player.facing = -1; }
        if (keys['KeyD']) { dx += 1; player.facing = 1; }

        if (dx !== 0 && dy !== 0) {
          dx *= 0.7071;
          dy *= 0.7071;
        }

        player.x += dx * player.speed;
        player.y += dy * player.speed;

        if (dx !== 0 || dy !== 0) {
          player.walkFrame += 0.28;
        } else {
          player.walkFrame = 0;
        }
      }

      // World Boundary Constraints
      const minPlayableY = canvas.height * 0.52;
      const maxPlayableY = canvas.height * 0.92;
      player.x = Math.max(20, Math.min(WORLD_WIDTH - 20, player.x));
      player.y = Math.max(minPlayableY, Math.min(maxPlayableY, player.y));

      if (player.invulnerableTimer > 0) player.invulnerableTimer--;

      if (player.digTimer > 0) {
        player.digTimer--;
        if (player.digTimer === 0) player.isDigging = false;
      }

      // Smooth Camera Follow
      const targetCameraX = player.x - canvas.width / 2;
      camera.x += (targetCameraX - camera.x) * 0.1;
      camera.x = Math.max(0, Math.min(WORLD_WIDTH - canvas.width, camera.x));

      // --- ABOVEGROUND FAKE CHESTS (CHASING MIMICS) ---
      fakeTreasures.forEach(fake => {
        const distToPlayer = Math.hypot(player.x - fake.x, player.y - fake.y);

        // Chase player when within detection range
        if (distToPlayer < fake.chaseRadius && !player.isDead) {
          const angle = Math.atan2(player.y - fake.y, player.x - fake.x);
          fake.x += Math.cos(angle) * fake.speed;
          fake.y += Math.sin(angle) * fake.speed;
          fake.mouthOpenFrame += 0.15;

          // Attack/Bite on collision
          if (distToPlayer < 28) {
            const knockDir = player.x < fake.x ? -1 : 1;
            damagePlayer("CHOMP! Fake Chest Bit You!", knockDir * 10, -4);
            spawnSparkles(player.x, player.y, '#ff4757', 15);
          }
        }
      });

      // --- DRAGON & FIREBALL AI ---
      dragon.hoverTimer += 0.05;
      dragon.y = dragon.baseY + Math.sin(dragon.hoverTimer) * 25;
      dragon.facing = player.x < dragon.x ? -1 : 1;

      const distToDragon = Math.hypot(player.x - dragon.x, player.y - dragon.y);
      if (distToDragon < 900 && !player.isDead) {
        dragon.fireballCooldown--;
        if (dragon.fireballCooldown <= 0) {
          dragon.fireballCooldown = 110;

          const angle = Math.atan2(player.y - dragon.y, player.x - dragon.x);
          const speed = 6.5;
          fireballs.push({
            x: dragon.x + dragon.facing * 40,
            y: dragon.y + 10,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            radius: 12
          });
          addFloatingText("🔥 ROAR!", dragon.x, dragon.y - 40, '#ff4757');
        }
      }

      // Update Fireballs
      for (let i = fireballs.length - 1; i >= 0; i--) {
        const fb = fireballs[i];
        fb.x += fb.vx;
        fb.y += fb.vy;

        particles.push({
          x: fb.x + (Math.random() - 0.5) * 8,
          y: fb.y + (Math.random() - 0.5) * 8,
          vx: -fb.vx * 0.2,
          vy: -fb.vy * 0.2,
          color: Math.random() > 0.5 ? '#ff4757' : '#ffa502',
          life: 15
        });

        const distToPlayer = Math.hypot(player.x - fb.x, player.y - fb.y);
        if (distToPlayer < fb.radius + 15) {
          damagePlayer("FIREBALL HIT!", fb.vx * 1.2, -4);
          fireballs.splice(i, 1);
          continue;
        }

        if (fb.x < 0 || fb.x > WORLD_WIDTH || fb.y > canvas.height) {
          fireballs.splice(i, 1);
        }
      }

      // --- EVIL SOCCER GOAL POSTS COLLISION ---
      soccerGoals.forEach(goal => {
        const left = goal.x - goal.width / 2;
        const right = goal.x + goal.width / 2;
        const top = goal.y - goal.height;
        const bottom = goal.y;

        if (player.x > left && player.x < right && player.y > top && player.y < bottom) {
          const knockDir = player.x < goal.x ? -1 : 1;
          player.knockbackVx = knockDir * 14;
          player.knockbackVy = -5;
          camera.shake = 10;
          goal.mouthOpen = 20;

          addFloatingText("⚽ BOING! Knocked Back!", player.x, player.y - 25, '#fffa65');
          spawnSparkles(player.x, player.y, '#ffffff', 15);
        }

        if (goal.mouthOpen > 0) goal.mouthOpen--;
      });

      // Update Clouds, Birds, Squirrels
      clouds.forEach(c => {
        c.x += c.speed;
        if (c.x > WORLD_WIDTH + 100) c.x = -100;
      });

      birds.forEach(b => {
        b.x += b.vx;
        b.wingPhase += 0.2;
        if (b.x > WORLD_WIDTH + 50) {
          b.x = -50;
          b.y = 35 + Math.random() * (canvas.height * 0.3);
        }
      });

      squirrels.forEach(s => {
        s.stateTimer--;
        if (s.stateTimer <= 0) {
          s.vx = (Math.random() - 0.5) * 2;
          s.stateTimer = 40 + Math.random() * 120;
        }
        s.x += s.vx;
        s.tailPhase += 0.12;
        s.x = Math.max(40, Math.min(WORLD_WIDTH - 40, s.x));
      });

      // Update Gold Coins
      coins.forEach(coin => {
        if (!coin.collected) {
          coin.x += coin.vx;
          coin.y += coin.vy;
          coin.vy += 0.38;
          coin.rotation += coin.rotSpeed;

          if (coin.y >= coin.groundY) {
            coin.y = coin.groundY;
            if (coin.bounceCount < 2) {
              coin.vy = -coin.vy * 0.45;
              coin.vx *= 0.6;
              coin.bounceCount++;
            } else {
              coin.vy = 0;
              coin.vx = 0;
            }
          }

          const distToPlayer = Math.hypot(player.x - coin.x, player.y - coin.y);
          if (distToPlayer < 28 && !player.isDead) {
            coin.collected = true;
            player.score++;
            updateUI();
            spawnSparkles(coin.x, coin.y, '#ffd700', 6);
          }
        }
      });

      // Update Particles & Floating Text
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.2;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }

      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y += ft.vy;
        ft.life--;
        if (ft.life <= 0) floatingTexts.splice(i, 1);
      }

      updateHUD();
    }

    function updateUI() {
      let hearts = '';
      for (let i = 0; i < player.maxLives; i++) {
        hearts += i < player.lives ? '❤️' : '🖤';
      }
      document.getElementById('livesBadge').textContent = `Lives: ${hearts}`;
      document.getElementById('scoreBadge').textContent = `Gold: ${player.score} / ${treasure.totalCoins}`;
    }

    function updateHUD() {
      const dist = Math.hypot(player.x - treasure.x, player.y - treasure.y);
      const maxDist = WORLD_WIDTH;
      let proximityPct = Math.max(0, Math.min(100, (1 - (dist / maxDist)) * 100));

      const meterBar = document.getElementById('meterBar');
      const meterText = document.getElementById('meterText');

      meterBar.style.width = proximityPct.toFixed(1) + '%';

      if (treasure.state === 'hidden') {
        if (dist <= treasure.digRadius) {
          meterText.textContent = "PRESS [SPACE] TO DIG!";
          meterText.style.color = "#fffa65";
        } else {
          meterText.textContent = `Distance to Real Treasure: ${Math.round(dist)}m`;
          meterText.style.color = "#ffffff";
        }
      } else if (treasure.state === 'uncovered') {
        if (dist <= treasure.digRadius + 20) {
          meterText.textContent = "PRESS [SPACE] TO OPEN CHEST!";
          meterText.style.color = "#fffa65";
        } else {
          meterText.textContent = "REAL CHEST UNCOVERED!";
          meterText.style.color = "#2ed573";
        }
      } else if (treasure.state === 'opened') {
        if (player.score >= treasure.totalCoins) {
          meterText.textContent = "VICTORY! ALL GOLD COLLECTED! 🎉";
          meterText.style.color = "#2ed573";
        } else {
          meterText.textContent = `COLLECT GOLD! (${player.score}/${treasure.totalCoins})`;
          meterText.style.color = "#ffa502";
        }
      }
    }

    // DRAWING FUNCTIONS
    function drawBrightSky() {
      const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      skyGrad.addColorStop(0, '#1e90ff');
      skyGrad.addColorStop(0.5, '#70a1ff');
      skyGrad.addColorStop(1, '#eccc68');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#fffa65';
      ctx.beginPath();
      ctx.arc(canvas.width * 0.85, 75, 40, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawClouds(parallaxFactor) {
      ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
      clouds.forEach(c => {
        const renderX = c.x - camera.x * parallaxFactor;
        if (renderX > -150 && renderX < canvas.width + 150) {
          ctx.beginPath();
          ctx.arc(renderX, c.y, 22 * c.scale, 0, Math.PI * 2);
          ctx.arc(renderX + 20 * c.scale, c.y - 12 * c.scale, 28 * c.scale, 0, Math.PI * 2);
          ctx.arc(renderX + 44 * c.scale, c.y, 22 * c.scale, 0, Math.PI * 2);
          ctx.fill();
        }
      });
    }

    function drawLoomingCastle(parallaxFactor) {
      const castleWorldX = 750;
      const renderX = castleWorldX - camera.x * parallaxFactor;
      const castleY = canvas.height * 0.52;

      if (renderX > -300 && renderX < canvas.width + 300) {
        ctx.save();
        ctx.translate(renderX, castleY);

        ctx.fillStyle = '#747d8c';
        ctx.fillRect(-110, -80, 220, 80);

        ctx.fillStyle = '#a4b0be';
        ctx.fillRect(-65, -125, 130, 45);

        ctx.fillStyle = '#747d8c';
        ctx.fillRect(-140, -130, 50, 130);
        ctx.fillRect(90, -130, 50, 130);
        ctx.fillRect(-30, -165, 60, 40);

        ctx.fillStyle = '#ff4757';
        ctx.beginPath();
        ctx.moveTo(-145, -130); ctx.lineTo(-115, -185); ctx.lineTo(-85, -130); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(85, -130); ctx.lineTo(115, -185); ctx.lineTo(145, -130); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(-35, -165); ctx.lineTo(0, -215); ctx.lineTo(35, -165); ctx.fill();

        ctx.restore();
      }
    }

    function drawPineTree(x, y, scale, trunkColor, needleColor) {
      ctx.save();
      ctx.translate(x, y);
      ctx.fillStyle = trunkColor;
      ctx.fillRect(-4 * scale, -12 * scale, 8 * scale, 18 * scale);

      ctx.fillStyle = needleColor;
      for (let i = 0; i < 3; i++) {
        const layerY = -12 * scale - i * 16 * scale;
        const width = (26 - i * 5) * scale;
        ctx.beginPath();
        ctx.moveTo(0, layerY - 22 * scale);
        ctx.lineTo(-width, layerY);
        ctx.lineTo(width, layerY);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    }

    function drawBackgroundTrees(parallaxFactor) {
      backgroundTrees.forEach(t => {
        const renderX = t.x - camera.x * parallaxFactor;
        if (renderX > -100 && renderX < canvas.width + 100) {
          drawPineTree(renderX, t.y, t.scale, '#5c3d2e', '#2ed573');
        }
      });
    }

    function drawGround() {
      const groundY = canvas.height * 0.52;
      const grassGrad = ctx.createLinearGradient(0, groundY, 0, canvas.height);
      grassGrad.addColorStop(0, '#2ed573');
      grassGrad.addColorStop(0.2, '#26af5f');
      grassGrad.addColorStop(1, '#105c30');

      ctx.fillStyle = grassGrad;
      ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

      ctx.fillStyle = '#7bed9f';
      ctx.fillRect(0, groundY, canvas.width, 6);
    }

    function drawEvilSoccerGoals(parallaxFactor) {
      soccerGoals.forEach(goal => {
        const renderX = goal.x - camera.x * parallaxFactor;
        if (renderX > -100 && renderX < canvas.width + 100) {
          ctx.save();
          ctx.translate(renderX, goal.y);

          ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
          ctx.fillRect(-goal.width / 2, -goal.height, goal.width, goal.height);

          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 1;
          for (let nx = -goal.width / 2; nx <= goal.width / 2; nx += 10) {
            ctx.beginPath();
            ctx.moveTo(nx, -goal.height); ctx.lineTo(nx, 0); ctx.stroke();
          }
          for (let ny = -goal.height; ny <= 0; ny += 10) {
            ctx.beginPath();
            ctx.moveTo(-goal.width / 2, ny); ctx.lineTo(goal.width / 2, ny); ctx.stroke();
          }

          ctx.strokeStyle = '#ff4757';
          ctx.lineWidth = 5;
          ctx.strokeRect(-goal.width / 2, -goal.height, goal.width, goal.height);

          // Evil Face Details
          ctx.fillStyle = '#ff4757';
          ctx.beginPath();
          ctx.arc(-15, -goal.height + 18, 6, 0, Math.PI * 2);
          ctx.arc(15, -goal.height + 18, 6, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#fffa65';
          ctx.beginPath();
          ctx.arc(-15, -goal.height + 18, 2.5, 0, Math.PI * 2);
          ctx.arc(15, -goal.height + 18, 2.5, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#000000';
          const mouthH = goal.mouthOpen > 0 ? 16 : 8;
          ctx.fillRect(-20, -goal.height + 28, 40, mouthH);

          ctx.fillStyle = '#ffffff';
          for (let tx = -18; tx <= 14; tx += 8) {
            ctx.beginPath();
            ctx.moveTo(tx, -goal.height + 28);
            ctx.lineTo(tx + 4, -goal.height + 34);
            ctx.lineTo(tx + 8, -goal.height + 28);
            ctx.fill();
          }

          ctx.restore();
        }
      });
    }

    function drawChasingFakeChests(parallaxFactor) {
      fakeTreasures.forEach(fake => {
        const renderX = fake.x - camera.x * parallaxFactor;
        if (renderX > -100 && renderX < canvas.width + 100) {
          ctx.save();
          ctx.translate(renderX, fake.y);

          // Aboveground Chest Body
          ctx.fillStyle = '#8b5a2b';
          ctx.fillRect(-16, -12, 32, 18);

          ctx.fillStyle = '#212529'; // Iron Trim
          ctx.fillRect(-16, -12, 4, 18);
          ctx.fillRect(12, -12, 4, 18);

          // Snapping Mouth Lid
          const mouthOffset = Math.sin(fake.mouthOpenFrame) * 6;
          ctx.fillStyle = '#a0522d';
          ctx.fillRect(-16, -18 - mouthOffset, 32, 7);

          // Sharp Teeth Inside Mouth
          ctx.fillStyle = '#ff4757';
          ctx.fillRect(-12, -12 - mouthOffset, 24, mouthOffset + 4);

          ctx.fillStyle = '#ffffff';
          for (let tx = -12; tx <= 8; tx += 6) {
            ctx.beginPath();
            ctx.moveTo(tx, -12);
            ctx.lineTo(tx + 3, -12 - mouthOffset);
            ctx.lineTo(tx + 6, -12);
            ctx.fill();
          }

          // Glowing Red Eyes
          ctx.fillStyle = '#ff4757';
          ctx.beginPath();
          ctx.arc(-6, -7, 2.5, 0, Math.PI * 2);
          ctx.arc(6, -7, 2.5, 0, Math.PI * 2);
          ctx.fill();

          ctx.restore();
        }
      });
    }

    function drawDragon(parallaxFactor) {
      const renderX = dragon.x - camera.x * parallaxFactor;
      if (renderX > -200 && renderX < canvas.width + 200) {
        ctx.save();
        ctx.translate(renderX, dragon.y);
        ctx.scale(dragon.facing, 1);

        ctx.fillStyle = '#ff4757';
        ctx.beginPath();
        ctx.ellipse(0, 0, 42, 26, 0, 0, Math.PI * 2);
        ctx.fill();

        const wingSway = Math.sin(dragon.hoverTimer * 3) * 20;
        ctx.fillStyle = '#ffa502';
        ctx.beginPath();
        ctx.moveTo(-10, -10);
        ctx.lineTo(-45, -50 + wingSway);
        ctx.lineTo(20, -15);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#ff4757';
        ctx.beginPath();
        ctx.arc(-40, -15, 18, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#fffa65';
        ctx.beginPath();
        ctx.moveTo(-35, -28); ctx.lineTo(-25, -45); ctx.lineTo(-20, -28); ctx.fill();

        ctx.fillStyle = '#fffa65';
        ctx.beginPath();
        ctx.arc(-46, -18, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#000000';
        ctx.fillRect(-48, -20, 2, 5);

        ctx.fillStyle = '#ffa502';
        ctx.fillRect(-58, -12, 16, 12);

        ctx.restore();
      }
    }

    function drawFireballs(parallaxFactor) {
      fireballs.forEach(fb => {
        const renderX = fb.x - camera.x * parallaxFactor;
        ctx.fillStyle = '#ffa502';
        ctx.beginPath();
        ctx.arc(renderX, fb.y, fb.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#fffa65';
        ctx.beginPath();
        ctx.arc(renderX, fb.y, fb.radius * 0.5, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function drawTreasureChest(parallaxFactor) {
      const renderX = treasure.x - camera.x * parallaxFactor;
      if (renderX < -100 || renderX > canvas.width + 100) return;

      if (treasure.state === 'uncovered' || treasure.state === 'opened') {
        ctx.fillStyle = '#3a2312';
        ctx.beginPath();
        ctx.ellipse(renderX, treasure.y + 6, 18, 8, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffb703';
        ctx.fillRect(renderX - 14, treasure.y - 10, 28, 16);

        ctx.fillStyle = '#212529';
        ctx.fillRect(renderX - 14, treasure.y - 10, 4, 16);
        ctx.fillRect(renderX + 10, treasure.y - 10, 4, 16);

        if (treasure.state === 'uncovered') {
          ctx.fillStyle = '#fb8500';
          ctx.fillRect(renderX - 14, treasure.y - 15, 28, 6);
          ctx.fillStyle = '#fffa65';
          ctx.fillRect(renderX - 3, treasure.y - 8, 6, 6);
        } else {
          ctx.fillStyle = '#fb8500';
          ctx.fillRect(renderX - 14, treasure.y - 20, 28, 5);
          ctx.fillStyle = '#fffa65';
          ctx.fillRect(renderX - 10, treasure.y - 10, 20, 6);
        }
      }
    }

    function drawCoins(parallaxFactor) {
      coins.forEach(coin => {
        if (!coin.collected) {
          const renderX = coin.x - camera.x * parallaxFactor;
          if (renderX > -30 && renderX < canvas.width + 30) {
            ctx.save();
            ctx.translate(renderX, coin.y);
            ctx.rotate(coin.rotation);

            ctx.fillStyle = '#fffa65';
            ctx.strokeStyle = '#ffa502';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.ellipse(0, 0, 6, 6, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.restore();
          }
        }
      });
    }

    function drawParticles(parallaxFactor) {
      particles.forEach(p => {
        const renderX = p.x - camera.x * parallaxFactor;
        ctx.fillStyle = p.color;
        ctx.fillRect(renderX, p.y, 3.5, 3.5);
      });
    }

    function drawFloatingTexts(parallaxFactor) {
      floatingTexts.forEach(ft => {
        const renderX = ft.x - camera.x * parallaxFactor;
        ctx.font = '900 15px "Segoe UI", sans-serif';
        ctx.fillStyle = ft.color;
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 3;
        ctx.strokeText(ft.text, renderX, ft.y);
        ctx.fillText(ft.text, renderX, ft.y);
      });
    }

    function drawStickman(x, y, facing, walkFrame, isDigging, parallaxFactor) {
      const renderX = x - camera.x * parallaxFactor;

      if (player.invulnerableTimer > 0 && Math.floor(player.invulnerableTimer / 4) % 2 === 0) {
        return;
      }

      ctx.strokeStyle = '#000000';
      ctx.fillStyle = '#000000';
      ctx.lineWidth = 2.6;
      ctx.lineCap = 'round';

      const headRadius = 6;
      const bodyLength = 17;
      const legLength = 13;
      const neckY = y - bodyLength;
      const headY = neckY - headRadius;
      const shoulderY = neckY + 4;

      // Head
      ctx.beginPath();
      ctx.arc(renderX, headY, headRadius, 0, Math.PI * 2);
      ctx.stroke();

      // Eye
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(renderX + facing * 2.5, headY - 1, 1.2, 0, Math.PI * 2);
      ctx.fill();

      // Torso
      ctx.strokeStyle = '#000000';
      ctx.beginPath();
      ctx.moveTo(renderX, neckY);
      ctx.lineTo(renderX, y);
      ctx.stroke();

      // Legs
      const legSwing = Math.sin(walkFrame) * 7;
      ctx.beginPath(); ctx.moveTo(renderX, y); ctx.lineTo(renderX - legSwing, y + legLength); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(renderX, y); ctx.lineTo(renderX + legSwing, y + legLength); ctx.stroke();

      // Arms / Shovel
      if (isDigging) {
        ctx.beginPath(); ctx.moveTo(renderX, shoulderY); ctx.lineTo(renderX + facing * 9, shoulderY + 9); ctx.stroke();
        ctx.strokeStyle = '#7f5539';
        ctx.beginPath(); ctx.moveTo(renderX + facing * 4, shoulderY + 3); ctx.lineTo(renderX + facing * 14, y + legLength); ctx.stroke();
        ctx.fillStyle = '#a4b0be';
        ctx.fillRect(renderX + facing * 12, y + legLength - 2, 6, 6);
      } else {
        const armSwing = Math.sin(walkFrame + Math.PI) * 5;
        ctx.beginPath(); ctx.moveTo(renderX, shoulderY); ctx.lineTo(renderX - facing * 5 - armSwing, shoulderY + 7); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(renderX, shoulderY); ctx.lineTo(renderX + facing * 5 + armSwing, shoulderY + 7); ctx.stroke();
      }
    }

    function drawWorldTrees(parallaxFactor) {
      const sortedTrees = [...worldTrees].sort((a, b) => a.y - b.y);
      sortedTrees.forEach(t => {
        const renderX = t.x - camera.x * parallaxFactor;
        if (renderX > -120 && renderX < canvas.width + 120) {
          drawPineTree(renderX, t.y, t.scale, '#4a2e1b', '#26af5f');
        }
      });
    }

    function drawForegroundTrees(parallaxFactor) {
      foregroundTrees.forEach(t => {
        const renderX = t.x - camera.x * parallaxFactor;
        if (renderX > -200 && renderX < canvas.width + 200) {
          drawPineTree(renderX, t.y, t.scale, '#2d1810', '#105c30');
        }
      });
    }

    function draw() {
      ctx.save();
      if (camera.shake > 0.5) {
        ctx.translate((Math.random() - 0.5) * camera.shake, (Math.random() - 0.5) * camera.shake);
      }

      drawBrightSky();
      drawClouds(0.15);
      drawLoomingCastle(0.25);
      drawBackgroundTrees(0.45);
      drawGround();

      drawEvilSoccerGoals(1.0);
      drawChasingFakeChests(1.0);
      drawTreasureChest(1.0);
      drawCoins(1.0);
      drawDragon(1.0);
      drawFireballs(1.0);

      drawStickman(player.x, player.y, player.facing, player.walkFrame, player.isDigging, 1.0);

      drawWorldTrees(1.0);
      drawParticles(1.0);
      drawFloatingTexts(1.0);
      drawForegroundTrees(1.35);

      ctx.restore();
    }

    function animate() {
      updatePhysics();
      draw();
      requestAnimationFrame(animate);
    }

    window.onload = function() {
      resizeCanvas();
      animate();
    };
  </script>
</body>
</html>
