<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Stickman City Navigator - Kasunich Team 1</title>
 <style>
 * {
 box-sizing: border-box;
 user-select: none;
 margin: 0;
 padding: 0;
 font-family: 'Courier New', Courier, monospace, sans-serif;
 }

 body {
 background-color: #0d0d0d;
 color: #ffffff;
 display: flex;
 flex-direction: column;
 align-items: center;
 justify-content: flex-start;
 height: 100vh;
 overflow: hidden;
 padding: 12px;
 }

 #header {
 display: flex;
 justify-content: space-between;
 align-items: center;
 width: 100%;
 max-width: 1100px;
 margin-bottom: 8px;
 padding-bottom: 8px;
 border-bottom: 1px solid #444444;
 }

 .title-group {
 display: flex;
 flex-direction: column;
 }

 h1 {
 font-size: 18px;
 letter-spacing: 2px;
 text-transform: uppercase;
 font-weight: bold;
 color: #ffffff;
 }

 #location-info {
 font-size: 13px;
 color: #ffcc00;
 margin-top: 2px;
 font-weight: bold;
 }

 /* Key Inventory Badge Bar */
 #key-inventory {
 display: flex;
 align-items: center;
 gap: 8px;
 background: #1a1a1a;
 padding: 4px 10px;
 border-radius: 4px;
 border: 1px solid #333333;
 }

 .key-label {
 font-size: 11px;
 font-weight: bold;
 color: #aaa;
 text-transform: uppercase;
 margin-right: 2px;
 }

 .key-badge {
 font-size: 10px;
 font-weight: bold;
 padding: 3px 8px;
 border-radius: 3px;
 text-transform: uppercase;
 transition: all 0.2s ease;
 opacity: 0.3;
 border: 1px solid transparent;
 color: #888888;
 background: #222222;
 }

 .key-badge.active.red { opacity: 1; color: #ffffff; background: #c0392b; border-color: #e74c3c; box-shadow: 0 0 8px #e74c3c; }
 .key-badge.active.blue { opacity: 1; color: #ffffff; background: #2980b9; border-color: #3498db; box-shadow: 0 0 8px #3498db; }
 .key-badge.active.green { opacity: 1; color: #ffffff; background: #27ae60; border-color: #2ecc71; box-shadow: 0 0 8px #2ecc71; }
 .key-badge.active.yellow { opacity: 1; color: #000000; background: #f1c40f; border-color: #f39c12; box-shadow: 0 0 8px #f1c40f; }

 .key-badge.unlocked { opacity: 0.5; text-decoration: line-through; background: #111111; border-color: #444444; color: #aaaaaa; box-shadow: none; }

 .btn-reset {
 background: transparent;
 color: #ffffff;
 border: 1px solid #ffffff;
 padding: 6px 16px;
 font-size: 14px;
 font-weight: bold;
 cursor: pointer;
 text-transform: uppercase;
 letter-spacing: 1px;
 transition: all 0.15s ease-in-out;
 }

 .btn-reset:hover {
 background: #ffffff;
 color: #000000;
 }

 #canvas-wrapper {
 position: relative;
 width: 100%;
 max-width: 1100px;
 flex-grow: 1;
 display: flex;
 justify-content: center;
 align-items: center;
 }

 canvas {
 background-color: #000000;
 border: 1px solid #ffffff;
 display: block;
 width: 100%;
 height: 100%;
 }

 .instructions {
 margin-top: 8px;
 font-size: 11px;
 color: #888888;
 text-align: center;
 }

 #victory-modal {
 display: none;
 position: absolute;
 top: 50%;
 left: 50%;
 transform: translate(-50%, -50%);
 background: rgba(0, 0, 0, 0.95);
 border: 2px solid #ffcc00;
 padding: 24px 32px;
 text-align: center;
 border-radius: 6px;
 box-shadow: 0 0 20px rgba(255, 204, 0, 0.5);
 z-index: 10;
 }

 #victory-modal h2 {
 color: #ffcc00;
 font-size: 22px;
 margin-bottom: 10px;
 text-transform: uppercase;
 }

 #victory-modal p {
 font-size: 13px;
 color: #ffffff;
 margin-bottom: 16px;
 }
 </style>
</head>
<body>

 <div id="header">
 <div class="title-group">
 <h1>Stickman City Navigator</h1>
 <div id="location-info">Sector: Stadium</div>
 </div>

 <div id="key-inventory">
 <span class="key-label">Keys:</span>
 <span id="badge-red" class="key-badge red">Red</span>
 <span id="badge-blue" class="key-badge blue">Blue</span>
 <span id="badge-green" class="key-badge green">Green</span>
 <span id="badge-yellow" class="key-badge yellow">Yellow</span>
 </div>

 <button class="btn-reset" onclick="resetGame()">Reset Game</button>
 </div>

 <div id="canvas-wrapper">
 <canvas id="simCanvas"></canvas>
 
 <div id="victory-modal">
 <h2>Goal Reached!</h2>
 <p>Stickman unlocked all 4 color walls and reached RYFFR!</p>
 <button class="btn-reset" onclick="resetGame()">Play Again</button>
 </div>
 </div>

 <div class="instructions">
 Movement: [WASD] Keys Only | Collect keys & touch matching walls at RYFFR to unlock them!
 </div>

 <script>
 const canvas = document.getElementById('simCanvas');
 const ctx = canvas.getContext('2d');

 const keys = {};

 const GRID_SIZE = 5;
 const CENTER = 2;

 const TILE_TYPES = {
 STADIUM: 'Stadium (Center Field)',
 DENSE_CITY: 'Dense City',
 PARK: 'Park',
 RESIDENTIAL: 'Residential District',
 INDUSTRIAL: 'Industrial Zone',
 RYFFR: 'Red & Yellow Fast Food Restaurant'
 };

 const KEY_COLORS = {
 red: { hex: '#e74c3c', name: 'Red Key' },
 blue: { hex: '#2980b9', name: 'Blue Key' },
 green: { hex: '#2ecc71', name: 'Green Key' },
 yellow: { hex: '#f1c40f', name: 'Yellow Key' }
 };

 let cityGrid = [];
 let currentGridX = CENTER;
 let currentGridY = CENTER;
 let ryffrX = 0;
 let ryffrY = 0;
 let hasWon = false;

 // RYFFR Wall & Key State
 let wallOrder = ['red', 'blue', 'green', 'yellow'];
 let hasKey = { red: false, blue: false, green: false, yellow: false };
 let unlockedWalls = { red: false, blue: false, green: false, yellow: false };

 // BASELINE SIDE-VIEW STICKMAN
 const player = {
 x: 0,
 y: 0,
 speed: 4.0,
 facing: 1,
 walkFrame: 0
 };

 function seededRandom(seed) {
 const x = Math.sin(seed++) * 10000;
 return x - Math.floor(x);
 }

 function shuffleArray(arr) {
 for (let i = arr.length - 1; i > 0; i--) {
 const j = Math.floor(Math.random() * (i + 1));
 [arr[i], arr[j]] = [arr[j], arr[i]];
 }
 return arr;
 }

 function generateCityMap() {
 hasKey = { red: false, blue: false, green: false, yellow: false };
 unlockedWalls = { red: false, blue: false, green: false, yellow: false };
 wallOrder = shuffleArray(['red', 'blue', 'green', 'yellow']);
 updateKeyInventoryUI();

 cityGrid = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(null));

 cityGrid[CENTER][CENTER] = { type: TILE_TYPES.STADIUM, seed: Math.random() * 1000, key: null };

 const outerCoords = [];
 for (let x = 0; x < GRID_SIZE; x++) {
 for (let y = 0; y < GRID_SIZE; y++) {
 if ((x === 0 || x === GRID_SIZE - 1 || y === 0 || y === GRID_SIZE - 1) && !(x === CENTER && y === CENTER)) {
 outerCoords.push({ x, y });
 }
 }
 }
 const randomOuterIndex = Math.floor(Math.random() * outerCoords.length);
 ryffrX = outerCoords[randomOuterIndex].x;
 ryffrY = outerCoords[randomOuterIndex].y;
 cityGrid[ryffrX][ryffrY] = { type: TILE_TYPES.RYFFR, seed: Math.random() * 1000, key: null };

 const interveningTypes = [
 TILE_TYPES.DENSE_CITY,
 TILE_TYPES.PARK,
 TILE_TYPES.RESIDENTIAL,
 TILE_TYPES.INDUSTRIAL
 ];

 const availableKeyTiles = [];

 for (let x = 0; x < GRID_SIZE; x++) {
 for (let y = 0; y < GRID_SIZE; y++) {
 if (!cityGrid[x][y]) {
 const randomType = interveningTypes[Math.floor(Math.random() * interveningTypes.length)];
 cityGrid[x][y] = { type: randomType, seed: Math.floor(Math.random() * 10000), key: null };
 availableKeyTiles.push({ x, y });
 }
 }
 }

 // Scatter 4 keys onto 4 distinct map tiles somewhere on paved roads
 shuffleArray(availableKeyTiles);
 const colorKeys = ['red', 'blue', 'green', 'yellow'];
 for (let i = 0; i < 4 && i < availableKeyTiles.length; i++) {
 const pos = availableKeyTiles[i];
 const isHorizontal = Math.random() < 0.5;
 let xRatio, yRatio;

 if (isHorizontal) {
 xRatio = 0.12 + Math.random() * 0.76;
 yRatio = 0.40 + Math.random() * 0.20;
 } else {
 xRatio = 0.40 + Math.random() * 0.20;
 yRatio = 0.12 + Math.random() * 0.76;
 }

 cityGrid[pos.x][pos.y].key = colorKeys[i];
 cityGrid[pos.x][pos.y].keyXRatio = xRatio;
 cityGrid[pos.x][pos.y].keyYRatio = yRatio;
 }
 }

 function updateKeyInventoryUI() {
 Object.keys(KEY_COLORS).forEach(color => {
 const badge = document.getElementById(`badge-${color}`);
 if (badge) {
 if (unlockedWalls[color]) {
 badge.className = `key-badge unlocked ${color}`;
 badge.innerText = `${color.toUpperCase()} (UNLOCKED)`;
 } else if (hasKey[color]) {
 badge.className = `key-badge active ${color}`;
 badge.innerText = `${color.toUpperCase()} (HELD)`;
 } else {
 badge.className = `key-badge ${color}`;
 badge.innerText = color.toUpperCase();
 }
 }
 });
 }

 function resizeCanvas() {
 const wrapper = document.getElementById('canvas-wrapper');
 canvas.width = wrapper.clientWidth;
 canvas.height = wrapper.clientHeight;
 
 if (player.x === 0 && player.y === 0) {
 resetPlayerToCenter();
 }
 }

 window.addEventListener('resize', resizeCanvas);

 // STRICT WASD CONTROLS (ARROW KEYS BLOCKED)
 window.addEventListener('keydown', (e) => {
 if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
 e.preventDefault();
 return;
 }

 if (['KeyW', 'KeyA', 'KeyS', 'KeyD'].includes(e.code)) {
 e.preventDefault();
 keys[e.code] = true;
 }
 });

 window.addEventListener('keyup', (e) => {
 if (['KeyW', 'KeyA', 'KeyS', 'KeyD'].includes(e.code)) {
 keys[e.code] = false;
 }
 });

 function resetPlayerToCenter() {
 player.x = canvas.width / 2;
 player.y = canvas.height / 2;
 player.facing = 1;
 player.walkFrame = 0;
 }

 function resetGame() {
 currentGridX = CENTER;
 currentGridY = CENTER;
 generateCityMap();
 resetPlayerToCenter();
 hasWon = false;
 document.getElementById('victory-modal').style.display = 'none';
 updateLocationUI();
 }

 function updateLocationUI() {
 const currentTile = cityGrid[currentGridX][currentGridY];
 document.getElementById('location-info').innerText = 
 `Sector [${currentGridX + 1},${currentGridY + 1}]: ${currentTile.type}`;
 }

 function getRoadBounds() {
 const w = canvas.width;
 const h = canvas.height;
 const roadW = w * 0.25;
 const roadH = h * 0.25;
 return {
 minX: (w - roadW) / 2,
 maxX: (w + roadW) / 2,
 minY: (h - roadH) / 2,
 maxY: (h + roadH) / 2,
 roadW,
 roadH
 };
 }

 // WALKABILITY CHECK (WALLS BLOCK UNTIL EXPLICITLY TOUCHED AND UNLOCKED)
 function isWalkable(px, py) {
 const b = getRoadBounds();
 const currentTile = cityGrid[currentGridX][currentGridY];

 if (currentTile.type === TILE_TYPES.STADIUM) {
 const rx = canvas.width * 0.38;
 const ry = canvas.height * 0.38;
 const cx = canvas.width / 2;
 const cy = canvas.height / 2;
 const inStadiumField = (Math.pow(px - cx, 2) / Math.pow(rx, 2) + Math.pow(py - cy, 2) / Math.pow(ry, 2)) <= 1;

 const inNorthExit = (px >= b.minX && px <= b.maxX && py <= b.minY);
 const inSouthExit = (px >= b.minX && px <= b.maxX && py >= b.maxY);
 const inWestExit = (py >= b.minY && py <= b.maxY && px <= b.minX);
 const inEastExit = (py >= b.minY && py <= b.maxY && px >= b.maxX);

 return inStadiumField || inNorthExit || inSouthExit || inWestExit || inEastExit;
 } 
 else if (currentTile.type === TILE_TYPES.RYFFR) {
 const inHorizontalRoad = (py >= b.minY && py <= b.maxY);
 const inVerticalRoad = (px >= b.minX && px <= b.maxX);
 if (!inHorizontalRoad && !inVerticalRoad) return false;

 // RYFFR Color Wall Blocking Logic
 const cx = canvas.width / 2;
 const cy = canvas.height / 2;
 const distFromCenter = Math.hypot(px - cx, py - cy);

 const bw = b.roadW * 0.85;
 const bh = b.roadH * 0.85;
 const baseBuildingRadius = Math.max(bw, bh) / 2;

 for (let i = 0; i < 4; i++) {
 const colorKey = wallOrder[i];
 const pad = (4 - i) * 16;
 const wallRadius = baseBuildingRadius + pad;

 // Wall blocks passage until UNLOCKED (Holding key alone doesn't pass until touched)
 if (!unlockedWalls[colorKey] && distFromCenter < wallRadius + 6) {
 return false;
 }
 }
 return true;
 } 
 else {
 const inHorizontalRoad = (py >= b.minY && py <= b.maxY);
 const inVerticalRoad = (px >= b.minX && px <= b.maxX);
 return inHorizontalRoad || inVerticalRoad;
 }
 }

 function getQuadrants() {
 const b = getRoadBounds();
 return [
 { x: 0, y: 0, w: b.minX, h: b.minY, id: 'TL' },
 { x: b.maxX, y: 0, w: b.minX, h: b.minY, id: 'TR' },
 { x: 0, y: b.maxY, w: b.minX, h: b.minY, id: 'BL' },
 { x: b.maxX, y: b.maxY, w: b.minX, h: b.minY, id: 'BR' }
 ];
 }

 function updatePhysics() {
 if (hasWon) return;

 let dx = 0;
 let dy = 0;

 if (keys['KeyW']) dy -= 1;
 if (keys['KeyS']) dy += 1;
 if (keys['KeyA']) { dx -= 1; player.facing = -1; }
 if (keys['KeyD']) { dx += 1; player.facing = 1; }

 if (dx !== 0 && dy !== 0) {
 dx *= 0.7071;
 dy *= 0.7071;
 }

 const nextX = player.x + dx * player.speed;
 const nextY = player.y + dy * player.speed;

 if (isWalkable(nextX, player.y)) {
 player.x = nextX;
 }
 if (isWalkable(player.x, nextY)) {
 player.y = nextY;
 }

 if (dx !== 0 || dy !== 0) {
 player.walkFrame += 0.25;
 } else {
 player.walkFrame = 0;
 }

 const currentTile = cityGrid[currentGridX][currentGridY];

 // 1. Check Key Pickup Collision (Pick up key into inventory)
 if (currentTile.key && !hasKey[currentTile.key]) {
 const keyX = currentTile.keyXRatio * canvas.width;
 const keyY = currentTile.keyYRatio * canvas.height;
 const distToKey = Math.hypot(player.x - keyX, player.y - keyY);
 if (distToKey < 25) {
 hasKey[currentTile.key] = true;
 updateKeyInventoryUI();
 }
 }

 // 2. Check Wall Touch Unlocking at RYFFR Screen
 if (currentTile.type === TILE_TYPES.RYFFR) {
 const b = getRoadBounds();
 const cx = canvas.width / 2;
 const cy = canvas.height / 2;
 const distFromCenter = Math.hypot(player.x - cx, player.y - cy);

 const bw = b.roadW * 0.85;
 const bh = b.roadH * 0.85;
 const baseBuildingRadius = Math.max(bw, bh) / 2;

 for (let i = 0; i < 4; i++) {
 const colorKey = wallOrder[i];
 const pad = (4 - i) * 16;
 const wallRadius = baseBuildingRadius + pad;

 // If Stickman holds matching key, hasn't unlocked wall yet, and touches the barrier:
 if (hasKey[colorKey] && !unlockedWalls[colorKey]) {
 if (Math.abs(distFromCenter - wallRadius) < 18) {
 unlockedWalls[colorKey] = true;
 updateKeyInventoryUI();
 }
 }
 }

 // Check RYFFR Goal Trigger
 const distToRYFFR = Math.hypot(player.x - cx, player.y - cy);
 if (distToRYFFR < 35) {
 hasWon = true;
 document.getElementById('victory-modal').style.display = 'block';
 }
 }

 const margin = 10;
 const w = canvas.width;
 const h = canvas.height;

 if (player.x < margin) {
 if (currentGridX > 0) {
 currentGridX--;
 player.x = w - margin - 5;
 updateLocationUI();
 } else {
 player.x = margin;
 }
 } else if (player.x > w - margin) {
 if (currentGridX < GRID_SIZE - 1) {
 currentGridX++;
 player.x = margin + 5;
 updateLocationUI();
 } else {
 player.x = w - margin;
 }
 }

 if (player.y < margin) {
 if (currentGridY > 0) {
 currentGridY--;
 player.y = h - margin - 5;
 updateLocationUI();
 } else {
 player.y = margin;
 }
 } else if (player.y > h - margin) {
 if (currentGridY < GRID_SIZE - 1) {
 currentGridY++;
 player.y = margin + 5;
 updateLocationUI();
 } else {
 player.y = h - margin;
 }
 }
 }

 function drawPlusSignRoad(w, h) {
 const b = getRoadBounds();

 ctx.fillStyle = '#2c3e50';
 ctx.fillRect(0, b.minY, w, b.roadH);
 ctx.fillRect(b.minX, 0, b.roadW, h);

 ctx.fillStyle = '#7f8c8d';
 ctx.fillRect(0, b.minY - 3, w, 3);
 ctx.fillRect(0, b.maxY, w, 3);
 ctx.fillRect(b.minX - 3, 0, 3, h);
 ctx.fillRect(b.maxX, 0, 3, h);

 ctx.strokeStyle = '#f1c40f';
 ctx.lineWidth = 2;
 ctx.setLineDash([8, 8]);
 ctx.beginPath();
 ctx.moveTo(0, h / 2); ctx.lineTo(w, h / 2);
 ctx.moveTo(w / 2, 0); ctx.lineTo(w / 2, h);
 ctx.stroke();
 ctx.setLineDash([]);

 ctx.fillStyle = '#ffffff';
 for (let i = 0; i < b.roadW; i += 8) {
 ctx.fillRect(b.minX + i, b.minY - 10, 5, 8);
 ctx.fillRect(b.minX + i, b.maxY + 2, 5, 8);
 }
 for (let i = 0; i < b.roadH; i += 8) {
 ctx.fillRect(b.minX - 10, b.minY + i, 8, 5);
 ctx.fillRect(b.maxX + 2, b.minY + i, 8, 5);
 }
 }

 function drawCar(x, y, color, horizontal = true) {
 ctx.fillStyle = color;
 if (horizontal) {
 ctx.fillRect(x, y, 22, 10);
 ctx.fillStyle = '#87ceeb';
 ctx.fillRect(x + 12, y + 2, 5, 6);
 ctx.fillStyle = '#000000';
 ctx.fillRect(x + 2, y - 2, 4, 2);
 ctx.fillRect(x + 16, y - 2, 4, 2);
 ctx.fillRect(x + 2, y + 10, 4, 2);
 ctx.fillRect(x + 16, y + 10, 4, 2);
 } else {
 ctx.fillRect(x, y, 10, 22);
 ctx.fillStyle = '#87ceeb';
 ctx.fillRect(x + 2, y + 12, 6, 5);
 ctx.fillStyle = '#000000';
 ctx.fillRect(x - 2, y + 2, 2, 4);
 ctx.fillRect(x - 2, y + 16, 2, 4);
 ctx.fillRect(x + 10, y + 2, 2, 4);
 ctx.fillRect(x + 10, y + 16, 2, 4);
 }
 }

 function drawKeyItem(x, y, colorKey) {
 const colorHex = KEY_COLORS[colorKey].hex;
 ctx.save();
 ctx.translate(x, y);

 const pulse = Math.sin(Date.now() * 0.006) * 3;

 ctx.fillStyle = colorHex;
 ctx.strokeStyle = colorHex;
 ctx.shadowColor = colorHex;
 ctx.shadowBlur = 12 + pulse;

 ctx.lineWidth = 3;
 ctx.beginPath();
 ctx.arc(-8, 0, 7, 0, Math.PI * 2);
 ctx.stroke();

 ctx.beginPath();
 ctx.moveTo(-1, 0); ctx.lineTo(12, 0);
 ctx.moveTo(6, 0); ctx.lineTo(6, 6);
 ctx.moveTo(10, 0); ctx.lineTo(10, 6);
 ctx.stroke();

 ctx.restore();
 }

 // ==================== SECTOR DRAWER FUNCTIONS ====================

 function drawStadium(w, h) {
 const b = getRoadBounds();
 const cx = w / 2;
 const cy = h / 2;

 ctx.fillStyle = '#11161b';
 ctx.fillRect(0, 0, w, h);

 ctx.fillStyle = '#2c3e50';
 ctx.beginPath();
 ctx.ellipse(cx, cy, w * 0.47, h * 0.47, 0, 0, Math.PI * 2);
 ctx.fill();

 const tierColors = ['#1f2a36', '#283747', '#34495e', '#2c3e50'];
 const crowdColors = ['#e74c3c', '#3498db', '#f1c40f', '#2ecc71', '#ecf0f1', '#e67e22', '#9b59b6'];

 for (let i = 0; i < 6; i++) {
 const rx = w * (0.46 - i * 0.015);
 const ry = h * (0.46 - i * 0.015);
 ctx.fillStyle = tierColors[i % tierColors.length];
 ctx.beginPath();
 ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
 ctx.fill();

 ctx.strokeStyle = '#111';
 ctx.lineWidth = 1;
 for (let angle = 0; angle < Math.PI * 2; angle += 0.08) {
 const px = cx + Math.cos(angle) * (rx - 4);
 const py = cy + Math.sin(angle) * (ry - 4);
 if (seededRandom(i * 100 + angle * 10) > 0.2) {
 ctx.fillStyle = crowdColors[Math.floor(seededRandom(i * 50 + angle) * crowdColors.length)];
 ctx.fillRect(px, py, 2.5, 2.5);
 }
 }
 }

 ctx.fillStyle = '#2c3e50';
 ctx.fillRect(b.minX, 0, b.roadW, b.minY);
 ctx.fillRect(b.minX, b.maxY, b.roadW, h - b.maxY);
 ctx.fillRect(0, b.minY, b.minX, b.roadH);
 ctx.fillRect(b.maxX, b.minY, w - b.maxX, b.roadH);

 ctx.fillStyle = '#f1c40f';
 ctx.fillRect(b.minX, 0, 4, b.minY); ctx.fillRect(b.maxX - 4, 0, 4, b.minY);
 ctx.fillRect(b.minX, b.maxY, 4, h - b.maxY); ctx.fillRect(b.maxX - 4, b.maxY, 4, h - b.maxY);
 ctx.fillRect(0, b.minY, b.minX, 4); ctx.fillRect(0, b.maxY - 4, b.minX, 4);
 ctx.fillRect(b.maxX, b.minY, w - b.maxX, 4); ctx.fillRect(b.maxX, b.maxY - 4, w - b.maxX, 4);

 ctx.fillStyle = '#111';
 ctx.fillRect(cx - 35, b.minY - 14, 70, 12);
 ctx.fillRect(cx - 35, b.maxY + 2, 70, 12);
 ctx.fillStyle = '#00ffcc';
 ctx.font = 'bold 9px monospace';
 ctx.textAlign = 'center';
 ctx.fillText('NORTH EXIT', cx, b.minY - 5);
 ctx.fillText('SOUTH EXIT', cx, b.maxY + 11);

 ctx.fillStyle = '#a04000';
 ctx.beginPath();
 ctx.ellipse(cx, cy, w * 0.38, h * 0.38, 0, 0, Math.PI * 2);
 ctx.fill();

 ctx.strokeStyle = '#ffffff';
 ctx.lineWidth = 1;
 ctx.stroke();

 ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
 ctx.beginPath();
 ctx.ellipse(cx, cy, w * 0.35, h * 0.35, 0, 0, Math.PI * 2);
 ctx.stroke();

 ctx.fillStyle = '#27ae60';
 ctx.beginPath();
 ctx.ellipse(cx, cy, w * 0.32, h * 0.32, 0, 0, Math.PI * 2);
 ctx.fill();

 ctx.strokeStyle = '#ffffff';
 ctx.lineWidth = 1.5;
 for (let x = cx - w * 0.22; x <= cx + w * 0.22; x += 18) {
 ctx.beginPath();
 ctx.moveTo(x, cy - h * 0.2);
 ctx.lineTo(x, cy + h * 0.2);
 ctx.stroke();
 }

 ctx.beginPath();
 ctx.arc(cx, cy, 22, 0, Math.PI * 2);
 ctx.stroke();
 ctx.fillStyle = '#f1c40f';
 ctx.font = 'bold 16px sans-serif';
 ctx.fillText('★', cx, cy + 5);

 ctx.strokeStyle = '#f1c40f';
 ctx.lineWidth = 2;
 const gxW = cx - w * 0.24;
 ctx.beginPath(); ctx.moveTo(gxW, cy - 14); ctx.lineTo(gxW, cy + 14); ctx.stroke();
 ctx.beginPath(); ctx.moveTo(gxW, cy); ctx.lineTo(gxW - 8, cy); ctx.stroke();
 const gxE = cx + w * 0.24;
 ctx.beginPath(); ctx.moveTo(gxE, cy - 14); ctx.lineTo(gxE, cy + 14); ctx.stroke();
 ctx.beginPath(); ctx.moveTo(gxE, cy); ctx.lineTo(gxE + 8, cy); ctx.stroke();

 ctx.fillStyle = '#34495e';
 ctx.fillRect(cx - 30, cy - h * 0.26, 60, 5);
 ctx.fillRect(cx - 30, cy + h * 0.25, 60, 5);
 ctx.fillStyle = '#2980b9';
 ctx.fillRect(cx - 38, cy - h * 0.27, 5, 7);
 ctx.fillRect(cx + 33, cy + h * 0.24, 5, 7);

 ctx.fillStyle = '#000000';
 ctx.fillRect(cx - 70, 8, 140, 22);
 ctx.strokeStyle = '#f1c40f';
 ctx.lineWidth = 2;
 ctx.strokeRect(cx - 70, 8, 140, 22);
 ctx.fillStyle = '#f1c40f';
 ctx.font = 'bold 10px monospace';
 ctx.fillText('HOME 24 - GUEST 21 | Q4 01:45', cx, 23);

 const towers = [
 { x: 20, y: 20 }, { x: w - 20, y: 20 },
 { x: 20, y: h - 20 }, { x: w - 20, y: h - 20 }
 ];
 towers.forEach(t => {
 ctx.fillStyle = '#7f8c8d';
 ctx.fillRect(t.x - 6, t.y - 6, 12, 12);
 ctx.fillStyle = '#ffffff';
 ctx.beginPath();
 ctx.arc(t.x, t.y, 4, 0, Math.PI * 2);
 ctx.fill();
 });
 }

 function drawDenseCity(w, h, seed) {
 ctx.fillStyle = '#111111';
 ctx.fillRect(0, 0, w, h);

 const quads = getQuadrants();
 const bColors = ['#1a252f', '#2c3e50', '#34495e', '#22313f', '#1c2833'];
 const neonColors = ['#e74c3c', '#00f0ff', '#f1c40f', '#e67e22', '#9b59b6'];

 quads.forEach((q, qIdx) => {
 const cols = 4, rows = 3;
 const bw = (q.w - 16) / cols;
 const bh = (q.h - 16) / rows;

 for (let r = 0; r < rows; r++) {
 for (let c = 0; c < cols; c++) {
 const bx = q.x + 8 + c * bw;
 const by = q.y + 8 + r * bh;
 const cSeed = seed + qIdx * 20 + r * cols + c;

 ctx.fillStyle = bColors[Math.floor(seededRandom(cSeed) * bColors.length)];
 ctx.fillRect(bx + 1, by + 1, bw - 2, bh - 2);
 ctx.strokeStyle = '#000000';
 ctx.lineWidth = 1;
 ctx.strokeRect(bx + 1, by + 1, bw - 2, bh - 2);

 ctx.fillStyle = '#f1c40f';
 for (let wx = bx + 4; wx < bx + bw - 4; wx += 5) {
 for (let wy = by + 4; wy < by + bh - 4; wy += 5) {
 if (seededRandom(cSeed + wx * 10 + wy) > 0.35) {
 ctx.fillRect(wx, wy, 2.5, 2.5);
 }
 }
 }

 if (seededRandom(cSeed + 99) > 0.6) {
 ctx.fillStyle = neonColors[Math.floor(seededRandom(cSeed + 88) * neonColors.length)];
 ctx.fillRect(bx + 3, by + 2, bw - 6, 3);
 } else {
 ctx.fillStyle = '#555555';
 ctx.fillRect(bx + bw / 2 - 3, by + bh / 2 - 3, 6, 6);
 }
 }
 }

 const carColor = neonColors[Math.floor(seededRandom(seed + qIdx) * neonColors.length)];
 if (q.id.includes('T')) {
 drawCar(q.x + q.w / 2 - 10, q.h - 16, carColor, true);
 } else {
 drawCar(q.x + q.w / 2 - 10, q.y + 6, carColor, true);
 }
 });

 drawPlusSignRoad(w, h);
 }

 function drawPark(w, h, seed) {
 ctx.fillStyle = '#27ae60';
 ctx.fillRect(0, 0, w, h);

 const quads = getQuadrants();

 quads.forEach((q, qIdx) => {
 ctx.strokeStyle = '#d5c4a1';
 ctx.lineWidth = 8;
 ctx.beginPath();
 ctx.moveTo(q.x + 10, q.y + q.h / 2);
 ctx.quadraticCurveTo(q.x + q.w / 2, q.y + q.h / 2, q.x + q.w - 10, q.y + 10);
 ctx.stroke();

 if (qIdx === 0) {
 const bx = q.x + q.w * 0.4, by = q.y + q.h * 0.4;
 ctx.fillStyle = '#d35400';
 ctx.beginPath(); ctx.arc(bx, by, 22, 0, Math.PI * 2); ctx.fill();
 ctx.fillStyle = '#27ae60';
 ctx.beginPath(); ctx.arc(bx, by, 14, 0, Math.PI * 2); ctx.fill();
 } else if (qIdx === 1) {
 const px = q.x + q.w * 0.5, py = q.y + q.h * 0.5;
 ctx.fillStyle = '#2980b9';
 ctx.beginPath(); ctx.ellipse(px, py, 26, 18, Math.PI / 6, 0, Math.PI * 2); ctx.fill();
 ctx.fillStyle = '#2ecc71';
 ctx.fillRect(px - 6, py - 4, 4, 4); ctx.fillRect(px + 8, py + 2, 4, 4);
 } else if (qIdx === 2) {
 ctx.fillStyle = '#e74c3c';
 ctx.fillRect(q.x + 20, q.y + 20, 24, 4);
 ctx.fillRect(q.x + 22, q.y + 20, 2, 16); ctx.fillRect(q.x + 40, q.y + 20, 2, 16);
 ctx.fillStyle = '#f1c40f';
 ctx.fillRect(q.x + 55, q.y + 25, 16, 8);
 } else {
 ctx.fillStyle = '#795548';
 ctx.fillRect(q.x + 25, q.y + 25, 18, 10); ctx.fillRect(q.x + 55, q.y + 40, 18, 10);
 }

 for (let i = 0; i < 28; i++) {
 const tx = q.x + 10 + seededRandom(seed + qIdx * 30 + i) * (q.w - 20);
 const ty = q.y + 10 + seededRandom(seed + qIdx * 30 + i + 50) * (q.h - 20);

 ctx.fillStyle = '#5d4037';
 ctx.fillRect(tx - 1.5, ty, 3, 6);
 ctx.fillStyle = (i % 2 === 0) ? '#1e8449' : '#145a32';
 ctx.beginPath(); ctx.arc(tx, ty - 3, 8, 0, Math.PI * 2); ctx.fill();
 ctx.fillStyle = '#2ecc71';
 ctx.beginPath(); ctx.arc(tx - 2, ty - 5, 4, 0, Math.PI * 2); ctx.fill();
 }
 });

 drawPlusSignRoad(w, h);
 }

 function drawResidential(w, h, seed) {
 ctx.fillStyle = '#2ecc71';
 ctx.fillRect(0, 0, w, h);

 const quads = getQuadrants();
 const houseColors = ['#c0392b', '#2980b9', '#d35400', '#8e44ad', '#16a085', '#2c3e50'];
 const roofColors = ['#4a235a', '#6e2c00', '#1b2631', '#78281f'];

 quads.forEach((q, qIdx) => {
 const isTop = q.id.includes('T');
 const cols = 3, rows = 2;
 const hW = (q.w - 24) / cols;
 const hH = (q.h - 30) / rows;

 for (let r = 0; r < rows; r++) {
 for (let c = 0; c < cols; c++) {
 const hx = q.x + 8 + c * (hW + 4);
 const hy = q.y + 8 + r * (hH + 8);
 const hSeed = seed + qIdx * 15 + r * cols + c;

 const bCol = houseColors[Math.floor(seededRandom(hSeed) * houseColors.length)];
 const rCol = roofColors[Math.floor(seededRandom(hSeed + 7) * roofColors.length)];

 ctx.fillStyle = '#7f8c8d';
 ctx.fillRect(hx + hW - 10, hy + hH, 8, 12);

 ctx.fillStyle = '#795548';
 ctx.fillRect(hx + 4, hy - 6, 5, 8);

 ctx.fillStyle = bCol;
 ctx.fillRect(hx, hy, hW, hH);
 ctx.strokeStyle = '#111111';
 ctx.lineWidth = 1;
 ctx.strokeRect(hx, hy, hW, hH);

 ctx.fillStyle = rCol;
 ctx.beginPath();
 ctx.moveTo(hx - 3, hy);
 ctx.lineTo(hx + hW / 2, hy - 12);
 ctx.lineTo(hx + hW + 3, hy);
 ctx.closePath();
 ctx.fill();
 ctx.stroke();

 ctx.fillStyle = '#f1c40f';
 ctx.fillRect(hx + 4, hy + 5, 7, 6);
 ctx.fillStyle = '#5d4037';
 ctx.fillRect(hx + hW - 12, hy + hH - 10, 6, 10);

 ctx.strokeStyle = '#ffffff';
 ctx.lineWidth = 1;
 ctx.strokeRect(hx - 2, hy + hH + 2, hW + 4, 3);
 }
 }

 for (let m = q.x + 15; m < q.x + q.w - 15; m += 25) {
 ctx.fillStyle = '#333333';
 const my = isTop ? q.h - 8 : q.y + 4;
 ctx.fillRect(m, my, 2, 6);
 ctx.fillStyle = '#c0392b';
 ctx.fillRect(m - 2, my - 3, 6, 4);
 }
 });

 drawPlusSignRoad(w, h);
 }

 function drawIndustrial(w, h, seed) {
 ctx.fillStyle = '#212a31';
 ctx.fillRect(0, 0, w, h);

 const quads = getQuadrants();
 const containerColors = ['#c0392b', '#2980b9', '#16a085', '#d35400', '#f39c12', '#7f8c8d'];

 quads.forEach((q, qIdx) => {
 ctx.strokeStyle = '#95a5a6';
 ctx.lineWidth = 1.5;
 ctx.setLineDash([3, 3]);
 ctx.strokeRect(q.x + 3, q.y + 3, q.w - 6, q.h - 6);
 ctx.setLineDash([]);

 const fw = q.w * 0.55;
 const fh = q.h * 0.35;
 const fx = q.x + 12;
 const fy = q.y + 12;

 ctx.fillStyle = '#1c2833';
 ctx.fillRect(fx, fy, fw, fh);
 ctx.strokeStyle = '#000000';
 ctx.lineWidth = 1.5;
 ctx.strokeRect(fx, fy, fw, fh);

 ctx.fillStyle = '#566573';
 for (let rx = fx; rx < fx + fw - 8; rx += 10) {
 ctx.beginPath();
 ctx.moveTo(rx, fy);
 ctx.lineTo(rx + 5, fy - 6);
 ctx.lineTo(rx + 10, fy);
 ctx.fill();
 }

 ctx.fillStyle = '#2c3e50';
 ctx.fillRect(fx + 6, fy + fh - 10, 12, 10);
 ctx.fillRect(fx + 22, fy + fh - 10, 12, 10);

 const smX = fx + fw - 10;
 const smY = fy + 8;
 ctx.fillStyle = '#a04000';
 ctx.fillRect(smX, smY - 12, 6, 12);
 ctx.fillStyle = 'rgba(200, 200, 200, 0.4)';
 ctx.beginPath(); ctx.arc(smX + 3, smY - 16, 4, 0, Math.PI * 2); ctx.fill();

 const siloX = q.x + q.w - 30;
 const siloY = q.y + 18;
 ctx.fillStyle = '#bdc3c7';
 ctx.beginPath(); ctx.arc(siloX, siloY, 10, 0, Math.PI * 2); ctx.fill();

 const truckY = q.y + fh + 18;
 const truckX = q.x + 12;
 ctx.fillStyle = '#e74c3c';
 ctx.fillRect(truckX, truckY, 12, 16);
 ctx.fillStyle = '#ecf0f1';
 ctx.fillRect(truckX + 12, truckY - 2, 40, 20);
 ctx.strokeStyle = '#000';
 ctx.strokeRect(truckX + 12, truckY - 2, 40, 20);

 const forkX = q.x + q.w - 45;
 const forkY = q.y + q.h - 30;
 ctx.fillStyle = '#f1c40f';
 ctx.fillRect(forkX, forkY, 14, 10);
 ctx.fillStyle = '#000';
 ctx.fillRect(forkX - 5, forkY + 2, 5, 2);

 let cSeed = seed + qIdx * 12;
 for (let r = 0; r < 2; r++) {
 for (let c = 0; c < 4; c++) {
 const cx = q.x + 12 + c * 22;
 const cy = q.y + q.h - 26 + r * 10;
 if (cx + 20 < q.x + q.w - 10) {
 ctx.fillStyle = containerColors[Math.floor(seededRandom(cSeed++) * containerColors.length)];
 ctx.fillRect(cx, cy, 20, 8);
 ctx.strokeStyle = '#000';
 ctx.lineWidth = 0.8;
 ctx.strokeRect(cx, cy, 20, 8);
 }
 }
 }
 });

 drawPlusSignRoad(w, h);
 }

 function drawRYFFRScreen(w, h) {
 ctx.fillStyle = '#111111';
 ctx.fillRect(0, 0, w, h);

 const b = getRoadBounds();
 const quads = getQuadrants();

 quads.forEach((q, qIdx) => {
 ctx.strokeStyle = '#f1c40f';
 ctx.lineWidth = 1;
 const carCols = ['#e74c3c', '#2980b9', '#ecf0f1', '#34495e', '#f1c40f', '#9b59b6'];

 for (let i = 0; i < 4; i++) {
 const slotX = q.x + 10 + i * 26;
 const slotY = q.id.includes('T') ? q.y + 10 : q.y + q.h - 40;
 ctx.strokeRect(slotX, slotY, 20, 30);

 if (seededRandom(qIdx * 10 + i) > 0.2) {
 drawCar(slotX + 5, slotY + 4, carCols[i % carCols.length], false);
 }
 }
 });

 drawPlusSignRoad(w, h);

 const bw = b.roadW * 0.85;
 const bh = b.roadH * 0.85;
 const bx = w / 2 - bw / 2;
 const by = h / 2 - bh / 2;

 for (let i = 0; i < 4; i++) {
 const colorKey = wallOrder[i];
 const colorHex = KEY_COLORS[colorKey].hex;
 const isUnlocked = unlockedWalls[colorKey];

 const pad = (4 - i) * 16;
 const wx = bx - pad;
 const wy = by - pad;
 const ww = bw + pad * 2;
 const wh = bh + pad * 2;

 if (!isUnlocked) {
 ctx.strokeStyle = colorHex;
 ctx.lineWidth = 4;
 ctx.shadowColor = colorHex;
 ctx.shadowBlur = 10;
 ctx.strokeRect(wx, wy, ww, wh);
 ctx.shadowBlur = 0;

 ctx.fillStyle = colorHex;
 ctx.fillRect(wx + ww / 2 - 28, wy - 6, 56, 12);
 ctx.fillStyle = (colorKey === 'yellow') ? '#000000' : '#ffffff';
 ctx.font = 'bold 7px monospace';
 ctx.textAlign = 'center';

 // Status on wall badge (LOCKED vs TOUCH TO UNLOCK)
 if (hasKey[colorKey]) {
 ctx.fillText('TOUCH TO UNLOCK', wx + ww / 2, wy + 3);
 } else {
 ctx.fillText('LOCKED', wx + ww / 2, wy + 3);
 }
 } else {
 ctx.strokeStyle = colorHex;
 ctx.lineWidth = 1.5;
 ctx.setLineDash([4, 8]);
 ctx.globalAlpha = 0.3;
 ctx.strokeRect(wx, wy, ww, wh);
 ctx.setLineDash([]);
 ctx.globalAlpha = 1.0;
 }
 }

 ctx.fillStyle = '#c0392b';
 ctx.fillRect(bx, by, bw, bh);

 ctx.strokeStyle = '#f1c40f';
 ctx.lineWidth = 4;
 ctx.strokeRect(bx, by, bw, bh);

 ctx.fillStyle = '#f1c40f';
 ctx.font = '900 26px sans-serif';
 ctx.textAlign = 'center';
 ctx.fillText('M', w / 2, by + bh / 2 - 2);

 ctx.fillStyle = '#ffffff';
 ctx.font = 'bold 10px monospace';
 ctx.fillText('RYFFR FAST FOOD', w / 2, by + bh / 2 + 14);

 ctx.fillStyle = '#333333';
 ctx.fillRect(b.maxX + 10, b.minY + 10, 16, 22);
 ctx.fillStyle = '#f1c40f';
 ctx.fillRect(b.maxX + 12, b.minY + 12, 12, 10);
 }

 function drawStickman(x, y, facing, walkFrame) {
 ctx.strokeStyle = '#ffffff';
 ctx.fillStyle = '#ffffff';
 ctx.lineWidth = 1.8;
 ctx.lineCap = 'round';
 ctx.lineJoin = 'round';

 const headRadius = 5;
 const bodyLength = 15;
 const legLength = 11;
 const neckY = y - bodyLength;
 const headY = neckY - headRadius;
 const shoulderY = neckY + 4;

 ctx.beginPath();
 ctx.arc(x, headY, headRadius, 0, Math.PI * 2);
 ctx.stroke();

 ctx.beginPath();
 ctx.arc(x + facing * 2, headY - 0.5, 0.8, 0, Math.PI * 2);
 ctx.fill();

 ctx.beginPath();
 ctx.moveTo(x, neckY);
 ctx.lineTo(x, y);
 ctx.stroke();

 const legSwing = Math.sin(walkFrame) * 6;
 ctx.beginPath();
 ctx.moveTo(x, y);
 ctx.lineTo(x - legSwing, y + legLength);
 ctx.stroke();

 ctx.beginPath();
 ctx.moveTo(x, y);
 ctx.lineTo(x + legSwing, y + legLength);
 ctx.stroke();

 const armSwing = Math.sin(walkFrame + Math.PI) * 4;
 ctx.beginPath();
 ctx.moveTo(x, shoulderY);
 ctx.lineTo(x - facing * 4 - armSwing, shoulderY + 6);
 ctx.stroke();

 ctx.beginPath();
 ctx.moveTo(x, shoulderY);
 ctx.lineTo(x + facing * 4 + armSwing, shoulderY + 6);
 ctx.stroke();
 }

 function drawEnvironment() {
 const currentTile = cityGrid[currentGridX][currentGridY];
 const w = canvas.width;
 const h = canvas.height;

 switch (currentTile.type) {
 case TILE_TYPES.STADIUM:
 drawStadium(w, h);
 break;
 case TILE_TYPES.DENSE_CITY:
 drawDenseCity(w, h, currentTile.seed);
 break;
 case TILE_TYPES.PARK:
 drawPark(w, h, currentTile.seed);
 break;
 case TILE_TYPES.RESIDENTIAL:
 drawResidential(w, h, currentTile.seed);
 break;
 case TILE_TYPES.INDUSTRIAL:
 drawIndustrial(w, h, currentTile.seed);
 break;
 case TILE_TYPES.RYFFR:
 drawRYFFRScreen(w, h);
 break;
 }

 if (currentTile.key && !hasKey[currentTile.key]) {
 const keyX = currentTile.keyXRatio * w;
 const keyY = currentTile.keyYRatio * h;
 drawKeyItem(keyX, keyY, currentTile.key);
 }
 }

 function draw() {
 ctx.clearRect(0, 0, canvas.width, canvas.height);
 drawEnvironment();
 drawStickman(player.x, player.y, player.facing, player.walkFrame);
 }

 function animate() {
 updatePhysics();
 draw();
 requestAnimationFrame(animate);
 }

 window.onload = function() {
 generateCityMap();
 resizeCanvas();
 updateLocationUI();
 animate();
 };
 </script>
