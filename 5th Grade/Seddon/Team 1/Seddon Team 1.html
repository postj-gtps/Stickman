<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Stickman Lunar Rescue - Seddon Team 1</title>
 <style>
 * {
 box-sizing: border-box;
 user-select: none;
 margin: 0;
 padding: 0;
 font-family: 'Courier New', Courier, monospace, sans-serif;
 }

 body {
 background-color: #000000;
 color: #ffffff;
 display: flex;
 flex-direction: column;
 align-items: center;
 justify-content: flex-start;
 height: 100vh;
 overflow: hidden;
 padding: 16px;
 }

 /* Header Bar */
 #header {
 display: flex;
 justify-content: space-between;
 align-items: center;
 width: 100%;
 max-width: 1100px;
 margin-bottom: 12px;
 padding-bottom: 8px;
 border-bottom: 1px solid #ffffff;
 }

 h1 {
 font-size: 18px;
 letter-spacing: 2px;
 text-transform: uppercase;
 font-weight: bold;
 }

 .btn-reset {
 background: transparent;
 color: #ffffff;
 border: 1px solid #ffffff;
 padding: 6px 16px;
 font-size: 14px;
 font-weight: bold;
 cursor: pointer;
 text-transform: uppercase;
 letter-spacing: 1px;
 transition: all 0.15s ease-in-out;
 }

 .btn-reset:hover {
 background: #ffffff;
 color: #000000;
 }

 /* Canvas Container */
 #canvas-wrapper {
 position: relative;
 width: 100%;
 max-width: 1100px;
 flex-grow: 1;
 display: flex;
 justify-content: center;
 align-items: center;
 }

 canvas {
 background-color: #010105;
 border: 1px solid #ffffff;
 display: block;
 width: 100%;
 height: 100%;
 }

 .instructions {
 margin-top: 8px;
 font-size: 11px;
 color: #aaa;
 text-align: center;
 }
 </style>
</head>
<body>

 <div id="header">
 <h1>Stickman Engine: Daylight Moon Mission</h1>
 <button class="btn-reset" onclick="resetSimulation()">Reset</button>
 </div>

 <div id="canvas-wrapper">
 <canvas id="simCanvas"></canvas>
 </div>

 <div class="instructions">
 Movement: [WASD] Keys Only | W: Moon Jump | A: Move Left | S: Descend | D: Move Right
 </div>

 <script>
 const canvas = document.getElementById('simCanvas');
 const ctx = canvas.getContext('2d');

 // WORLD CONSTANTS
 const WORLD_WIDTH = 8000;
 let GROUND_Y = 0;

 // KEYBOARD INPUT STATE
 const keys = {};

 // PLAYER STATE
 const player = {
 x: 4000, // Starts at rocket location
 y: 0,
 vx: 0,
 vy: 0,
 speed: 5.0,
 jumpForce: -7.8,
 gravity: 0.22,
 facing: 1, // 1 = Right, -1 = Left
 walkFrame: 0,
 isGrounded: false,
 partsCollected: 0,
 insideRocket: false
 };

 // ROCKET STATE (Centered in the world)
 const rocket = {
 x: 4000,
 y: 0,
 width: 60,
 height: 130,
 isRepaired: false,
 takingOff: false,
 launchY: 0,
 launchVy: 0
 };

 // ENVIRONMENT DATA
 let stars = [];
 let nebulae = [];
 let planets = [];
 let moonMountains = [];
 let craters = [];
 let moonRocks = [];
 let parts = [];
 let particles = [];

 const ROCKET_PARTS_TOTAL = 5;

 function initWorldData() {
 // 1. Starfield Generation
 stars = [];
 for (let i = 0; i < 300; i++) {
 stars.push({
 x: Math.random() * WORLD_WIDTH,
 y: Math.random() * 0.65,
 size: Math.random() * 1.8 + 0.5,
 alpha: Math.random() * 0.7 + 0.3
 });
 }

 // 2. Nebulae Clouds
 nebulae = [
 { x: 1200, y: 100, radius: 240, color: 'rgba(140, 60, 255, 0.15)' },
 { x: 3800, y: 80, radius: 300, color: 'rgba(0, 200, 255, 0.12)' },
 { x: 6200, y: 120, radius: 260, color: 'rgba(255, 80, 160, 0.14)' }
 ];

 // 3. Earth & Planets
 planets = [
 { x: 3200, y: 130, radius: 50, color: '#2b65ec', isEarth: true },
 { x: 6800, y: 110, radius: 30, color: '#e77d11', ring: true }
 ];

 // 4. Daylight Moon Mountain Ranges
 moonMountains = [];
 let mX = 0;
 while (mX < WORLD_WIDTH + 500) {
 const width = 180 + Math.random() * 240;
 const height = 90 + Math.random() * 110;
 moonMountains.push({ x: mX, width: width, height: height });
 mX += width - 35;
 }

 // 5. Craters (Daylight contrast)
 craters = [];
 for (let x = 200; x < WORLD_WIDTH - 200; x += 160 + Math.random() * 220) {
 if (Math.abs(x - rocket.x) > 180) {
 craters.push({
 x: x,
 rx: 35 + Math.random() * 55,
 ry: 8 + Math.random() * 12
 });
 }
 }

 // 6. Sunlit Moon Rocks
 moonRocks = [];
 for (let x = 150; x < WORLD_WIDTH - 150; x += 100 + Math.random() * 160) {
 if (Math.abs(x - rocket.x) > 120) {
 moonRocks.push({
 x: x,
 w: 12 + Math.random() * 24,
 h: 10 + Math.random() * 20
 });
 }
 }

 // 7. Rocket Parts (Scattered on BOTH sides of the central rocket)
 const partNames = ['Engine Nozzle', 'Guidance Module', 'Fuel Cell', 'Solar Array', 'Thruster Control'];
 const partPositions = [800, 2300, 5200, 6600, 7500]; // Left & Right of 4000px
 parts = partPositions.map((xPos, idx) => ({
 id: idx,
 name: partNames[idx],
 x: xPos,
 y: 0,
 collected: false,
 floatOffset: Math.random() * Math.PI * 2
 }));
 }

 function resizeCanvas() {
 const wrapper = document.getElementById('canvas-wrapper');
 canvas.width = wrapper.clientWidth;
 canvas.height = wrapper.clientHeight;
 GROUND_Y = canvas.height - 90;

 if (player.y === 0) {
 resetSimulation();
 }
 }

 window.addEventListener('resize', resizeCanvas);

 // WASD CONTROLS ONLY (INTERCEPT & BLOCK ARROWS)
 window.addEventListener('keydown', (e) => {
 if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
 e.preventDefault();
 return;
 }

 if (['KeyW', 'KeyA', 'KeyS', 'KeyD'].includes(e.code)) {
 e.preventDefault();
 keys[e.code] = true;
 }
 });

 window.addEventListener('keyup', (e) => {
 if (['KeyW', 'KeyA', 'KeyS', 'KeyD'].includes(e.code)) {
 keys[e.code] = false;
 }
 });

 function resetSimulation() {
 initWorldData();
 player.x = 4050;
 player.y = GROUND_Y;
 player.vx = 0;
 player.vy = 0;
 player.facing = 1;
 player.walkFrame = 0;
 player.partsCollected = 0;
 player.insideRocket = false;

 rocket.x = 4000;
 rocket.y = GROUND_Y;
 rocket.isRepaired = false;
 rocket.takingOff = false;
 rocket.launchY = GROUND_Y;
 rocket.launchVy = 0;

 particles = [];
 }

 function updatePhysics() {
 if (player.insideRocket) {
 if (rocket.takingOff) {
 rocket.launchVy -= 0.14;
 rocket.launchY += rocket.launchVy;

 for (let i = 0; i < 4; i++) {
 particles.push({
 x: rocket.x + (Math.random() * 20 - 10),
 y: rocket.launchY,
 vx: Math.random() * 4 - 2,
 vy: Math.random() * 5 + 3,
 life: 30,
 size: Math.random() * 6 + 4,
 color: Math.random() > 0.5 ? '#ffaa00' : '#ff3300'
 });
 }
 }
 updateParticles();
 return;
 }

 // WASD Horizontal Input
 let dx = 0;
 if (keys['KeyA'] || keys['Keya']) { dx -= 1; player.facing = -1; }
 if (keys['KeyD'] || keys['Keyd']) { dx += 1; player.facing = 1; }

 player.vx = dx * player.speed;

 // Low Gravity Moon Jump (W key)
 if ((keys['KeyW'] || keys['Keyw']) && player.isGrounded) {
 player.vy = player.jumpForce;
 player.isGrounded = false;
 }

 // Fast drop / descend (S key)
 if ((keys['KeyS'] || keys['Keys']) && !player.isGrounded) {
 player.vy += 0.35;
 }

 // Apply Low Gravity
 player.vy += player.gravity;

 // Update Position
 player.x += player.vx;
 player.y += player.vy;

 // Terrain Floor Collision
 if (player.y >= GROUND_Y) {
 player.y = GROUND_Y;
 player.vy = 0;
 player.isGrounded = true;
 }

 // World Bounds Clamping (0 to 8000)
 player.x = Math.max(30, Math.min(WORLD_WIDTH - 30, player.x));

 // Animation timing
 if (dx !== 0 && player.isGrounded) {
 player.walkFrame += 0.22;
 } else if (!player.isGrounded) {
 player.walkFrame = 1.2;
 } else {
 player.walkFrame = 0;
 }

 // Collection Detection
 parts.forEach(part => {
 if (!part.collected) {
 const partY = GROUND_Y - 25 + Math.sin(Date.now() * 0.004 + part.floatOffset) * 6;
 const dist = Math.hypot(player.x - part.x, (player.y - 15) - partY);
 if (dist < 38) {
 part.collected = true;
 player.partsCollected++;

 for (let i = 0; i < 20; i++) {
 particles.push({
 x: part.x,
 y: partY,
 vx: (Math.random() - 0.5) * 6,
 vy: (Math.random() - 0.5) * 6,
 life: 40,
 size: Math.random() * 4 + 2,
 color: '#00ffff'
 });
 }
 }
 }
 });

 // Rocket Repair & Launch Check
 const distToRocket = Math.abs(player.x - rocket.x);
 if (player.partsCollected >= ROCKET_PARTS_TOTAL) {
 rocket.isRepaired = true;
 if (distToRocket < 40 && player.isGrounded) {
 player.insideRocket = true;
 rocket.takingOff = true;
 }
 } else {
 // Crash Site Smoke
 if (Math.random() < 0.3) {
 particles.push({
 x: rocket.x + (Math.random() * 20 - 10),
 y: GROUND_Y - 70,
 vx: (Math.random() - 0.5) * 1.5,
 vy: -Math.random() * 2 - 0.5,
 life: 45,
 size: Math.random() * 5 + 3,
 color: '#888888'
 });
 }
 }

 updateParticles();
 }

 function updateParticles() {
 for (let i = particles.length - 1; i >= 0; i--) {
 const p = particles[i];
 p.x += p.vx;
 p.y += p.vy;
 p.life--;
 if (p.life <= 0) particles.splice(i, 1);
 }
 }

 // DRAWING FUNCTIONS
 function drawBackground(camX) {
 // Deep Space Background
 ctx.fillStyle = '#020208';
 ctx.fillRect(0, 0, canvas.width, canvas.height);

 // Direct Sun Glare (Daylight moon indicator)
 const sunX = 1800 - camX * 0.04;
 const sunGrad = ctx.createRadialGradient(sunX, 80, 15, sunX, 80, 300);
 sunGrad.addColorStop(0, 'rgba(255, 255, 220, 1)');
 sunGrad.addColorStop(0.2, 'rgba(255, 240, 180, 0.35)');
 sunGrad.addColorStop(1, 'rgba(255, 240, 180, 0)');
 ctx.fillStyle = sunGrad;
 ctx.beginPath();
 ctx.arc(sunX, 80, 300, 0, Math.PI * 2);
 ctx.fill();

 // 1. Starfield
 ctx.fillStyle = '#ffffff';
 stars.forEach(star => {
 const screenX = (star.x - camX * 0.05) % canvas.width;
 const renderX = screenX < 0 ? screenX + canvas.width : screenX;
 ctx.globalAlpha = star.alpha;
 ctx.fillRect(renderX, star.y * canvas.height, star.size, star.size);
 });
 ctx.globalAlpha = 1.0;

 // 2. Nebulae
 nebulae.forEach(neb => {
 const renderX = neb.x - camX * 0.08;
 if (renderX > -neb.radius && renderX < canvas.width + neb.radius) {
 const grad = ctx.createRadialGradient(renderX, neb.y, 10, renderX, neb.y, neb.radius);
 grad.addColorStop(0, neb.color);
 grad.addColorStop(1, 'transparent');
 ctx.fillStyle = grad;
 ctx.beginPath();
 ctx.arc(renderX, neb.y, neb.radius, 0, Math.PI * 2);
 ctx.fill();
 }
 });

 // 3. Earth & Planets
 planets.forEach(planet => {
 const renderX = planet.x - camX * 0.12;
 if (renderX > -100 && renderX < canvas.width + 100) {
 ctx.fillStyle = planet.color;
 ctx.beginPath();
 ctx.arc(renderX, planet.y, planet.radius, 0, Math.PI * 2);
 ctx.fill();

 if (planet.isEarth) {
 ctx.fillStyle = '#228b22';
 ctx.beginPath();
 ctx.arc(renderX - 10, planet.y - 10, 15, 0, Math.PI * 2);
 ctx.arc(renderX + 12, planet.y + 8, 18, 0, Math.PI * 2);
 ctx.fill();
 }

 if (planet.ring) {
 ctx.strokeStyle = 'rgba(230, 200, 150, 0.6)';
 ctx.lineWidth = 4;
 ctx.beginPath();
 ctx.ellipse(renderX, planet.y, planet.radius * 1.8, 8, -0.2, 0, Math.PI * 2);
 ctx.stroke();
 }
 }
 });

 // 4. Daylight Moon Mountain Ranges (Bright Lunar Silver/Grays)
 ctx.fillStyle = '#525766';
 ctx.beginPath();
 ctx.moveTo(0, canvas.height);
 moonMountains.forEach(m => {
 const renderX = m.x - camX * 0.22;
 ctx.lineTo(renderX, GROUND_Y - m.height);
 ctx.lineTo(renderX + m.width, GROUND_Y);
 });
 ctx.lineTo(canvas.width, canvas.height);
 ctx.closePath();
 ctx.fill();

 // Fore Mountain Highlight
 ctx.fillStyle = '#7a8194';
 ctx.beginPath();
 ctx.moveTo(0, canvas.height);
 moonMountains.forEach(m => {
 const renderX = m.x - camX * 0.28 + 40;
 ctx.lineTo(renderX, GROUND_Y - m.height * 0.7);
 ctx.lineTo(renderX + m.width * 0.8, GROUND_Y);
 });
 ctx.lineTo(canvas.width, canvas.height);
 ctx.closePath();
 ctx.fill();
 }

 function drawMoonForeground(camX) {
 // Bright Daylight Moon Terrain Surface
 ctx.fillStyle = '#c5cbda';
 ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);

 // Sunlit Top Surface Highlight
 ctx.strokeStyle = '#ffffff';
 ctx.lineWidth = 3.5;
 ctx.beginPath();
 ctx.moveTo(0, GROUND_Y);
 ctx.lineTo(canvas.width, GROUND_Y);
 ctx.stroke();

 // Craters with Sunlit Rims
 craters.forEach(c => {
 const renderX = c.x - camX;
 if (renderX > -100 && renderX < canvas.width + 100) {
 ctx.fillStyle = '#9aa1b2';
 ctx.beginPath();
 ctx.ellipse(renderX, GROUND_Y + 4, c.rx, c.ry, 0, 0, Math.PI * 2);
 ctx.fill();

 // Sunlit rim line
 ctx.strokeStyle = '#eef2fc';
 ctx.lineWidth = 2;
 ctx.stroke();
 }
 });

 // Sunlit Moon Rocks
 moonRocks.forEach(r => {
 const renderX = r.x - camX;
 if (renderX > -50 && renderX < canvas.width + 50) {
 ctx.fillStyle = '#838a9c';
 ctx.fillRect(renderX, GROUND_Y - r.h, r.w, r.h);
 
 // Top highlight
 ctx.fillStyle = '#ffffff';
 ctx.fillRect(renderX, GROUND_Y - r.h, r.w, 2);
 ctx.strokeStyle = '#525766';
 ctx.lineWidth = 1;
 ctx.strokeRect(renderX, GROUND_Y - r.h, r.w, r.h);
 }
 });
 }

 function drawRocket(camX) {
 const renderX = rocket.x - camX;
 const currentY = player.insideRocket ? rocket.launchY : GROUND_Y;

 if (renderX < -150 || renderX > canvas.width + 150) return;

 ctx.save();
 ctx.translate(renderX, currentY);

 if (!rocket.isRepaired && !rocket.takingOff) {
 ctx.rotate(-0.25);
 }

 // Hull Body
 ctx.fillStyle = '#e8e8e8';
 ctx.fillRect(-20, -90, 40, 70);

 // Nose Cone
 ctx.fillStyle = '#ff3333';
 ctx.beginPath();
 ctx.moveTo(-20, -90);
 ctx.lineTo(0, -130);
 ctx.lineTo(20, -90);
 ctx.closePath();
 ctx.fill();

 // Porthole
 ctx.fillStyle = '#00cdff';
 ctx.beginPath();
 ctx.arc(0, -65, 10, 0, Math.PI * 2);
 ctx.fill();
 ctx.strokeStyle = '#111111';
 ctx.lineWidth = 2;
 ctx.stroke();

 // Fins
 ctx.fillStyle = '#ff3333';
 ctx.beginPath();
 ctx.moveTo(-20, -40);
 ctx.lineTo(-35, -20);
 ctx.lineTo(-20, -20);
 ctx.closePath();
 ctx.fill();

 ctx.beginPath();
 ctx.moveTo(20, -40);
 ctx.lineTo(35, -20);
 ctx.lineTo(20, -20);
 ctx.closePath();
 ctx.fill();

 // Nozzle
 ctx.fillStyle = '#444444';
 ctx.fillRect(-12, -20, 24, 12);

 ctx.restore();
 }

 function drawRocketParts(camX) {
 parts.forEach(part => {
 if (part.collected) return;

 const renderX = part.x - camX;
 if (renderX < -50 || renderX > canvas.width + 50) return;

 const floatY = GROUND_Y - 25 + Math.sin(Date.now() * 0.004 + part.floatOffset) * 6;

 // Aura
 const grad = ctx.createRadialGradient(renderX, floatY, 2, renderX, floatY, 22);
 grad.addColorStop(0, 'rgba(0, 255, 255, 0.9)');
 grad.addColorStop(1, 'rgba(0, 255, 255, 0)');
 ctx.fillStyle = grad;
 ctx.beginPath();
 ctx.arc(renderX, floatY, 22, 0, Math.PI * 2);
 ctx.fill();

 // Part Graphic Box
 ctx.fillStyle = '#00ffff';
 ctx.strokeStyle = '#ffffff';
 ctx.lineWidth = 2;
 ctx.fillRect(renderX - 8, floatY - 8, 16, 16);
 ctx.strokeRect(renderX - 8, floatY - 8, 16, 16);

 // Text Label
 ctx.fillStyle = '#00ffff';
 ctx.font = 'bold 11px Courier New';
 ctx.textAlign = 'center';
 ctx.fillText(part.name, renderX, floatY - 16);
 });
 }

 function drawStickman(x, y, facing, walkFrame) {
 if (player.insideRocket) return;

 ctx.strokeStyle = '#111111'; // Dark contrast stick outline against daylight ground
 ctx.fillStyle = '#ffffff';
 ctx.lineWidth = 2.2;
 ctx.lineCap = 'round';
 ctx.lineJoin = 'round';

 const headRadius = 6;
 const bodyLength = 16;
 const legLength = 12;
 const neckY = y - bodyLength;
 const headY = neckY - headRadius;
 const shoulderY = neckY + 4;

 // Helmet Visor Bubble
 ctx.strokeStyle = '#00cdff';
 ctx.beginPath();
 ctx.arc(x, headY, headRadius + 3, 0, Math.PI * 2);
 ctx.stroke();

 // Head
 ctx.strokeStyle = '#000000';
 ctx.beginPath();
 ctx.arc(x, headY, headRadius, 0, Math.PI * 2);
 ctx.stroke();

 // Visor Reflection
 ctx.fillStyle = '#00cdff';
 ctx.beginPath();
 ctx.arc(x + facing * 2.5, headY - 1, 2, 0, Math.PI * 2);
 ctx.fill();

 // Torso
 ctx.strokeStyle = '#000000';
 ctx.beginPath();
 ctx.moveTo(x, neckY);
 ctx.lineTo(x, y);
 ctx.stroke();

 // Legs
 const legSwing = Math.sin(walkFrame) * 7;
 ctx.beginPath();
 ctx.moveTo(x, y);
 ctx.lineTo(x - legSwing, y + legLength);
 ctx.stroke();

 ctx.beginPath();
 ctx.moveTo(x, y);
 ctx.lineTo(x + legSwing, y + legLength);
 ctx.stroke();

 // Arms
 const armSwing = Math.sin(walkFrame + Math.PI) * 5;
 ctx.beginPath();
 ctx.moveTo(x, shoulderY);
 ctx.lineTo(x - facing * 5 - armSwing, shoulderY + 7);
 ctx.stroke();

 ctx.beginPath();
 ctx.moveTo(x, shoulderY);
 ctx.lineTo(x + facing * 5 + armSwing, shoulderY + 7);
 ctx.stroke();
 }

 function drawParticles(camX) {
 particles.forEach(p => {
 ctx.fillStyle = p.color;
 ctx.beginPath();
 ctx.arc(p.x - camX, p.y, p.size, 0, Math.PI * 2);
 ctx.fill();
 });
 }

 function drawHUD() {
 // Collectibles Counter
 ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
 ctx.strokeStyle = '#ffffff';
 ctx.lineWidth = 1;
 ctx.fillRect(15, 15, 250, 52);
 ctx.strokeRect(15, 15, 250, 52);

 ctx.fillStyle = '#ffffff';
 ctx.font = 'bold 13px Courier New';
 ctx.textAlign = 'left';
 ctx.fillText(`PARTS COLLECTED: ${player.partsCollected} / ${ROCKET_PARTS_TOTAL}`, 25, 36);

 // Objective Status Text
 ctx.font = '11px Courier New';
 if (player.partsCollected < ROCKET_PARTS_TOTAL) {
 ctx.fillStyle = '#ffaa00';
 ctx.fillText(`STATUS: Search left & right for parts`, 25, 52);
 } else if (!player.insideRocket) {
 ctx.fillStyle = '#00ff00';
 ctx.fillText(`STATUS: Return to Crashed Rocket!`, 25, 52);
 } else {
 ctx.fillStyle = '#00ffff';
 ctx.fillText(`STATUS: LIFT OFF SUCCESSFUL!`, 25, 52);
 }

 // Directional Indicator to Rocket (if off-screen)
 const cameraX = Math.max(0, Math.min(WORLD_WIDTH - canvas.width, player.x - canvas.width / 2));
 const rocketScreenX = rocket.x - cameraX;
 if (rocketScreenX < 0 || rocketScreenX > canvas.width) {
 ctx.fillStyle = '#ff3333';
 ctx.font = 'bold 12px Courier New';
 if (rocketScreenX < 0) {
 ctx.fillText('◄ ROCKET SITE', 20, 85);
 } else {
 ctx.textAlign = 'right';
 ctx.fillText('ROCKET SITE ►', canvas.width - 20, 85);
 }
 }
 }

 function draw() {
 const cameraX = Math.max(0, Math.min(WORLD_WIDTH - canvas.width, player.x - canvas.width / 2));

 drawBackground(cameraX);
 drawMoonForeground(cameraX);
 drawRocketParts(cameraX);
 drawRocket(cameraX);
 drawParticles(cameraX);

 drawStickman(player.x - cameraX, player.y, player.facing, player.walkFrame);
 drawHUD();
 }

 function animate() {
 updatePhysics();
 draw();
 requestAnimationFrame(animate);
 }

 window.onload = function() {
 resizeCanvas();
 animate();
 };
 </script>
</body>
</html>
