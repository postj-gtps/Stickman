<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Stickman - Candyland Rescue</title>
 <style>
 * {
 box-sizing: border-box;
 user-select: none;
 margin: 0;
 padding: 0;
 font-family: 'Courier New', Courier, monospace, sans-serif;
 }

 body {
 background-color: #1a092b;
 color: #ffffff;
 display: flex;
 flex-direction: column;
 align-items: center;
 justify-content: flex-start;
 height: 100vh;
 overflow: hidden;
 padding: 12px;
 }

 /* Top Header Bar */
 #header {
 display: flex;
 justify-content: space-between;
 align-items: center;
 width: 100%;
 max-width: 1100px;
 margin-bottom: 8px;
 padding-bottom: 6px;
 border-bottom: 2px solid #ff70a6;
 }

 h1 {
 font-size: 18px;
 letter-spacing: 2px;
 text-transform: uppercase;
 font-weight: bold;
 color: #ff9770;
 text-shadow: 1px 1px 2px #000;
 }

 .stats {
 font-size: 16px;
 font-weight: bold;
 color: #ffd166;
 letter-spacing: 1px;
 }

 .btn-reset {
 background: #ff70a6;
 color: #ffffff;
 border: 1px solid #ffffff;
 padding: 6px 16px;
 font-size: 14px;
 font-weight: bold;
 cursor: pointer;
 text-transform: uppercase;
 letter-spacing: 1px;
 transition: all 0.15s ease-in-out;
 border-radius: 4px;
 }

 .btn-reset:hover {
 background: #ffffff;
 color: #ff70a6;
 }

 /* Main Canvas Container */
 #canvas-wrapper {
 position: relative;
 width: 100%;
 max-width: 1100px;
 flex-grow: 1;
 display: flex;
 justify-content: center;
 align-items: center;
 }

 canvas {
 background-color: #2b1055;
 border: 2px solid #ff70a6;
 border-radius: 6px;
 display: block;
 width: 100%;
 height: 100%;
 }

 .instructions {
 margin-top: 6px;
 font-size: 12px;
 color: #ffb7b2;
 text-align: center;
 font-weight: bold;
 }
 </style>
</head>
<body>

 <!-- Header Section -->
 <div id="header">
 <h1>Stickman: Candyland Rescue</h1>
 <div class="stats">LEVEL: <span id="level-display">1</span></div>
 <button class="btn-reset" onclick="resetGame()">Reset Game</button>
 </div>

 <!-- Canvas Container -->
 <div id="canvas-wrapper">
 <canvas id="simCanvas"></canvas>
 </div>

 <div class="instructions">
 [WASD] Move Stickman &bull; Choose a branching path, cross the chocolate river bridge, and rescue Timmy!
 </div>

 <script>
 const canvas = document.getElementById('simCanvas');
 const ctx = canvas.getContext('2d');

 // KEYBOARD INPUT STATE (STRICT WASD ONLY)
 const keys = {};

 // GAME STATE
 let currentLevel = 1;
 let levelMessageTimer = 0;
 let tileSize = 26;
 let gridCols = 0;
 let gridRows = 0;

 // STICKMAN PLAYER STATE (Scaled down to fit intricate path network)
 const player = {
 x: 0,
 y: 0,
 speed: 3.2,
 facing: 1, // 1 = Right, -1 = Left
 walkFrame: 0
 };

 // TIMMY THE GNOME STATE
 const timmy = {
 x: 0,
 y: 0,
 waveFrame: 0
 };

 // MAP & PATH STATE
 let pathTiles = [];
 let pathSet = new Set();
 let sceneryItems = [];
 let canyonYStart = 0;
 let canyonHeight = 0;
 let canyonRowStart = 0;

 const CANDY_COLORS = [
 '#ff4d6d', '#4cc9f0', '#ffd166', '#06d6a0', 
 '#ff9770', '#70d6ff', '#ff70a6', '#ff9e00', '#b5179e'
 ];

 window.addEventListener('resize', resizeCanvas);

 // CONTROLS HANDLERS - STRICT WASD MOVEMENT ONLY (ARROW KEYS EXCLUDED)
 window.addEventListener('keydown', (e) => {
 if (['KeyW', 'KeyA', 'KeyS', 'KeyD', 'Keyw', 'Keya', 'Keys', 'Keyd'].includes(e.code) ||
 ['w', 'a', 's', 'd', 'W', 'A', 'S', 'D'].includes(e.key)) {
 e.preventDefault();
 keys[e.key.toLowerCase()] = true;
 }
 });

 window.addEventListener('keyup', (e) => {
 if (['w', 'a', 's', 'd', 'W', 'A', 'S', 'D'].includes(e.key)) {
 keys[e.key.toLowerCase()] = false;
 }
 });

 function resizeCanvas() {
 const wrapper = document.getElementById('canvas-wrapper');
 canvas.width = wrapper.clientWidth;
 canvas.height = wrapper.clientHeight;
 generateLevel();
 }

 function addTileToPath(r, c, color, isBridge = false) {
 const key = `${r},${c}`;
 if (!pathSet.has(key) && r >= 0 && r < gridRows && c >= 0 && c < gridCols) {
 pathSet.add(key);
 pathTiles.push({
 r: r,
 c: c,
 x: c * tileSize,
 y: r * tileSize,
 color: color,
 isBridge: isBridge
 });
 }
 }

 function generateLevel() {
 // Smaller tile size to allow complex branching network
 tileSize = Math.max(22, Math.floor(canvas.height / 26));
 gridCols = Math.floor(canvas.width / tileSize);
 gridRows = Math.floor(canvas.height / tileSize);

 pathTiles = [];
 pathSet = new Set();
 sceneryItems = [];

 // 1. Randomize Chocolate River / Canyon position (between 30% and 55% from top)
 const minCanyonRow = Math.floor(gridRows * 0.30);
 const maxCanyonRow = Math.floor(gridRows * 0.55);
 canyonRowStart = Math.floor(Math.random() * (maxCanyonRow - minCanyonRow + 1)) + minCanyonRow;
 canyonYStart = canyonRowStart * tileSize;
 canyonHeight = tileSize * 2;

 // 2. Randomly locate the Bridge crossing along the Chocolate River
 const bridgeCol = Math.floor(Math.random() * (gridCols - 10)) + 5;
 const bridgeWidth = 2; // 2 tiles wide bridge

 // Draw Bridge Tiles across the 2-row river
 for (let r = canyonRowStart; r <= canyonRowStart + 1; r++) {
 for (let c = bridgeCol; c < bridgeCol + bridgeWidth; c++) {
 addTileToPath(r, c, '#8d5524', true);
 }
 }

 // 3. BRANCHING NETWORK FROM START POINT TO BRIDGE
 const startRow = gridRows - 2;
 const startCol = Math.floor(gridCols / 2);

 // Create Start Platform
 for (let r = startRow; r <= startRow + 1; r++) {
 for (let c = startCol - 1; c <= startCol + 1; c++) {
 addTileToPath(r, c, CANDY_COLORS[0]);
 }
 }

 player.x = startCol * tileSize + tileSize / 2;
 player.y = startRow * tileSize + tileSize / 2;
 player.facing = 1;
 player.walkFrame = 0;

 let colorIdx = 1;

 // Helper function to create a snaking path between two grid points
 function buildSnakeBranch(fromR, fromC, toR, toC, waypoints = []) {
 let currR = fromR;
 let currC = fromC;

 const allTargets = [...waypoints, { r: toR, c: toC }];

 allTargets.forEach(target => {
 while (currR > target.r) {
 currR--;
 addTileToPath(currR, currC, CANDY_COLORS[colorIdx % CANDY_COLORS.length]);
 colorIdx++;

 // Random horizontal wiggle
 if (Math.random() < 0.35 && currC !== target.c) {
 currC += (currC < target.c) ? 1 : -1;
 addTileToPath(currR, currC, CANDY_COLORS[colorIdx % CANDY_COLORS.length]);
 colorIdx++;
 }
 }

 while (currC !== target.c) {
 currC += (currC < target.c) ? 1 : -1;
 addTileToPath(currR, currC, CANDY_COLORS[colorIdx % CANDY_COLORS.length]);
 colorIdx++;
 }
 });
 }

 // Define 3 distinct radiating branch routes from Start Point -> Bridge
 const leftWaypointCol = Math.max(3, Math.floor(startCol / 2));
 const rightWaypointCol = Math.min(gridCols - 4, Math.floor(startCol + (gridCols - startCol) / 2));
 const midRow = Math.floor((startRow + canyonRowStart + 2) / 2);

 // Left radiating branch
 buildSnakeBranch(startRow, startCol - 1, canyonRowStart + 2, bridgeCol, [
 { r: midRow + 2, c: leftWaypointCol },
 { r: canyonRowStart + 4, c: leftWaypointCol }
 ]);

 // Middle direct branch
 buildSnakeBranch(startRow, startCol, canyonRowStart + 2, bridgeCol + 1, [
 { r: midRow, c: startCol + (Math.random() > 0.5 ? 2 : -2) }
 ]);

 // Right radiating branch
 buildSnakeBranch(startRow, startCol + 1, canyonRowStart + 2, bridgeCol + 1, [
 { r: midRow + 2, c: rightWaypointCol },
 { r: canyonRowStart + 4, c: rightWaypointCol }
 ]);

 // Add a cross-connector between left and middle branch for extra path choices
 const crossRow = midRow + 1;
 for (let c = leftWaypointCol; c <= startCol; c++) {
 addTileToPath(crossRow, c, CANDY_COLORS[colorIdx % CANDY_COLORS.length]);
 }

 // Ensure bridge entrance is clear and connected
 for (let c = bridgeCol - 1; c <= bridgeCol + bridgeWidth; c++) {
 addTileToPath(canyonRowStart + 2, c, CANDY_COLORS[colorIdx % CANDY_COLORS.length]);
 }

 // 4. UPPER PATH NETWORK FROM BRIDGE TO TIMMY
 const endRow = 2;
 const timmyCol = Math.floor(Math.random() * (gridCols - 8)) + 4;

 // Upper path branches
 for (let c = bridgeCol - 1; c <= bridgeCol + bridgeWidth; c++) {
 addTileToPath(canyonRowStart - 1, c, CANDY_COLORS[colorIdx % CANDY_COLORS.length]);
 }

 buildSnakeBranch(canyonRowStart - 1, bridgeCol, endRow, timmyCol, [
 { r: Math.floor((canyonRowStart + endRow) / 2), c: Math.max(3, bridgeCol - 5) }
 ]);

 buildSnakeBranch(canyonRowStart - 1, bridgeCol + 1, endRow, timmyCol, [
 { r: Math.floor((canyonRowStart + endRow) / 2), c: Math.min(gridCols - 4, bridgeCol + 5) }
 ]);

 // Set Timmy location
 timmy.x = timmyCol * tileSize + tileSize / 2;
 timmy.y = endRow * tileSize + tileSize / 2;

 // Add extra tiles around Timmy
 for (let r = endRow - 1; r <= endRow + 1; r++) {
 for (let c = timmyCol - 1; c <= timmyCol + 1; c++) {
 addTileToPath(r, c, CANDY_COLORS[2]);
 }
 }

 // 5. POPULATE DENSE CANDY SCENERY OUTSIDE THE PATHS
 for (let r = 0; r < gridRows; r++) {
 for (let c = 0; c < gridCols; c++) {
 const key = `${r},${c}`;
 const inCanyon = (r === canyonRowStart || r === canyonRowStart + 1);

 if (!pathSet.has(key) && !inCanyon) {
 const rand = Math.random();
 let itemType = 'sprinkles';
 if (rand < 0.18) itemType = 'lollipop';
 else if (rand < 0.32) itemType = 'candy_cane';
 else if (rand < 0.48) itemType = 'gumdrop';
 else if (rand < 0.62) itemType = 'wrapped_candy';
 else if (rand < 0.75) itemType = 'ice_cream';

 sceneryItems.push({
 x: c * tileSize + tileSize / 2,
 y: r * tileSize + tileSize / 2,
 type: itemType,
 color: CANDY_COLORS[Math.floor(Math.random() * CANDY_COLORS.length)],
 scale: 0.55 + Math.random() * 0.35
 });
 }
 }
 }
 }

 function resetGame() {
 currentLevel = 1;
 document.getElementById('level-display').innerText = currentLevel;
 generateLevel();
 }

 // Strict path checking: Stickman cannot leave the candy path tiles
 function isPointOnPath(x, y) {
 const radius = 5; // Hitbox radius
 const corners = [
 { x: x - radius, y: y - radius },
 { x: x + radius, y: y - radius },
 { x: x - radius, y: y + radius },
 { x: x + radius, y: y + radius }
 ];

 for (let p of corners) {
 const c = Math.floor(p.x / tileSize);
 const r = Math.floor(p.y / tileSize);
 if (!pathSet.has(`${r},${c}`)) {
 return false;
 }
 }
 return true;
 }

 function updatePhysics() {
 // STRICT WASD MOVEMENT ONLY
 let dx = 0;
 let dy = 0;

 if (keys['w']) dy -= 1;
 if (keys['s']) dy += 1;
 if (keys['a']) { dx -= 1; player.facing = -1; }
 if (keys['d']) { dx += 1; player.facing = 1; }

 if (dx !== 0 && dy !== 0) {
 dx *= 0.7071;
 dy *= 0.7071;
 }

 const nextX = player.x + dx * player.speed;
 const nextY = player.y + dy * player.speed;

 // Check path constraints
 if (isPointOnPath(nextX, nextY)) {
 player.x = nextX;
 player.y = nextY;
 } else if (isPointOnPath(nextX, player.y)) {
 player.x = nextX;
 } else if (isPointOnPath(player.x, nextY)) {
 player.y = nextY;
 }

 if (dx !== 0 || dy !== 0) {
 player.walkFrame += 0.25;
 } else {
 player.walkFrame = 0;
 }

 // Check for Timmy Rescue
 const distToTimmy = Math.hypot(player.x - timmy.x, player.y - timmy.y);
 if (distToTimmy < tileSize * 0.8) {
 currentLevel++;
 document.getElementById('level-display').innerText = currentLevel;
 levelMessageTimer = 90;
 generateLevel();
 }

 timmy.waveFrame += 0.08;
 }

 function drawBackgroundTerrain() {
 ctx.fillStyle = '#fceade';
 ctx.fillRect(0, 0, canvas.width, canvas.height);

 ctx.fillStyle = '#f7cad0';
 ctx.beginPath();
 ctx.arc(canvas.width * 0.2, canvas.height * 0.25, 160, 0, Math.PI * 2);
 ctx.arc(canvas.width * 0.8, canvas.height * 0.75, 190, 0, Math.PI * 2);
 ctx.fill();
 }

 function drawCanyon() {
 ctx.fillStyle = '#3a1e05';
 ctx.fillRect(0, canyonYStart, canvas.width, canyonHeight);

 ctx.fillStyle = '#5c3108';
 ctx.fillRect(0, canyonYStart, canvas.width, 4);
 ctx.fillRect(0, canyonYStart + canyonHeight - 4, canvas.width, 4);

 ctx.fillStyle = '#ffd166';
 for (let i = 0; i < canvas.width; i += 45) {
 const ySparkle = canyonYStart + 8 + ((i * 5) % (canyonHeight - 16));
 ctx.fillRect(i + 10, ySparkle, 2.5, 2.5);
 }
 }

 function drawSceneryItem(item) {
 ctx.save();
 ctx.translate(item.x, item.y);
 ctx.scale(item.scale, item.scale);

 if (item.type === 'lollipop') {
 ctx.strokeStyle = '#ffffff';
 ctx.lineWidth = 3;
 ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 14); ctx.stroke();
 ctx.fillStyle = item.color;
 ctx.beginPath(); ctx.arc(0, -2, 9, 0, Math.PI * 2); ctx.fill();
 ctx.strokeStyle = '#ffffff';
 ctx.lineWidth = 1.5;
 ctx.beginPath(); ctx.arc(0, -2, 4.5, 0, Math.PI * 1.5); ctx.stroke();
 } else if (item.type === 'candy_cane') {
 ctx.strokeStyle = '#ff4d6d';
 ctx.lineWidth = 4;
 ctx.lineCap = 'round';
 ctx.beginPath();
 ctx.arc(0, -4, 6, Math.PI, 0, false);
 ctx.lineTo(6, 10);
 ctx.stroke();
 ctx.strokeStyle = '#ffffff';
 ctx.lineWidth = 1.5;
 ctx.beginPath();
 ctx.moveTo(0, -10); ctx.lineTo(3, -7);
 ctx.moveTo(6, -1); ctx.lineTo(6, 3);
 ctx.stroke();
 } else if (item.type === 'gumdrop') {
 ctx.fillStyle = item.color;
 ctx.beginPath();
 ctx.arc(0, 1, 8, Math.PI, 0, false);
 ctx.rect(-8, 1, 16, 6);
 ctx.fill();
 ctx.fillStyle = '#ffffff';
 ctx.fillRect(-3, -2, 2, 2);
 } else if (item.type === 'wrapped_candy') {
 ctx.fillStyle = item.color;
 ctx.beginPath();
 ctx.moveTo(-11, -5); ctx.lineTo(-4, 0); ctx.lineTo(-11, 5); ctx.fill();
 ctx.moveTo(11, -5); ctx.lineTo(4, 0); ctx.lineTo(11, 5); ctx.fill();
 ctx.beginPath();
 ctx.ellipse(0, 0, 7, 5, 0, 0, Math.PI * 2);
 ctx.fill();
 } else if (item.type === 'ice_cream') {
 ctx.fillStyle = '#d4a373';
 ctx.beginPath();
 ctx.moveTo(0, 10); ctx.lineTo(-5, 0); ctx.lineTo(5, 0); ctx.closePath();
 ctx.fill();
 ctx.fillStyle = item.color;
 ctx.beginPath(); ctx.arc(0, -3, 7, 0, Math.PI * 2); ctx.fill();
 } else {
 ctx.fillStyle = item.color;
 ctx.fillRect(-5, -3, 4, 2);
 ctx.fillRect(3, 4, 2, 4);
 }

 ctx.restore();
 }

 function drawPath() {
 pathTiles.forEach(tile => {
 if (tile.isBridge) {
 ctx.fillStyle = '#8d5524';
 ctx.fillRect(tile.x + 1, tile.y + 1, tileSize - 2, tileSize - 2);

 ctx.strokeStyle = '#3d2314';
 ctx.lineWidth = 1.5;
 ctx.strokeRect(tile.x + 1, tile.y + 1, tileSize - 2, tileSize - 2);
 ctx.beginPath();
 ctx.moveTo(tile.x + 1, tile.y + tileSize / 2);
 ctx.lineTo(tile.x + tileSize - 1, tile.y + tileSize / 2);
 ctx.stroke();
 } else {
 ctx.fillStyle = tile.color;
 ctx.fillRect(tile.x + 1, tile.y + 1, tileSize - 2, tileSize - 2);

 ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
 ctx.fillRect(tile.x + 2, tile.y + 2, tileSize - 4, 3);
 ctx.fillRect(tile.x + 2, tile.y + 2, 3, tileSize - 4);

 ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
 ctx.fillRect(tile.x + 2, tile.y + tileSize - 5, tileSize - 4, 3);
 ctx.fillRect(tile.x + tileSize - 5, tile.y + 2, 3, tileSize - 4);
 }
 });
 }

 function drawTimmy() {
 const x = timmy.x;
 const y = timmy.y;
 const wave = Math.sin(timmy.waveFrame) * 3;

 // Body
 ctx.fillStyle = '#06d6a0';
 ctx.beginPath();
 ctx.moveTo(x - 8, y + 9);
 ctx.lineTo(x + 8, y + 9);
 ctx.lineTo(x + 5, y - 1);
 ctx.lineTo(x - 5, y - 1);
 ctx.closePath();
 ctx.fill();

 // Head & Nose
 ctx.fillStyle = '#ffcdb2';
 ctx.beginPath(); ctx.arc(x, y - 3, 5, 0, Math.PI * 2); ctx.fill();
 ctx.fillStyle = '#ffb7b2';
 ctx.beginPath(); ctx.arc(x, y - 2, 2, 0, Math.PI * 2); ctx.fill();

 // Beard
 ctx.fillStyle = '#ffffff';
 ctx.beginPath(); ctx.arc(x, y + 2, 5.5, 0, Math.PI); ctx.fill();

 // Hat
 ctx.fillStyle = '#ff4d6d';
 ctx.beginPath();
 ctx.moveTo(x - 7, y - 6);
 ctx.lineTo(x + 7, y - 6);
 ctx.lineTo(x, y - 18);
 ctx.closePath();
 ctx.fill();

 // Waving Hand
 ctx.strokeStyle = '#ffcdb2';
 ctx.lineWidth = 2;
 ctx.beginPath();
 ctx.moveTo(x + 5, y + 2);
 ctx.lineTo(x + 10, y - 2 + wave);
 ctx.stroke();

 // Name Tag
 ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
 ctx.fillRect(x - 26, y - 29, 52, 12);
 ctx.fillStyle = '#ffd166';
 ctx.font = 'bold 9px Courier New';
 ctx.textAlign = 'center';
 ctx.fillText('♥ TIMMY ♥', x, y - 20);
 }

 // Scaled Down Stickman for narrow paths
 function drawStickman(x, y, facing, walkFrame) {
 ctx.strokeStyle = '#000000';
 ctx.fillStyle = '#000000';
 ctx.lineWidth = 1.8;
 ctx.lineCap = 'round';
 ctx.lineJoin = 'round';

 const headRadius = 3.5;
 const bodyLength = 10;
 const legLength = 8;
 const neckY = y - bodyLength;
 const headY = neckY - headRadius;
 const shoulderY = neckY + 3;

 // Head
 ctx.beginPath(); ctx.arc(x, headY, headRadius, 0, Math.PI * 2); ctx.stroke();
 ctx.beginPath(); ctx.arc(x + facing * 1.5, headY - 0.5, 0.6, 0, Math.PI * 2); ctx.fill();

 // Torso
 ctx.beginPath(); ctx.moveTo(x, neckY); ctx.lineTo(x, y); ctx.stroke();

 // Legs
 const legSwing = Math.sin(walkFrame) * 4.5;
 ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - legSwing, y + legLength); ctx.stroke();
 ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + legSwing, y + legLength); ctx.stroke();

 // Arms
 const armSwing = Math.sin(walkFrame + Math.PI) * 3;
 ctx.beginPath(); ctx.moveTo(x, shoulderY); ctx.lineTo(x - facing * 3 - armSwing, shoulderY + 4); ctx.stroke();
 ctx.beginPath(); ctx.moveTo(x, shoulderY); ctx.lineTo(x + facing * 3 + armSwing, shoulderY + 4); ctx.stroke();
 }

 function drawLevelBanner() {
 if (levelMessageTimer > 0) {
 levelMessageTimer--;
 ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
 ctx.fillRect(canvas.width / 2 - 170, canvas.height / 2 - 35, 340, 70);

 ctx.strokeStyle = '#ffd166';
 ctx.lineWidth = 2;
 ctx.strokeRect(canvas.width / 2 - 170, canvas.height / 2 - 35, 340, 70);

 ctx.fillStyle = '#ffd166';
 ctx.font = 'bold 18px Courier New';
 ctx.textAlign = 'center';
 ctx.fillText('TIMMY RESCUED!', canvas.width / 2, canvas.height / 2 - 6);

 ctx.fillStyle = '#ffffff';
 ctx.font = '12px Courier New';
 ctx.fillText(`ADVANCING TO LEVEL ${currentLevel}...`, canvas.width / 2, canvas.height / 2 + 16);
 }
 }

 function draw() {
 drawBackgroundTerrain();
 drawCanyon();
 sceneryItems.forEach(drawSceneryItem);
 drawPath();
 drawTimmy();
 drawStickman(player.x, player.y, player.facing, player.walkFrame);
 drawLevelBanner();
 }

 function animate() {
 updatePhysics();
 draw();
 requestAnimationFrame(animate);
 }

 window.onload = function() {
 resizeCanvas();
 animate();
 };
 </script>
</body>
</html>
