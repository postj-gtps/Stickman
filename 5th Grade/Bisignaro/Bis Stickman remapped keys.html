<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stickman Parkour Adventure - Super Jump Edition</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            overflow: hidden;
            padding: 12px;
        }

        /* Top Header Bar */
        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1100px;
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 1px solid #ffffff;
        }

        .stats-container {
            display: flex;
            gap: 16px;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            align-items: center;
        }

        .stat-box {
            color: #00ffcc;
        }

        .stat-alert {
            color: #ff3366;
        }

        /* Active Power-up Badge in Top Header */
        .powerup-badge {
            display: none;
            background: linear-gradient(90deg, #ffcc00, #ff00ff);
            color: #000000;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            animation: pulse-glow 1s infinite alternate;
        }

        @keyframes pulse-glow {
            from { box-shadow: 0 0 4px #ffcc00; transform: scale(1); }
            to { box-shadow: 0 0 12px #00ffff; transform: scale(1.05); }
        }

        h1 {
            font-size: 18px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .btn-reset {
            background: transparent;
            color: #ffffff;
            border: 1px solid #ffffff;
            padding: 6px 16px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.15s ease-in-out;
        }

        .btn-reset:hover {
            background: #ffffff;
            color: #000000;
        }

        /* Main Canvas Container */
        #canvas-wrapper {
            position: relative;
            width: 100%;
            max-width: 1100px;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            background-color: #000000;
            border: 1px solid #ffffff;
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Game Over Score Summary Overlay */
        #summary-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.92);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            border: 2px solid #ff3366;
            padding: 20px;
            text-align: center;
        }

        #summary-overlay h2 {
            font-size: 32px;
            color: #ff3366;
            margin-bottom: 15px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .summary-card {
            background: #111111;
            border: 1px solid #00ffcc;
            padding: 20px 40px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .summary-stat {
            font-size: 18px;
            margin: 10px 0;
            color: #ffffff;
            letter-spacing: 1px;
        }

        .summary-stat span {
            color: #00ffcc;
            font-weight: bold;
        }

        .btn-restart {
            background: #00ffcc;
            color: #000000;
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: all 0.15s ease-in-out;
        }

        .btn-restart:hover {
            background: #ffffff;
            color: #000000;
            box-shadow: 0 0 12px #00ffcc;
        }

        /* Instructions Footer */
        .instructions {
            margin-top: 6px;
            font-size: 12px;
            color: #aaaaaa;
            text-align: center;
            letter-spacing: 0.5px;
        }

        .highlight {
            color: #ffcc00;
            font-weight: bold;
        }

        /* Touch Controls for Chromebook Touchscreens */
        #touch-controls {
            display: none;
            width: 100%;
            max-width: 1100px;
            justify-content: space-between;
            margin-top: 6px;
            gap: 10px;
        }

        @media (pointer: coarse), (max-width: 1024px) {
            #touch-controls {
                display: flex;
            }
        }

        .touch-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #ffffff;
            color: #ffffff;
            padding: 12px 18px;
            font-weight: bold;
            font-size: 13px;
            border-radius: 4px;
            touch-action: manipulation;
            flex: 1;
            text-align: center;
        }

        .touch-btn:active {
            background: #ffffff;
            color: #000000;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div id="header">
        <h1>Stickman Engine</h1>
        <div class="stats-container">
            <div>LEVEL: <span id="level-display" class="stat-box">1</span></div>
            <div>RESPAWNS: <span id="respawn-display" class="stat-alert">0 / 5</span></div>
            <div>TRAPPED ENEMIES: <span id="score-display" class="stat-box">0</span></div>
            <div id="powerup-badge" class="powerup-badge">⚡ SUPER JUMP ⚡</div>
        </div>
        <button class="btn-reset" onclick="resetGame(true)">Reset</button>
    </div>

    <!-- Canvas Container -->
    <div id="canvas-wrapper">
        <canvas id="simCanvas"></canvas>

        <!-- Game Over / Score Summary Modal Overlay -->
        <div id="summary-overlay">
            <h2>GAME OVER</h2>
            <div class="summary-card">
                <div class="summary-stat">LEVELS BEAT: <span id="summary-levels">0</span></div>
                <div class="summary-stat">ENEMIES TRAPPED: <span id="summary-score">0</span></div>
            </div>
            <button class="btn-restart" onclick="resetGame(true)">PLAY AGAIN</button>
        </div>
    </div>

    <!-- Instructions Bar -->
    <div class="instructions">
        [A/D] Move &nbsp;|&nbsp; <span class="highlight">[W]</span> Jump &nbsp;|&nbsp; <span class="highlight">[SPACEBAR]</span> Activate Trap (Pencil Box)
    </div>

    <!-- Touchscreen Quick Controls for Chromebooks -->
    <div id="touch-controls">
        <button class="touch-btn" id="btn-left">◄ LEFT (A)</button>
        <button class="touch-btn" id="btn-right">RIGHT ► (D)</button>
        <button class="touch-btn" id="btn-jump">JUMP (W)</button>
        <button class="touch-btn" id="btn-trap">TRAP (SPACE)</button>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // GAME STATE
        let currentLevel = 1;
        let trappedEnemies = 0;
        let respawnCount = 0;
        const MAX_RESPAWNS = 5;
        let isGameOver = false;
        let animTime = 0;

        const keys = {};

        // CONSTANTS & JUMP PHYSICS
        const GRAVITY = 0.45;
        const STANDARD_JUMP_FORCE = -10.5;
        const SUPER_JUMP_FORCE = -15.0;

        // STICKMAN PLAYER STATE
        const player = {
            x: 50,
            y: 0,
            vx: 0,
            vy: 0,
            speed: 4.8,
            facing: 1, // 1 = Right, -1 = Left
            walkFrame: 0,
            isGrounded: false,
            boxOpen: false,
            hasSuperJump: false
        };

        // SUPER JUMP POTION ITEM STATE
        const potion = {
            active: false,
            x: 0,
            y: 0,
            width: 20,
            height: 26,
            collected: false
        };

        // GOAL EXIT PORTAL
        const exitGoal = {
            x: 0,
            y: 0,
            width: 45,
            height: 60
        };

        // PLATFORMS & ENEMIES ARRAYS
        let platforms = [];
        let enemies = [];
        let particles = [];

        function resizeCanvas() {
            const wrapper = document.getElementById('canvas-wrapper');
            const oldWidth = canvas.width;
            const oldHeight = canvas.height;

            canvas.width = wrapper.clientWidth;
            canvas.height = wrapper.clientHeight;

            if (oldWidth !== canvas.width || oldHeight !== canvas.height) {
                generateLevel();
            }
        }

        window.addEventListener('resize', resizeCanvas);

        // KEYBOARD INPUT HANDLERS (WASD Exclusive Movement, Arrow Keys Blocked)
        window.addEventListener('keydown', (e) => {
            if (['KeyW', 'KeyA', 'KeyS', 'KeyD', 'Space', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.code)) {
                e.preventDefault();
            }
            // Strict WASD mapping only - arrow keys do NOT move Stickman
            if (['KeyW', 'KeyA', 'KeyS', 'KeyD', 'Space'].includes(e.code)) {
                keys[e.code] = true;
            }
        });

        window.addEventListener('keyup', (e) => {
            if (['KeyW', 'KeyA', 'KeyS', 'KeyD', 'Space'].includes(e.code)) {
                keys[e.code] = false;
            }
        });

        // TOUCH CONTROLS SETUP FOR CHROMEBOOKS
        function setupTouchControls() {
            const bindTouch = (btnId, keyName) => {
                const btn = document.getElementById(btnId);
                if (!btn) return;
                btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; });
                btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; });
                btn.addEventListener('mousedown', () => { keys[keyName] = true; });
                btn.addEventListener('mouseup', () => { keys[keyName] = false; });
            };

            bindTouch('btn-left', 'KeyA');
            bindTouch('btn-right', 'KeyD');
            bindTouch('btn-jump', 'KeyW');
            bindTouch('btn-trap', 'Space');
        }

        // REACHABILITY SOLVER (GRAPH TRAVERSAL)
        function canJumpBetween(p1, p2, jumpForce) {
            const maxH = (jumpForce * jumpForce) / (2 * GRAVITY);
            const dy = p1.y - p2.y; // Positive if p2 is higher than p1

            if (dy > maxH - 10) return false;

            const vy = jumpForce;
            const discriminant = (vy * vy) - (2 * GRAVITY * dy);
            if (discriminant < 0) return false;

            const timeInAir = (-vy + Math.sqrt(discriminant)) / GRAVITY;
            const maxHorizontal = timeInAir * player.speed + 40;

            let dx = 0;
            if (p2.x + p2.width < p1.x) {
                dx = p1.x - (p2.x + p2.width);
            } else if (p1.x + p1.width < p2.x) {
                dx = p2.x - (p1.x + p1.width);
            }

            return dx <= maxHorizontal;
        }

        function getReachablePlatforms(startIdx, jumpForce) {
            const visited = new Set([startIdx]);
            const queue = [startIdx];

            while (queue.length > 0) {
                const curr = queue.shift();
                for (let i = 0; i < platforms.length; i++) {
                    if (!visited.has(i)) {
                        // Check jumping or safe dropping down
                        const canDrop = (platforms[i].y > platforms[curr].y) && 
                                        (Math.abs((platforms[curr].x + platforms[curr].width/2) - (platforms[i].x + platforms[i].width/2)) < (canvas.width * 0.4));
                        
                        if (canJumpBetween(platforms[curr], platforms[i], jumpForce) || canDrop) {
                            visited.add(i);
                            queue.push(i);
                        }
                    }
                }
            }
            return visited;
        }

        // GENERATE PROCEDURAL PLATFORM COURSE & SOLVABILITY CHECK
        function generateLevel() {
            let layoutAttempts = 0;
            let levelGenerated = false;

            // Reset Potion and Power-up State on level transition
            potion.active = false;
            potion.collected = false;
            player.hasSuperJump = false;

            while (!levelGenerated && layoutAttempts < 20) {
                layoutAttempts++;
                platforms = [];
                enemies = [];

                const w = canvas.width;
                const h = canvas.height;

                // Ground Floor Platform (Index 0 - Spawn Platform)
                platforms.push({ x: 0, y: h - 20, width: w, height: 20 });

                // Exit Goal at Upper Right
                exitGoal.x = w - 65;
                exitGoal.y = 25;

                // Exit Landing Pad (Index 1)
                platforms.push({
                    x: exitGoal.x - 10,
                    y: exitGoal.y + exitGoal.height,
                    width: exitGoal.width + 20,
                    height: 14
                });

                // Spawn Stepping Platforms
                const numTiers = 5;
                const tierHeight = (h - 100) / numTiers;
                let currentX = 80;
                let currentY = h - 80;

                for (let i = 0; i < numTiers; i++) {
                    const platWidth = Math.random() * 60 + 110;
                    platforms.push({
                        x: Math.max(20, Math.min(w - platWidth - 20, currentX)),
                        y: currentY,
                        width: platWidth,
                        height: 14
                    });

                    currentX += Math.random() * 120 + 80;
                    if (currentX > w - 180) currentX = w - 220;
                    currentY -= tierHeight;
                }

                // Random Bonus platforms
                for (let j = 0; j < 3; j++) {
                    platforms.push({
                        x: Math.random() * (w - 200) + 50,
                        y: Math.random() * (h - 200) + 100,
                        width: Math.random() * 50 + 90,
                        height: 14
                    });
                }

                const exitPlatIdx = 1; // Index of exit pad
                const reachableNormal = getReachablePlatforms(0, STANDARD_JUMP_FORCE);

                if (reachableNormal.has(exitPlatIdx)) {
                    // LEVEL IS SOLVABLE NORMALLY
                    levelGenerated = true;
                } else {
                    // TEST WITH SUPER JUMP
                    const reachableSuper = getReachablePlatforms(0, SUPER_JUMP_FORCE);
                    if (reachableSuper.has(exitPlatIdx)) {
                        // SOLVABLE WITH SUPER JUMP! SPAWN POTION
                        levelGenerated = true;
                        potion.active = true;

                        // Spawn potion on highest/furthest reachable platform under standard jump
                        let bestPlatIdx = 0;
                        let minY = 9999;
                        for (let idx of reachableNormal) {
                            if (platforms[idx].y < minY && idx !== exitPlatIdx) {
                                minY = platforms[idx].y;
                                bestPlatIdx = idx;
                            }
                        }

                        const pPlat = platforms[bestPlatIdx];
                        potion.x = pPlat.x + pPlat.width / 2 - potion.width / 2;
                        potion.y = pPlat.y - potion.height - 10;
                    }
                }
            }

            // Spawn Player at Starting Point
            player.x = 45;
            player.y = canvas.height - 35;
            player.vx = 0;
            player.vy = 0;

            // Spawn Enemies
            const enemyTypes = ['sharpener', 'eraser', 'desk'];
            const enemyCount = Math.min(3 + currentLevel, 8);

            for (let k = 0; k < enemyCount; k++) {
                const type = enemyTypes[Math.floor(Math.random() * enemyTypes.length)];
                enemies.push({
                    type: type,
                    x: Math.random() * (canvas.width - 300) + 200,
                    y: Math.random() * (canvas.height - 150) + 50,
                    speed: 1.2 + Math.random() * 0.8 + (currentLevel * 0.15),
                    vx: 0,
                    vy: 0,
                    width: type === 'desk' ? 32 : (type === 'sharpener' ? 24 : 26),
                    height: type === 'desk' ? 28 : (type === 'sharpener' ? 22 : 20),
                    facing: -1
                });
            }

            updateUI();
        }

        function updateUI() {
            document.getElementById('level-display').innerText = currentLevel;
            document.getElementById('score-display').innerText = trappedEnemies;
            document.getElementById('respawn-display').innerText = `${respawnCount} / ${MAX_RESPAWNS}`;
            document.getElementById('powerup-badge').style.display = player.hasSuperJump ? 'inline-block' : 'none';
        }

        function triggerGameOver() {
            isGameOver = true;
            const levelsBeat = Math.max(0, currentLevel - 1);
            document.getElementById('summary-levels').innerText = levelsBeat;
            document.getElementById('summary-score').innerText = trappedEnemies;
            document.getElementById('summary-overlay').style.display = 'flex';
        }

        function resetGame(fullReset = false) {
            if (fullReset) {
                currentLevel = 1;
                trappedEnemies = 0;
                respawnCount = 0;
                isGameOver = false;
                document.getElementById('summary-overlay').style.display = 'none';
            }
            generateLevel();
        }

        // PHYSICS & GAME LOGIC UPDATE
        function updatePhysics() {
            if (isGameOver) return;

            animTime += 0.05;

            // WASD Movement Controls ONLY
            let moveX = 0;
            if (keys['KeyA'] || keys['Keya']) { moveX -= 1; player.facing = -1; }
            if (keys['KeyD'] || keys['Keyd']) { moveX += 1; player.facing = 1; }

            player.vx = moveX * player.speed;

            // Jump Action (W Key) - Applies Super Jump force if powered up
            if ((keys['KeyW'] || keys['Keyw']) && player.isGrounded) {
                player.vy = player.hasSuperJump ? SUPER_JUMP_FORCE : STANDARD_JUMP_FORCE;
                player.isGrounded = false;

                // Spawn jump particles if super jump is active
                if (player.hasSuperJump) {
                    for (let p = 0; p < 8; p++) {
                        particles.push({
                            x: player.x,
                            y: player.y + 10,
                            vx: (Math.random() - 0.5) * 4,
                            vy: Math.random() * 2 + 1,
                            life: 20,
                            color: '#00ffff'
                        });
                    }
                }
            }

            // Apply Gravity
            player.vy += GRAVITY;

            // Weapon Activation (Spacebar)
            if (keys['Space']) {
                player.boxOpen = true;
            } else {
                player.boxOpen = false;
            }

            const prevY = player.y;

            // Apply Velocities
            player.x += player.vx;
            player.y += player.vy;

            // Screen bounds
            player.x = Math.max(15, Math.min(canvas.width - 15, player.x));

            // Platform Collision Check
            player.isGrounded = false;
            const legLength = 11;
            const feetY = player.y + legLength;
            const prevFeetY = prevY + legLength;

            for (let plat of platforms) {
                if (
                    player.x >= plat.x - 8 &&
                    player.x <= plat.x + plat.width + 8 &&
                    prevFeetY <= plat.y + 5 &&
                    feetY >= plat.y &&
                    player.vy >= 0
                ) {
                    player.y = plat.y - legLength;
                    player.vy = 0;
                    player.isGrounded = true;
                    break;
                }
            }

            // Walk Animation Cycle
            if (player.vx !== 0 && player.isGrounded) {
                player.walkFrame += 0.25;
            } else if (!player.isGrounded) {
                player.walkFrame = 1.2;
            } else {
                player.walkFrame = 0;
            }

            // Potion Collection Check
            if (potion.active && !potion.collected) {
                const hoverY = potion.y + Math.sin(animTime * 2) * 4;
                if (
                    player.x + 10 > potion.x &&
                    player.x - 10 < potion.x + potion.width &&
                    player.y + 10 > hoverY &&
                    player.y - 25 < hoverY + potion.height
                ) {
                    potion.collected = true;
                    player.hasSuperJump = true;
                    updateUI();

                    // Burst particle effect on pickup
                    for (let i = 0; i < 20; i++) {
                        particles.push({
                            x: potion.x + potion.width / 2,
                            y: hoverY + potion.height / 2,
                            vx: (Math.random() - 0.5) * 6,
                            vy: (Math.random() - 0.5) * 6,
                            life: 30,
                            color: Math.random() > 0.5 ? '#ffcc00' : '#00ffff'
                        });
                    }
                }
            }

            // Update Particle FX
            for (let i = particles.length - 1; i >= 0; i--) {
                const pt = particles[i];
                pt.x += pt.vx;
                pt.y += pt.vy;
                pt.life--;
                if (pt.life <= 0) particles.splice(i, 1);
            }

            // Check Goal Reached (Exit Portal)
            if (
                player.x >= exitGoal.x &&
                player.x <= exitGoal.x + exitGoal.width &&
                player.y >= exitGoal.y &&
                player.y <= exitGoal.y + exitGoal.height + 15
            ) {
                currentLevel++;
                generateLevel(); // Resets super-jump state on new level
                return;
            }

            // Trap Box Coordinates
            const trapBox = {
                x: player.facing === 1 ? player.x + 8 : player.x - 45,
                y: player.y - 25,
                width: 38,
                height: 32
            };

            // Enemy Physics & AI Chasing
            for (let i = enemies.length - 1; i >= 0; i--) {
                const enemy = enemies[i];

                const dx = player.x - enemy.x;
                const dy = (player.y - 15) - enemy.y;
                const dist = Math.hypot(dx, dy);

                if (dist > 0) {
                    enemy.vx = (dx / dist) * enemy.speed;
                    enemy.vy = (dy / dist) * enemy.speed * 0.6;
                }

                enemy.x += enemy.vx;
                enemy.y += enemy.vy;
                enemy.facing = enemy.vx >= 0 ? 1 : -1;

                // Trap Enemy
                if (
                    player.boxOpen &&
                    enemy.x + enemy.width > trapBox.x &&
                    enemy.x < trapBox.x + trapBox.width &&
                    enemy.y + enemy.height > trapBox.y &&
                    enemy.y < trapBox.y + trapBox.height
                ) {
                    enemies.splice(i, 1);
                    trappedEnemies++;
                    updateUI();
                    continue;
                }

                // Enemy Touch Collision -> Respawn Logic
                const playerHitbox = { x: player.x - 8, y: player.y - 25, width: 16, height: 35 };
                if (
                    enemy.x < playerHitbox.x + playerHitbox.width &&
                    enemy.x + enemy.width > playerHitbox.x &&
                    enemy.y < playerHitbox.y + playerHitbox.height &&
                    enemy.y + enemy.height > playerHitbox.y
                ) {
                    respawnCount++;
                    updateUI();

                    if (respawnCount >= MAX_RESPAWNS) {
                        triggerGameOver();
                    } else {
                        // Reset Stickman to starting point on current level
                        player.x = 45;
                        player.y = canvas.height - 35;
                        player.vx = 0;
                        player.vy = 0;
                    }
                    break;
                }
            }
        }

        // DRAW FUNCTIONS
        function drawSuperPotion() {
            if (!potion.active || potion.collected) return;

            const hoverY = potion.y + Math.sin(animTime * 2.5) * 5;
            const px = potion.x;

            ctx.save();

            // Radiant Pulsing Outer Aura Glow
            const glowRadius = 22 + Math.sin(animTime * 4) * 4;
            const grad = ctx.createRadialGradient(px + 10, hoverY + 13, 2, px + 10, hoverY + 13, glowRadius);
            grad.addColorStop(0, 'rgba(255, 204, 0, 0.8)');
            grad.addColorStop(0.5, 'rgba(0, 255, 255, 0.4)');
            grad.addColorStop(1, 'rgba(0, 0, 0, 0)');

            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(px + 10, hoverY + 13, glowRadius, 0, Math.PI * 2);
            ctx.fill();

            // Potion Bottle Glass Outline
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.fillStyle = '#00ffff';

            // Bottle Neck & Cork
            ctx.fillStyle = '#ffcc00';
            ctx.fillRect(px + 6, hoverY, 8, 4); // Cork

            ctx.beginPath();
            ctx.moveTo(px + 5, hoverY + 4);
            ctx.lineTo(px + 15, hoverY + 4);
            ctx.lineTo(px + 15, hoverY + 8);
            ctx.lineTo(px + 19, hoverY + 14);
            ctx.lineTo(px + 19, hoverY + 24);
            ctx.lineTo(px + 1, hoverY + 24);
            ctx.lineTo(px + 1, hoverY + 14);
            ctx.lineTo(px + 5, hoverY + 8);
            ctx.closePath();
            ctx.stroke();

            // Glowing Liquid Inside
            ctx.fillStyle = Math.sin(animTime * 6) > 0 ? '#ffcc00' : '#00ffff';
            ctx.fillRect(px + 3, hoverY + 14, 14, 8);

            // Floating Badge Header Label
            ctx.fillStyle = '#ffcc00';
            ctx.font = 'bold 10px monospace';
            ctx.textAlign = 'center';
            ctx.fillText('★ SUPER JUMP ★', px + 10, hoverY - 10);

            ctx.restore();
        }

        function drawParticles() {
            for (let pt of particles) {
                ctx.fillStyle = pt.color;
                ctx.globalAlpha = pt.life / 30;
                ctx.fillRect(pt.x, pt.y, 3, 3);
            }
            ctx.globalAlpha = 1.0;
        }

        function drawStickman(x, y, facing, walkFrame) {
            ctx.save();

            // Power-Up Player Particle Aura Effect
            if (player.hasSuperJump) {
                const auraGlow = ctx.createRadialGradient(x, y - 10, 2, x, y - 10, 25);
                auraGlow.addColorStop(0, 'rgba(0, 255, 255, 0.5)');
                auraGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = auraGlow;
                ctx.beginPath();
                ctx.arc(x, y - 10, 25, 0, Math.PI * 2);
                ctx.fill();

                // Sparkle energy trails
                if (Math.random() > 0.4) {
                    particles.push({
                        x: x + (Math.random() - 0.5) * 16,
                        y: y - Math.random() * 25,
                        vx: (Math.random() - 0.5) * 0.8,
                        vy: -Math.random() * 1.2,
                        life: 15,
                        color: Math.random() > 0.5 ? '#ffcc00' : '#00ffff'
                    });
                }
            }

            ctx.strokeStyle = player.hasSuperJump ? '#00ffff' : '#ffffff';
            ctx.fillStyle = player.hasSuperJump ? '#ffcc00' : '#ffffff';
            ctx.lineWidth = 1.8;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            const headRadius = 5;
            const bodyLength = 15;
            const legLength = 11;
            const neckY = y - bodyLength;
            const headY = neckY - headRadius;
            const shoulderY = neckY + 4;

            // Head
            ctx.beginPath();
            ctx.arc(x, headY, headRadius, 0, Math.PI * 2);
            ctx.stroke();

            // Eye direction indicator
            ctx.beginPath();
            ctx.arc(x + facing * 2, headY - 0.5, 0.8, 0, Math.PI * 2);
            ctx.fill();

            // Torso
            ctx.beginPath();
            ctx.moveTo(x, neckY);
            ctx.lineTo(x, y);
            ctx.stroke();

            // Legs
            const legSwing = Math.sin(walkFrame) * 6;
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x - legSwing, y + legLength);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + legSwing, y + legLength);
            ctx.stroke();

            // Arms & Trap Box Pose
            if (player.boxOpen) {
                ctx.beginPath();
                ctx.moveTo(x, shoulderY);
                ctx.lineTo(x + facing * 12, shoulderY - 2);
                ctx.stroke();

                const boxX = facing === 1 ? x + 8 : x - 45;
                const boxY = y - 25;

                ctx.strokeStyle = '#ffcc00';
                ctx.fillStyle = '#111111';
                ctx.lineWidth = 2;
                ctx.fillRect(boxX, boxY, 38, 30);
                ctx.strokeRect(boxX, boxY, 38, 30);

                // Open Box Lid
                ctx.beginPath();
                ctx.moveTo(boxX, boxY);
                ctx.lineTo(boxX + (facing === 1 ? -8 : 46), boxY - 12);
                ctx.stroke();

                // Pencils inside box
                ctx.fillStyle = '#ff3333';
                ctx.fillRect(boxX + 5, boxY + 12, 28, 4);
                ctx.fillStyle = '#3399ff';
                ctx.fillRect(boxX + 5, boxY + 20, 28, 4);

                ctx.fillStyle = '#ffcc00';
                ctx.font = '9px monospace';
                ctx.fillText('TRAP!', boxX + 4, boxY - 14);

            } else {
                const armSwing = Math.sin(walkFrame + Math.PI) * 4;
                ctx.beginPath();
                ctx.moveTo(x, shoulderY);
                ctx.lineTo(x - facing * 4 - armSwing, shoulderY + 6);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(x, shoulderY);
                ctx.lineTo(x + facing * 4 + armSwing, shoulderY + 6);
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawPlatforms() {
            ctx.strokeStyle = '#ffffff';
            ctx.fillStyle = '#222222';
            ctx.lineWidth = 1.5;

            for (let plat of platforms) {
                ctx.fillRect(plat.x, plat.y, plat.width, plat.height);
                ctx.strokeRect(plat.x, plat.y, plat.width, plat.height);

                ctx.beginPath();
                ctx.strokeStyle = '#00ffcc';
                ctx.moveTo(plat.x, plat.y);
                ctx.lineTo(plat.x + plat.width, plat.y);
                ctx.stroke();
                ctx.strokeStyle = '#ffffff';
            }
        }

        function drawExit() {
            ctx.strokeStyle = '#00ffcc';
            ctx.lineWidth = 2;
            ctx.strokeRect(exitGoal.x, exitGoal.y, exitGoal.width, exitGoal.height);

            ctx.fillStyle = 'rgba(0, 255, 204, 0.15)';
            ctx.fillRect(exitGoal.x, exitGoal.y, exitGoal.width, exitGoal.height);

            ctx.fillStyle = '#00ffcc';
            ctx.font = 'bold 10px monospace';
            ctx.textAlign = 'left';
            ctx.fillText('EXIT ►', exitGoal.x + 4, exitGoal.y + 34);
        }

        function drawEnemies() {
            for (let enemy of enemies) {
                ctx.save();
                ctx.translate(enemy.x, enemy.y);

                if (enemy.type === 'sharpener') {
                    ctx.strokeStyle = '#ff3366';
                    ctx.fillStyle = '#2a0a12';
                    ctx.lineWidth = 1.8;

                    ctx.fillRect(0, 0, enemy.width, enemy.height);
                    ctx.strokeRect(0, 0, enemy.width, enemy.height);

                    ctx.fillStyle = '#ff3366';
                    ctx.fillRect(enemy.width / 4, 4, 10, 10);

                    ctx.beginPath();
                    ctx.moveTo(enemy.facing === 1 ? 0 : enemy.width, enemy.height / 2);
                    ctx.lineTo(enemy.facing === 1 ? -6 : enemy.width + 6, enemy.height / 2 - 4);
                    ctx.stroke();

                } else if (enemy.type === 'eraser') {
                    ctx.strokeStyle = '#ff66cc';
                    ctx.fillStyle = '#330022';
                    ctx.lineWidth = 1.8;

                    ctx.beginPath();
                    ctx.moveTo(6, 0);
                    ctx.lineTo(enemy.width, 0);
                    ctx.lineTo(enemy.width - 6, enemy.height);
                    ctx.lineTo(0, enemy.height);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();

                    ctx.fillStyle = '#ff66cc';
                    ctx.fillRect(8, 5, 4, 3);
                    ctx.fillRect(16, 5, 4, 3);

                } else if (enemy.type === 'desk') {
                    ctx.strokeStyle = '#ff9900';
                    ctx.fillStyle = '#261700';
                    ctx.lineWidth = 1.8;

                    ctx.fillRect(0, 0, enemy.width, 10);
                    ctx.strokeRect(0, 0, enemy.width, 10);

                    ctx.beginPath();
                    ctx.moveTo(4, 10); ctx.lineTo(2, enemy.height);
                    ctx.moveTo(enemy.width - 4, 10); ctx.lineTo(enemy.width - 2, enemy.height);
                    ctx.stroke();

                    ctx.fillRect(enemy.facing === 1 ? 2 : enemy.width - 8, -8, 6, 8);
                }

                ctx.restore();
            }
        }

        function draw() {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawPlatforms();
            drawExit();
            drawSuperPotion();
            drawEnemies();
            drawParticles();
            drawStickman(player.x, player.y, player.facing, player.walkFrame);
        }

        function animate() {
            updatePhysics();
            draw();
            requestAnimationFrame(animate);
        }

        window.onload = function() {
            setupTouchControls();
            resizeCanvas();
            animate();
        };
    </script>
</body>
</html>
