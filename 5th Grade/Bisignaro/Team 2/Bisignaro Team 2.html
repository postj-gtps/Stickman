<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Stickman Engine - Top-Down School Edition</title>
 <style>
 * {
 box-sizing: border-box;
 user-select: none;
 margin: 0;
 padding: 0;
 font-family: 'Courier New', Courier, monospace, sans-serif;
 }

 body {
 background-color: #0b0c10;
 color: #ffffff;
 display: flex;
 flex-direction: column;
 align-items: center;
 justify-content: flex-start;
 height: 100vh;
 overflow: hidden;
 padding: 16px;
 }

 /* Header Bar */
 #header {
 display: flex;
 justify-content: space-between;
 align-items: center;
 width: 100%;
 max-width: 1200px;
 margin-bottom: 12px;
 padding-bottom: 8px;
 border-bottom: 2px solid #ffffff;
 }

 h1 {
 font-size: 20px;
 letter-spacing: 2px;
 text-transform: uppercase;
 font-weight: bold;
 }

 .btn-reset {
 background: transparent;
 color: #ffffff;
 border: 2px solid #ffffff;
 padding: 8px 20px;
 font-size: 14px;
 font-weight: bold;
 cursor: pointer;
 text-transform: uppercase;
 letter-spacing: 1px;
 transition: all 0.15s ease-in-out;
 }

 .btn-reset:hover {
 background: #ffffff;
 color: #000000;
 }

 /* Canvas Container */
 #canvas-wrapper {
 position: relative;
 width: 100%;
 max-width: 1200px;
 flex-grow: 1;
 display: flex;
 justify-content: center;
 align-items: center;
 }

 canvas {
 background-color: #1e3a1e;
 border: 2px solid #ffffff;
 display: block;
 width: 100%;
 height: 100%;
 }

 .instructions {
 margin-top: 8px;
 font-size: 12px;
 color: #aaaaaa;
 text-align: center;
 letter-spacing: 1px;
 }
 </style>
</head>
<body>

 <!-- Header Section -->
 <div id="header">
 <h1>Stickman Engine - Bisignaro Team 2</h1>
 <button class="btn-reset" onclick="resetSimulation()">Generate New School</button>
 </div>

 <!-- Canvas Container -->
 <div id="canvas-wrapper">
 <canvas id="simCanvas"></canvas>
 </div>

 <div class="instructions">
 [WASD] Move (Arrow keys disabled) | Solid Collision Active | Top-Down View
 </div>

 <script>
 const canvas = document.getElementById('simCanvas');
 const ctx = canvas.getContext('2d');

 // KEYBOARD INPUT STATE (Strictly WASD)
 const keys = {};

 // STICKMAN PLAYER STATE
 const player = {
 x: 0,
 y: 0,
 radius: 14,
 speed: 5.5,
 angle: 0, // Facing direction in radians
 walkFrame: 0,
 isMoving: false
 };

 // CAMERA STATE
 const camera = {
 x: 0,
 y: 0
 };

 // MAP & GEOMETRY DEFINITIONS
 const ROOM_DEFINITIONS = [
 { id: 'ela', name: "ELA Room", floor: "#2b3e50", wall: "#15222e", type: "ela", w: 950, h: 650 },
 { id: 'math', name: "Math Room", floor: "#1b4d3e", wall: "#0d2b22", type: "math", w: 950, h: 650 },
 { id: 'science', name: "Science Room", floor: "#3d2b56", wall: "#211531", type: "science", w: 1000, h: 700 },
 { id: 'history', name: "History Room", floor: "#523a28", wall: "#2d1f15", type: "history", w: 950, h: 650 },
 { id: 'gym', name: "Gymnasium", floor: "#c68b59", wall: "#6b421d", type: "gym", w: 1300, h: 800 },
 { id: 'bathrooms', name: "Bathrooms", floor: "#005f73", wall: "#002b36", type: "bathrooms", w: 850, h: 600 },
 { id: 'cafeteria', name: "Cafeteria", floor: "#8d5b4c", wall: "#4a2e26", type: "cafeteria", w: 1250, h: 750 },
 { id: 'auditorium', name: "Auditorium", floor: "#4a121a", wall: "#24080c", type: "auditorium", w: 1300, h: 800 },
 { id: 'secretary', name: "Secretary's Office", floor: "#435d68", wall: "#213036", type: "secretary", w: 850, h: 600 },
 { id: 'principal', name: "Principal's Office", floor: "#3a2e2b", wall: "#1f1816", type: "principal", w: 900, h: 650 },
 { id: 'supply', name: "Supply Closet", floor: "#333333", wall: "#1a1a1a", type: "supply", w: 700, h: 550 },
 { id: 'detention', name: "Detention Dungeon", floor: "#15171e", wall: "#0a0b0e", type: "detention", w: 1050, h: 700 }
 ];

 let rooms = [];
 let colliders = []; // Array of solid AABB obstacles: {x1, y1, x2, y2}
 let hallway = { x: 0, y: -160, w: 0, h: 320 };
 let totalSchoolWidth = 0;

 function shuffleArray(array) {
 const arr = [...array];
 for (let i = arr.length - 1; i > 0; i--) {
 const j = Math.floor(Math.random() * (i + 1));
 [arr[i], arr[j]] = [arr[j], arr[i]];
 }
 return arr;
 }

 function generateSchool() {
 const shuffled = shuffleArray(ROOM_DEFINITIONS);
 const topPool = shuffled.slice(0, 6);
 const bottomPool = shuffled.slice(6, 12);

 rooms = [];
 colliders = [];

 const hallYTop = -160;
 const hallYBottom = 160;
 const doorWidth = 140;
 const startPadding = 250;
 const roomGap = 50;

 // Layout Top Rooms
 let xTop = startPadding;
 topPool.forEach(r => {
 const rm = {
 ...r,
 x: xTop,
 y: hallYTop - r.h,
 side: 'top',
 doorX: xTop + r.w / 2,
 doorW: doorWidth
 };
 rooms.push(rm);
 xTop += r.w + roomGap;
 });

 // Layout Bottom Rooms
 let xBottom = startPadding;
 bottomPool.forEach(r => {
 const rm = {
 ...r,
 x: xBottom,
 y: hallYBottom,
 side: 'bottom',
 doorX: xBottom + r.w / 2,
 doorW: doorWidth
 };
 rooms.push(rm);
 xBottom += r.w + roomGap;
 });

 totalSchoolWidth = Math.max(xTop, xBottom) + startPadding;
 hallway.x = 0;
 hallway.w = totalSchoolWidth;

 // Spawn Stickman in middle of hallway
 player.x = totalSchoolWidth / 2;
 player.y = 0;
 player.angle = 0;

 // BUILD SOLID COLLIDERS
 const wallThickness = 16;

 // 1. Room Perimeter Colliders
 rooms.forEach(r => {
 if (r.side === 'top') {
 colliders.push({ x1: r.x - wallThickness, y1: r.y - wallThickness, x2: r.x + r.w + wallThickness, y2: r.y });
 } else {
 colliders.push({ x1: r.x - wallThickness, y1: r.y + r.h, x2: r.x + r.w + wallThickness, y2: r.y + r.h + wallThickness });
 }

 // Left & Right Room Walls
 colliders.push({ x1: r.x - wallThickness, y1: r.y, x2: r.x, y2: r.y + r.h });
 colliders.push({ x1: r.x + r.w, y1: r.y, x2: r.x + r.w + wallThickness, y2: r.y + r.h });

 // Door Wall
 const doorWallY = r.side === 'top' ? r.y + r.h : r.y - wallThickness;
 colliders.push({ x1: r.x - wallThickness, y1: doorWallY, x2: r.doorX - r.doorW / 2, y2: doorWallY + wallThickness });
 colliders.push({ x1: r.doorX + r.doorW / 2, y1: doorWallY, x2: r.x + r.w + wallThickness, y2: doorWallY + wallThickness });

 // Add Room Furniture Colliders
 addRoomFurnitureColliders(r);
 });

 // 2. Hallway Exterior Walls & Lockers
 buildHallwayWallsAndLockers(topPool, bottomPool, wallThickness);
 }

 function addRoomFurnitureColliders(r) {
 const rx = r.x;
 const ry = r.y;

 switch (r.type) {
 case 'ela':
 // Bookshelf
 colliders.push({ x1: rx + r.w - 220, y1: ry + 60, x2: rx + r.w - 60, y2: ry + 110 });
 // Teacher Desk
 colliders.push({ x1: rx + 80, y1: ry + 80, x2: rx + 240, y2: ry + 150 });
 // Student Desk Rows
 for (let x = rx + 120; x < rx + r.w - 120; x += 180) {
 for (let y = ry + 240; y < ry + r.h - 140; y += 140) {
 colliders.push({ x1: x, y1: y, x2: x + 90, y2: y + 60 });
 }
 }
 break;

 case 'math':
 case 'history':
 // Teacher Desk
 colliders.push({ x1: rx + 80, y1: ry + 80, x2: rx + 240, y2: ry + 150 });
 // Student Desk Rows
 for (let x = rx + 120; x < rx + r.w - 120; x += 180) {
 for (let y = ry + 240; y < ry + r.h - 140; y += 140) {
 colliders.push({ x1: x, y1: y, x2: x + 90, y2: y + 60 });
 }
 }
 break;

 case 'science':
 colliders.push({ x1: rx + 120, y1: ry + 200, x2: rx + r.w - 120, y2: ry + 260 });
 colliders.push({ x1: rx + 120, y1: ry + 420, x2: rx + r.w - 120, y2: ry + 480 });
 colliders.push({ x1: rx + 80, y1: ry + 60, x2: rx + 300, y2: ry + 120 });
 break;

 case 'gym':
 // Bleachers along top wall
 colliders.push({ x1: rx + 100, y1: ry + 30, x2: rx + r.w - 100, y2: ry + 120 });
 // Equipment Ball Racks
 colliders.push({ x1: rx + 50, y1: ry + 250, x2: rx + 110, y2: ry + 450 });
 colliders.push({ x1: rx + r.w - 110, y1: ry + 250, x2: rx + r.w - 50, y2: ry + 450 });
 // Basketball Hoops
 colliders.push({ x1: rx + 60, y1: ry + r.h / 2 - 25, x2: rx + 75, y2: ry + r.h / 2 + 25 });
 colliders.push({ x1: rx + r.w - 75, y1: ry + r.h / 2 - 25, x2: rx + r.w - 60, y2: ry + r.h / 2 + 25 });
 break;

 case 'bathrooms':
 // Sink Counter
 colliders.push({ x1: rx + 80, y1: ry + 60, x2: rx + r.w - 80, y2: ry + 120 });
 // Toilet Stall Rows
 colliders.push({ x1: rx + 100, y1: ry + 250, x2: rx + r.w - 100, y2: ry + 320 });
 break;

 case 'cafeteria':
 colliders.push({ x1: rx + 100, y1: ry + 80, x2: rx + r.w - 100, y2: ry + 150 });
 colliders.push({ x1: rx + 120, y1: ry + 280, x2: rx + r.w - 120, y2: ry + 360 });
 colliders.push({ x1: rx + 120, y1: ry + 480, x2: rx + r.w - 120, y2: ry + 560 });
 break;

 case 'auditorium':
 colliders.push({ x1: rx + 120, y1: ry + 50, x2: rx + r.w - 120, y2: ry + 240 });
 colliders.push({ x1: rx + 150, y1: ry + 360, x2: rx + r.w / 2 - 40, y2: ry + 600 });
 colliders.push({ x1: rx + r.w / 2 + 40, y1: ry + 360, x2: rx + r.w - 150, y2: ry + 600 });
 break;

 case 'secretary':
 case 'principal':
 colliders.push({ x1: rx + r.w / 2 - 140, y1: ry + 150, x2: rx + r.w / 2 + 140, y2: ry + 230 });
 colliders.push({ x1: rx + 60, y1: ry + 50, x2: rx + 240, y2: ry + 110 });
 colliders.push({ x1: rx + r.w - 240, y1: ry + 50, x2: rx + r.w - 60, y2: ry + 110 });
 break;

 case 'supply':
 colliders.push({ x1: rx + 50, y1: ry + 50, x2: rx + r.w - 50, y2: ry + 120 });
 colliders.push({ x1: rx + 50, y1: ry + 200, x2: rx + 150, y2: ry + r.h - 50 });
 colliders.push({ x1: rx + r.w - 150, y1: ry + 200, x2: rx + r.w - 50, y2: ry + r.h - 50 });
 break;

 case 'detention':
 colliders.push({ x1: rx + 80, y1: ry + 80, x2: rx + r.w - 80, y2: ry + 140 });
 colliders.push({ x1: rx + r.w / 2 - 100, y1: ry + r.h / 2 - 30, x2: rx + r.w / 2 + 100, y2: ry + r.h / 2 + 30 });
 colliders.push({ x1: rx + 120, y1: ry + r.h - 180, x2: rx + 180, y2: ry + r.h - 120 });
 colliders.push({ x1: rx + r.w - 180, y1: ry + r.h - 180, x2: rx + r.w - 120, y2: ry + r.h - 120 });
 break;
 }
 }

 function buildHallwayWallsAndLockers(topPool, bottomPool, wallThickness) {
 const hallYTop = -160;
 const hallYBottom = 160;
 const exitDoorHeight = 160;

 // Left Hallway End Wall
 colliders.push({ x1: -wallThickness, y1: hallYTop, x2: 0, y2: -exitDoorHeight / 2 });
 colliders.push({ x1: -wallThickness, y1: exitDoorHeight / 2, x2: 0, y2: hallYBottom });

 // Right Hallway End Wall
 colliders.push({ x1: totalSchoolWidth, y1: hallYTop, x2: totalSchoolWidth + wallThickness, y2: -exitDoorHeight / 2 });
 colliders.push({ x1: totalSchoolWidth, y1: exitDoorHeight / 2, x2: totalSchoolWidth + wallThickness, y2: hallYBottom });

 // Lockers along top wall
 let currentX = 0;
 rooms.filter(r => r.side === 'top').forEach(r => {
 if (r.x > currentX) {
 colliders.push({ x1: currentX, y1: hallYTop - wallThickness, x2: r.x, y2: hallYTop });
 colliders.push({ x1: currentX + 10, y1: hallYTop, x2: r.x - 10, y2: hallYTop + 24 });
 }
 currentX = r.x + r.w;
 });
 if (currentX < totalSchoolWidth) {
 colliders.push({ x1: currentX, y1: hallYTop - wallThickness, x2: totalSchoolWidth, y2: hallYTop });
 colliders.push({ x1: currentX + 10, y1: hallYTop, x2: totalSchoolWidth - 10, y2: hallYTop + 24 });
 }

 // Lockers along bottom wall
 currentX = 0;
 rooms.filter(r => r.side === 'bottom').forEach(r => {
 if (r.x > currentX) {
 colliders.push({ x1: currentX, y1: hallYBottom, x2: r.x, y2: hallYBottom + wallThickness });
 colliders.push({ x1: currentX + 10, y1: hallYBottom - 24, x2: r.x - 10, y2: hallYBottom });
 }
 currentX = r.x + r.w;
 });
 if (currentX < totalSchoolWidth) {
 colliders.push({ x1: currentX, y1: hallYBottom, x2: totalSchoolWidth, y2: hallYBottom + wallThickness });
 colliders.push({ x1: currentX + 10, y1: hallYBottom - 24, x2: totalSchoolWidth - 10, y2: hallYBottom });
 }
 }

 function resizeCanvas() {
 const wrapper = document.getElementById('canvas-wrapper');
 canvas.width = wrapper.clientWidth;
 canvas.height = wrapper.clientHeight;
 }

 window.addEventListener('resize', resizeCanvas);

 // STRICT WASD CONTROLS
 window.addEventListener('keydown', (e) => {
 if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
 e.preventDefault();
 return;
 }

 if (['KeyW', 'KeyA', 'KeyS', 'KeyD'].includes(e.code)) {
 e.preventDefault();
 keys[e.code] = true;
 }
 });

 window.addEventListener('keyup', (e) => {
 if (['KeyW', 'KeyA', 'KeyS', 'KeyD'].includes(e.code)) {
 keys[e.code] = false;
 }
 });

 function resetSimulation() {
 generateSchool();
 }

 // COLLISION DETECTION AND MOVEMENT PHYSICS
 function circleAABBIntersect(px, py, r, box) {
 const closestX = Math.max(box.x1, Math.min(px, box.x2));
 const closestY = Math.max(box.y1, Math.min(py, box.y2));
 const distX = px - closestX;
 const distY = py - closestY;
 return (distX * distX + distY * distY) < (r * r);
 }

 function updatePhysics() {
 let dx = 0;
 let dy = 0;

 if (keys['KeyW']) dy -= 1;
 if (keys['KeyS']) dy += 1;
 if (keys['KeyA']) dx -= 1;
 if (keys['KeyD']) dx += 1;

 if (dx !== 0 || dy !== 0) {
 player.isMoving = true;
 const len = Math.hypot(dx, dy);
 dx /= len;
 dy /= len;

 player.angle = Math.atan2(dy, dx);
 player.walkFrame += 0.25;

 const stepX = dx * player.speed;
 const stepY = dy * player.speed;

 // Horizontal Movement & Solid Collision
 player.x += stepX;
 for (const c of colliders) {
 if (circleAABBIntersect(player.x, player.y, player.radius, c)) {
 if (stepX > 0) player.x = c.x1 - player.radius;
 else if (stepX < 0) player.x = c.x2 + player.radius;
 }
 }

 // Vertical Movement & Solid Collision
 player.y += stepY;
 for (const c of colliders) {
 if (circleAABBIntersect(player.x, player.y, player.radius, c)) {
 if (stepY > 0) player.y = c.y1 - player.radius;
 else if (stepY < 0) player.y = c.y2 + player.radius;
 }
 }
 } else {
 player.isMoving = false;
 player.walkFrame = 0;
 }

 // Smooth Camera Follow
 const targetCamX = player.x - canvas.width / 2;
 const targetCamY = player.y - canvas.height / 2;
 camera.x += (targetCamX - camera.x) * 0.12;
 camera.y += (targetCamY - camera.y) * 0.12;
 }

 // RENDER FUNCTIONS
 function drawInfiniteField(camX, camY) {
 ctx.fillStyle = '#224718';
 ctx.fillRect(camX, camY, canvas.width, canvas.height);

 ctx.strokeStyle = '#2b5420';
 ctx.lineWidth = 1.5;
 const step = 80;
 const startX = Math.floor(camX / step) * step - step;
 const endX = camX + canvas.width + step;
 const startY = Math.floor(camY / step) * step - step;
 const endY = camY + canvas.height + step;

 for (let x = startX; x < endX; x += step) {
 for (let y = startY; y < endY; y += step) {
 if (x < -100 || x > totalSchoolWidth + 100 || y < -1200 || y > 1200) {
 const ox = Math.abs((x * 7 + y * 13) % 40);
 const oy = Math.abs((x * 11 + y * 5) % 40);

 ctx.beginPath();
 ctx.moveTo(x + ox, y + oy);
 ctx.lineTo(x + ox - 3, y + oy - 8);
 ctx.moveTo(x + ox, y + oy);
 ctx.lineTo(x + ox + 4, y + oy - 10);
 ctx.stroke();
 }
 }
 }
 }

 function drawHallway() {
 ctx.fillStyle = '#cfd8dc';
 ctx.fillRect(hallway.x, hallway.y, hallway.w, hallway.h);

 ctx.strokeStyle = '#b0bec5';
 ctx.lineWidth = 1.5;
 for (let x = hallway.x; x < hallway.x + hallway.w; x += 50) {
 ctx.beginPath();
 ctx.moveTo(x, hallway.y);
 ctx.lineTo(x, hallway.y + hallway.h);
 ctx.stroke();
 }
 for (let y = hallway.y; y < hallway.y + hallway.h; y += 50) {
 ctx.beginPath();
 ctx.moveTo(hallway.x, y);
 ctx.lineTo(hallway.x + hallway.w, y);
 ctx.stroke();
 }

 ctx.strokeStyle = '#fbc02d';
 ctx.lineWidth = 3;
 ctx.setLineDash([15, 15]);
 ctx.beginPath();
 ctx.moveTo(hallway.x, 0);
 ctx.lineTo(hallway.x + hallway.w, 0);
 ctx.stroke();
 ctx.setLineDash([]);
 }

 function drawLockersAndExits() {
 const hallYTop = -160;
 const hallYBottom = 160;

 colliders.forEach(c => {
 if (c.y1 === hallYTop && c.y2 === hallYTop + 24) {
 drawLockerBank(c.x1, c.y1, c.x2 - c.x1, 24, 'top');
 } else if (c.y1 === hallYBottom - 24 && c.y2 === hallYBottom) {
 drawLockerBank(c.x1, c.y1, c.x2 - c.x1, 24, 'bottom');
 }
 });

 drawExitDoor(0, -80, 20, 160, "WEST EXIT");
 drawExitDoor(totalSchoolWidth - 20, -80, 20, 160, "EAST EXIT");
 }

 function drawLockerBank(x, y, w, h, side) {
 ctx.fillStyle = '#37474f';
 ctx.fillRect(x, y, w, h);
 ctx.strokeStyle = '#102027';
 ctx.lineWidth = 2;
 ctx.strokeRect(x, y, w, h);

 const lockerW = 20;
 for (let lx = x; lx < x + w - lockerW; lx += lockerW) {
 ctx.strokeStyle = '#263238';
 ctx.strokeRect(lx, y, lockerW, h);
 ctx.fillStyle = '#eceff1';
 ctx.fillRect(lx + 8, y + (side === 'top' ? 14 : 4), 4, 5);
 }
 }

 function drawExitDoor(x, y, w, h, label) {
 ctx.fillStyle = '#0288d1';
 ctx.fillRect(x, y, w, h);
 ctx.strokeStyle = '#ffffff';
 ctx.lineWidth = 3;
 ctx.strokeRect(x, y, w, h);

 ctx.fillStyle = '#ffffff';
 ctx.font = 'bold 12px monospace';
 ctx.textAlign = 'center';
 ctx.fillText("EXIT", x + w / 2, y + h / 2);
 }

 function drawRoom(r) {
 ctx.fillStyle = r.floor;
 ctx.fillRect(r.x, r.y, r.w, r.h);

 ctx.strokeStyle = r.wall;
 ctx.lineWidth = 12;
 ctx.strokeRect(r.x, r.y, r.w, r.h);

 const doorY = r.side === 'top' ? r.y + r.h : r.y;
 ctx.fillStyle = r.floor;
 ctx.fillRect(r.doorX - r.doorW / 2, doorY - 8, r.doorW, 16);

 ctx.save();
 ctx.translate(r.x, r.y);
 drawRoomFurnitureGraphic(r);
 ctx.restore();

 ctx.fillStyle = r.type === 'detention' ? '#ff5252' : '#ffffff';
 ctx.font = r.type === 'detention' ? 'bold 18px monospace' : 'bold 16px monospace';
 ctx.textAlign = 'center';
 const textY = r.side === 'top' ? r.y + 40 : r.y + r.h - 30;
 ctx.fillText(r.name.toUpperCase(), r.x + r.w / 2, textY);
 }

 function drawRoomFurnitureGraphic(r) {
 const w = r.w;
 const h = r.h;

 switch (r.type) {
 case 'ela':
 drawClassroomBase(w, h, "#90caf9", "BOOKS & LITERATURE");
 ctx.fillStyle = '#4e3629';
 ctx.fillRect(w - 220, 60, 160, 50);
 ctx.fillStyle = '#e0e0e0';
 ctx.font = '12px monospace';
 ctx.fillText("BOOKSHELF", w - 140, 90);
 break;

 case 'math':
 drawClassroomBase(w, h, "#a5d6a7", "ALGEBRA & GEOMETRY");
 ctx.fillStyle = '#ffffff';
 ctx.font = 'bold 14px monospace';
 ctx.fillText("π ≈ 3.14159   a² + b² = c²   E = mc²", w / 2, 80);
 break;

 case 'science':
 drawClassroomBase(w, h, "#80deea", "LAB ROTATIONS");
 ctx.fillStyle = '#37474f';
 ctx.fillRect(80, 60, 220, 60);
 ctx.strokeStyle = '#102027';
 ctx.lineWidth = 2;
 ctx.strokeRect(80, 60, 220, 60);
 ctx.fillStyle = '#ffffff';
 ctx.font = 'bold 11px monospace';
 ctx.fillText("PREP STATION", 190, 95);

 ctx.fillStyle = '#263238';
 ctx.fillRect(120, 200, w - 240, 60);
 ctx.fillRect(120, 420, w - 240, 60);
 ctx.fillStyle = '#00e676';
 ctx.beginPath(); ctx.arc(180, 230, 12, 0, Math.PI * 2); ctx.fill();
 ctx.fillStyle = '#ff4081';
 ctx.beginPath(); ctx.arc(w - 180, 450, 12, 0, Math.PI * 2); ctx.fill();
 break;

 case 'history':
 drawClassroomBase(w, h, "#ffe082", "WORLD HISTORY");
 ctx.fillStyle = '#1565c0';
 ctx.fillRect(w / 2 - 150, 40, 300, 60);
 ctx.fillStyle = '#ffffff';
 ctx.font = 'bold 12px monospace';
 ctx.fillText("WORLD MAP", w / 2, 75);
 break;

 case 'gym':
 ctx.strokeStyle = '#ffffff';
 ctx.lineWidth = 4;
 ctx.strokeRect(60, 60, w - 120, h - 120);
 ctx.beginPath();
 ctx.arc(w / 2, h / 2, 80, 0, Math.PI * 2);
 ctx.moveTo(w / 2, 60); ctx.lineTo(w / 2, h - 60);
 ctx.stroke();

 ctx.fillStyle = '#ff6d00';
 ctx.fillRect(60, h / 2 - 25, 15, 50);
 ctx.fillRect(w - 75, h / 2 - 25, 15, 50);

 ctx.fillStyle = '#5d4037';
 ctx.fillRect(100, 30, w - 200, 90);
 ctx.strokeStyle = '#3e2723';
 ctx.lineWidth = 2;
 ctx.strokeRect(100, 30, w - 200, 90);
 ctx.strokeStyle = '#8d6e63';
 for (let by = 55; by < 120; by += 25) {
 ctx.beginPath(); ctx.moveTo(100, by); ctx.lineTo(w - 100, by); ctx.stroke();
 }
 ctx.fillStyle = '#ffffff';
 ctx.font = 'bold 12px monospace';
 ctx.textAlign = 'center';
 ctx.fillText("SPECTATOR BLEACHERS", w / 2, 48);

 ctx.fillStyle = '#37474f';
 ctx.fillRect(50, 250, 60, 200);
 ctx.strokeStyle = '#102027';
 ctx.lineWidth = 2;
 ctx.strokeRect(50, 250, 60, 200);
 ctx.fillStyle = '#ff6d00';
 for (let ry = 275; ry <= 425; ry += 30) {
 ctx.beginPath(); ctx.arc(80, ry, 10, 0, Math.PI * 2); ctx.fill();
 }

 ctx.fillStyle = '#37474f';
 ctx.fillRect(w - 110, 250, 60, 200);
 ctx.strokeStyle = '#102027';
 ctx.lineWidth = 2;
 ctx.strokeRect(w - 110, 250, 60, 200);
 ctx.fillStyle = '#ff6d00';
 for (let ry = 275; ry <= 425; ry += 30) {
 ctx.beginPath(); ctx.arc(w - 80, ry, 10, 0, Math.PI * 2); ctx.fill();
 }
 break;

 case 'bathrooms':
 ctx.strokeStyle = '#00838f';
 ctx.lineWidth = 1;
 for (let x = 0; x < w; x += 40) {
 ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
 }

 ctx.fillStyle = '#e0e0e0';
 ctx.fillRect(80, 60, w - 160, 60);
 ctx.strokeStyle = '#263238';
 ctx.lineWidth = 2;
 ctx.strokeRect(80, 60, w - 160, 60);

 for (let sx = 120; sx < w - 120; sx += 80) {
 ctx.fillStyle = '#b0bec5';
 ctx.beginPath(); ctx.arc(sx, 90, 15, 0, Math.PI * 2); ctx.fill();
 ctx.strokeStyle = '#37474f'; ctx.stroke();
 }

 ctx.fillStyle = '#00796b';
 ctx.font = 'bold 14px monospace';
 ctx.textAlign = 'center';
 ctx.fillText("RESTROOM SINKS", w / 2, 45);

 const stallX = 100;
 const stallW = w - 200;
 const stallH = 70;
 const stallY = 250;

 ctx.fillStyle = '#004d40';
 ctx.fillRect(stallX, stallY, stallW, stallH);
 ctx.strokeStyle = '#00251a';
 ctx.lineWidth = 3;
 ctx.strokeRect(stallX, stallY, stallW, stallH);

 const numStalls = Math.floor(stallW / 110);
 const stepW = stallW / numStalls;
 for (let i = 0; i < numStalls; i++) {
 const curX = stallX + i * stepW;
 ctx.strokeStyle = '#00251a';
 ctx.strokeRect(curX, stallY, stepW, stallH);

 ctx.fillStyle = '#ffffff';
 ctx.beginPath();
 ctx.arc(curX + stepW / 2, stallY + 35, 12, 0, Math.PI * 2);
 ctx.fill();
 ctx.fillStyle = '#b0bec5';
 ctx.fillRect(curX + stepW / 2 - 10, stallY + 10, 20, 12);
 }
 break;

 case 'cafeteria':
 ctx.fillStyle = '#d84315';
 ctx.fillRect(100, 80, w - 200, 70);
 ctx.fillStyle = '#ffffff';
 ctx.font = 'bold 14px monospace';
 ctx.fillText("LUNCH SERVING LINE", w / 2, 120);
 ctx.fillStyle = '#4e3629';
 ctx.fillRect(120, 280, w - 240, 80);
 ctx.fillRect(120, 480, w - 240, 80);
 break;

 case 'auditorium':
 ctx.fillStyle = '#b71c1c';
 ctx.fillRect(120, 50, w - 240, 190);
 ctx.fillStyle = '#ffffff';
 ctx.font = 'bold 18px monospace';
 ctx.fillText("MAIN STAGE", w / 2, 150);
 ctx.fillStyle = '#880e4f';
 ctx.fillRect(150, 360, w / 2 - 190, 240);
 ctx.fillRect(w / 2 + 40, 360, w / 2 - 190, 240);
 break;

 case 'secretary':
 ctx.fillStyle = '#37474f';
 ctx.fillRect(w / 2 - 140, 150, 280, 80);
 ctx.fillStyle = '#ffffff';
 ctx.font = 'bold 12px monospace';
 ctx.fillText("RECEPTION DESK", w / 2, 195);

 ctx.fillStyle = '#263238';
 ctx.fillRect(60, 50, 180, 60);
 ctx.fillRect(w - 240, 50, 180, 60);
 ctx.fillStyle = '#cfd8dc';
 ctx.font = 'bold 11px monospace';
 ctx.fillText("FILING CABINETS", 150, 85);
 ctx.fillText("FILING CABINETS", w - 150, 85);
 break;

 case 'principal':
 ctx.fillStyle = '#2d1f15';
 ctx.fillRect(w / 2 - 140, 150, 280, 80);
 ctx.fillStyle = '#d4af37';
 ctx.font = 'bold 12px monospace';
 ctx.fillText("PRINCIPAL'S MAHOGANY DESK", w / 2, 195);

 ctx.fillStyle = '#1b120c';
 ctx.fillRect(60, 50, 180, 60);
 ctx.fillRect(w - 240, 50, 180, 60);
 ctx.fillStyle = '#d4af37';
 ctx.font = 'bold 11px monospace';
 ctx.fillText("BOOKSHELVES", 150, 85);
 ctx.fillText("BOOKSHELVES", w - 150, 85);
 break;

 case 'supply':
 ctx.fillStyle = '#424242';
 ctx.fillRect(50, 50, w - 100, 70);
 ctx.fillRect(50, 200, 100, h - 250);
 ctx.fillRect(w - 150, 200, 100, h - 250);
 ctx.fillStyle = '#ffffff';
 ctx.font = 'bold 12px monospace';
 ctx.fillText("STORAGE SHELVES & SUPPLIES", w / 2, 90);
 break;

 case 'detention':
 ctx.strokeStyle = '#2a2d3d';
 ctx.lineWidth = 2;
 for (let gx = 20; gx < w; gx += 40) {
 ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, h); ctx.stroke();
 }
 for (let gy = 20; gy < h; gy += 40) {
 ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(w, gy); ctx.stroke();
 }

 ctx.strokeStyle = '#78909c';
 ctx.lineWidth = 6;
 ctx.strokeRect(80, 80, w - 160, 60);
 for (let bx = 100; bx < w - 100; bx += 20) {
 ctx.beginPath(); ctx.moveTo(bx, 80); ctx.lineTo(bx, 140); ctx.stroke();
 }

 ctx.fillStyle = '#3e2723';
 ctx.fillRect(w / 2 - 100, h / 2 - 30, 200, 60);
 ctx.fillStyle = '#000000';
 ctx.beginPath(); ctx.arc(w / 2 - 50, h / 2, 12, 0, Math.PI * 2); ctx.fill();
 ctx.beginPath(); ctx.arc(w / 2, h / 2, 16, 0, Math.PI * 2); ctx.fill();
 ctx.beginPath(); ctx.arc(w / 2 + 50, h / 2, 12, 0, Math.PI * 2); ctx.fill();

 ctx.fillStyle = '#37474f';
 ctx.fillRect(120, h - 180, 60, 60);
 ctx.fillRect(w - 180, h - 180, 60, 60);
 ctx.strokeStyle = '#263238';
 ctx.lineWidth = 3;
 ctx.strokeRect(120, h - 180, 60, 60);
 ctx.strokeRect(w - 180, h - 180, 60, 60);

 const time = Date.now() * 0.006;
 const glowRadius = 45 + Math.sin(time * 2) * 8;

 const drawTorch = (tx, ty) => {
 const torchGrad = ctx.createRadialGradient(tx, ty, 4, tx, ty, glowRadius);
 torchGrad.addColorStop(0, 'rgba(255, 140, 0, 0.9)');
 torchGrad.addColorStop(0.5, 'rgba(255, 60, 0, 0.4)');
 torchGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
 ctx.fillStyle = torchGrad;
 ctx.beginPath(); ctx.arc(tx, ty, glowRadius, 0, Math.PI * 2); ctx.fill();
 };

 drawTorch(60, 60);
 drawTorch(w - 60, 60);
 drawTorch(60, h - 60);
 drawTorch(w - 60, h - 60);
 break;
 }
 }

 function drawClassroomBase(w, h, accentColor, label) {
 ctx.fillStyle = '#4e3629';
 ctx.fillRect(80, 80, 160, 70);
 ctx.fillStyle = accentColor;
 ctx.font = 'bold 11px monospace';
 ctx.textAlign = 'center';
 ctx.fillText(label, 160, 120);

 for (let x = 120; x < w - 120; x += 180) {
 for (let y = 240; y < h - 140; y += 140) {
 ctx.fillStyle = '#6d4c41';
 ctx.fillRect(x, y, 90, 60);
 ctx.strokeStyle = '#3e2723';
 ctx.lineWidth = 2;
 ctx.strokeRect(x, y, 90, 60);
 }
 }
 }

 function drawStickmanTopDown(x, y, angle, walkFrame) {
 ctx.save();
 ctx.translate(x, y);
 ctx.rotate(angle);

 ctx.strokeStyle = '#ffffff';
 ctx.fillStyle = '#ffffff';
 ctx.lineWidth = 3;
 ctx.lineCap = 'round';

 const legSwing = Math.sin(walkFrame) * 10;
 const armSwing = Math.sin(walkFrame + Math.PI) * 8;

 // Feet
 ctx.beginPath();
 ctx.arc(-6 + legSwing, -12, 4, 0, Math.PI * 2);
 ctx.arc(-6 - legSwing, 12, 4, 0, Math.PI * 2);
 ctx.fill();

 // Upper Body
 ctx.beginPath();
 ctx.moveTo(-3, -16);
 ctx.lineTo(-3, 16);
 ctx.stroke();

 // Arms
 ctx.beginPath();
 ctx.moveTo(-3, -14);
 ctx.lineTo(8 + armSwing, -16);
 ctx.moveTo(-3, 14);
 ctx.lineTo(8 - armSwing, 16);
 ctx.stroke();

 // Head
 ctx.beginPath();
 ctx.arc(0, 0, 11, 0, Math.PI * 2);
 ctx.fillStyle = '#111111';
 ctx.fill();
 ctx.stroke();

 // Direction Indicator
 ctx.fillStyle = '#ffffff';
 ctx.beginPath();
 ctx.arc(6, -3, 2, 0, Math.PI * 2);
 ctx.arc(6, 3, 2, 0, Math.PI * 2);
 ctx.fill();

 ctx.restore();
 }

 function draw() {
 ctx.clearRect(0, 0, canvas.width, canvas.height);

 ctx.save();
 ctx.translate(-camera.x, -camera.y);

 drawInfiniteField(camera.x, camera.y);
 drawHallway();
 rooms.forEach(drawRoom);
 drawLockersAndExits();
 drawStickmanTopDown(player.x, player.y, player.angle, player.walkFrame);

 ctx.restore();
 }

 function animate() {
 updatePhysics();
 draw();
 requestAnimationFrame(animate);
 }

 window.onload = function() {
 resizeCanvas();
 generateSchool();
 animate();
 };
 </script>
</body>
