<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stickman & The Cactus Maze</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            overflow: hidden;
            padding: 12px;
        }

        /* Top Header Bar */
        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1100px;
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 1px solid #ffffff;
        }

        h1 {
            font-size: 16px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: bold;
        }

        /* HUD Display */
        #hud {
            display: flex;
            gap: 16px;
            font-size: 14px;
            font-weight: bold;
            color: #00ffcc;
        }

        .btn-reset {
            background: transparent;
            color: #ffffff;
            border: 1px solid #ffffff;
            padding: 4px 12px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.15s ease-in-out;
        }

        .btn-reset:hover {
            background: #ffffff;
            color: #000000;
        }

        /* Main Canvas Container */
        #canvas-wrapper {
            position: relative;
            width: 100%;
            max-width: 1100px;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            background-color: #050505;
            border: 2px solid #ffffff;
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 4px;
        }

        .instructions {
            margin-top: 6px;
            font-size: 11px;
            color: #aaaaaa;
            text-align: center;
        }

        /* On-Screen Touch Controls for Chromebooks */
        #touch-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1100px;
            margin-top: 6px;
            touch-action: manipulation;
        }

        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 40px);
            grid-template-rows: repeat(2, 40px);
            gap: 4px;
        }

        .touch-btn {
            background: #222222;
            color: #ffffff;
            border: 1px solid #666666;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            touch-action: manipulation;
        }

        .touch-btn:active {
            background: #00ffcc;
            color: #000000;
        }

        .btn-swing {
            background: #228b22;
            border: 2px solid #00ff66;
            color: #ffffff;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            letter-spacing: 1px;
        }

        .btn-swing:active {
            background: #00ff66;
            color: #000000;
        }
    </style>
</head>
<body>

    <!-- Header & HUD Section -->
    <div id="header">
        <h1>Stickman & The Cactus</h1>
        <div id="hud">
            <span>LEVEL: <span id="hud-level">1</span></span>
            <span>LIVES: <span id="hud-lives">❤️❤️❤️</span></span>
            <span>KITTIES: <span id="hud-kitties">0</span></span>
            <span>SCORE: <span id="hud-score">1</span></span>
        </div>
        <button class="btn-reset" onclick="restartGame()">Reset Game</button>
    </div>

    <!-- Canvas Container -->
    <div id="canvas-wrapper">
        <canvas id="simCanvas"></canvas>
    </div>

    <div class="instructions">
        [WASD / Arrows] Move | [SPACE] Swing Cactus | Touch Controls Below
    </div>

    <!-- Touchscreen Controls for Chromebook Users -->
    <div id="touch-controls">
        <div class="dpad">
            <div></div>
            <button class="touch-btn" id="btn-up">▲</button>
            <div></div>
            <button class="touch-btn" id="btn-left">◀</button>
            <button class="touch-btn" id="btn-down">▼</button>
            <button class="touch-btn" id="btn-right">▶</button>
        </div>
        <button class="touch-btn btn-swing" id="btn-swing-touch">🌵 SWING CACTUS 🌵</button>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // GAME STATE
        let level = 1;
        let lives = 3;
        let kittiesRescued = 0;
        let score = 1;
        let gameOver = false;
        let bannerMessage = "";
        let bannerTimer = 0;

        // MAZE CONFIGURATION
        const cols = 13;
        const rows = 9;
        let cellWidth = 0;
        let cellHeight = 0;
        let grid = [];
        let wallsList = [];

        // KEYBOARD & TOUCH INPUT STATE
        const keys = {};

        // PLAYER STATE
        const player = {
            x: 0,
            y: 0,
            radius: 10,
            speed: 3.5,
            facing: 1, // 1 = Right, -1 = Left
            walkFrame: 0,
            isSwinging: false,
            swingAngle: 0,
            swingCooldown: 0,
            hitEnemiesThisSwing: new Set()
        };

        // ENTITIES
        let enemies = [];
        let kitties = [];
        let particles = [];

        // MAZE GENERATION (Depth-First Search)
        function createMaze() {
            grid = [];
            for (let r = 0; r < rows; r++) {
                let rowArr = [];
                for (let c = 0; c < cols; c++) {
                    rowArr.push({
                        r: r,
                        c: c,
                        walls: { top: true, right: true, bottom: true, left: true },
                        visited: false
                    });
                }
                grid.push(rowArr);
            }

            let stack = [];
            let current = grid[rows - 1][0]; // Start lower-left
            current.visited = true;

            while (true) {
                let neighbors = getUnvisitedNeighbors(current);
                if (neighbors.length > 0) {
                    let next = neighbors[Math.floor(Math.random() * neighbors.length)];
                    removeWalls(current, next);
                    stack.push(current);
                    current = next;
                    current.visited = true;
                } else if (stack.length > 0) {
                    current = stack.pop();
                } else {
                    break;
                }
            }

            buildWallsList();
        }

        function getUnvisitedNeighbors(cell) {
            let list = [];
            let r = cell.r;
            let c = cell.c;

            if (r > 0 && !grid[r - 1][c].visited) list.push(grid[r - 1][c]);
            if (r < rows - 1 && !grid[r + 1][c].visited) list.push(grid[r + 1][c]);
            if (c > 0 && !grid[r][c - 1].visited) list.push(grid[r][c - 1]);
            if (c < cols - 1 && !grid[r][c + 1].visited) list.push(grid[r][c + 1]);

            return list;
        }

        function removeWalls(a, b) {
            let dr = b.r - a.r;
            let dc = b.c - a.c;

            if (dr === -1) { a.walls.top = false; b.walls.bottom = false; }
            else if (dr === 1) { a.walls.bottom = false; b.walls.top = false; }
            
            if (dc === -1) { a.walls.left = false; b.walls.right = false; }
            else if (dc === 1) { a.walls.right = false; b.walls.left = false; }
        }

        function buildWallsList() {
            wallsList = [];
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    let x1 = c * cellWidth;
                    let y1 = r * cellHeight;
                    let x2 = (c + 1) * cellWidth;
                    let y2 = (r + 1) * cellHeight;

                    let cell = grid[r][c];
                    if (cell.walls.top) wallsList.push({ x1, y1, x2: x2, y2: y1 });
                    if (cell.walls.bottom) wallsList.push({ x1, y1: y2, x2: x2, y2 });
                    if (cell.walls.left) wallsList.push({ x1, y1, x2: x1, y2: y2 });
                    if (cell.walls.right) wallsList.push({ x1: x2, y1, x2: x2, y2: y2 });
                }
            }
        }

        // DISTANCE FROM POINT TO LINE SEGMENT (COLLISION MATH)
        function distToSegment(px, py, x1, y1, x2, y2) {
            const l2 = (x2 - x1) ** 2 + (y2 - y1) ** 2;
            if (l2 === 0) return Math.hypot(px - x1, py - y1);
            let t = ((px - x1) * (x2 - x1) + (py - y1) * (y2 - y1)) / l2;
            t = Math.max(0, Math.min(1, t));
            const projX = x1 + t * (x2 - x1);
            const projY = y1 + t * (y2 - y1);
            return Math.hypot(px - projX, py - projY);
        }

        function checkWallCollision(x, y, radius) {
            for (let w of wallsList) {
                if (distToSegment(x, y, w.x1, w.y1, w.x2, w.y2) < radius) {
                    return true;
                }
            }
            return false;
        }

        // LEVEL INITIALIZATION
        function initLevel() {
            createMaze();

            // Set Stickman in Center of Start Cell (Lower-Left)
            player.x = cellWidth * 0.5;
            player.y = (rows - 0.5) * cellHeight;
            player.isSwinging = false;
            player.swingAngle = 0;

            // Spawn Kitties
            kitties = [];
            let kittyCount = 3 + Math.floor(Math.random() * 3);
            for (let i = 0; i < kittyCount; i++) {
                let r = Math.floor(Math.random() * rows);
                let c = Math.floor(Math.random() * cols);
                // Don't spawn on start cell or exit cell
                if ((r === rows - 1 && c === 0) || (r === 0 && c === cols - 1)) continue;
                kitties.push({
                    x: (c + 0.5) * cellWidth,
                    y: (r + 0.5) * cellHeight,
                    radius: 8
                });
            }

            // Spawn Enemies
            enemies = [];
            let enemyCount = 2 + level;
            let types = ['slug', 'pumpkin', 'toaster'];

            for (let i = 0; i < enemyCount; i++) {
                let r = Math.floor(Math.random() * rows);
                let c = Math.floor(Math.random() * cols);
                if ((r === rows - 1 && c === 0) || (r === rows - 1 && c === 1)) continue; // Keep start clear

                let type = types[Math.floor(Math.random() * types.length)];
                if (level === 1 && Math.random() > 0.4) type = 'slug'; // Easier on level 1

                let hp = type === 'toaster' ? 3 : (type === 'pumpkin' ? 2 : 1);
                let maxHp = hp;
                let speed = type === 'toaster' ? 2.0 : (type === 'pumpkin' ? 1.5 : 1.0);
                let radius = type === 'toaster' ? 14 : (type === 'pumpkin' ? 12 : 10);

                enemies.push({
                    type: type,
                    x: (c + 0.5) * cellWidth,
                    y: (r + 0.5) * cellHeight,
                    hp: hp,
                    maxHp: maxHp,
                    speed: speed,
                    radius: radius,
                    vx: speed * (Math.random() > 0.5 ? 1 : -1),
                    vy: 0
                });
            }

            updateHUD();
        }

        function updateHUD() {
            score = level + kittiesRescued;
            document.getElementById('hud-level').innerText = level;
            document.getElementById('hud-lives').innerText = '❤️'.repeat(Math.max(0, lives));
            document.getElementById('hud-kitties').innerText = kittiesRescued;
            document.getElementById('hud-score').innerText = score;
        }

        function restartGame() {
            level = 1;
            lives = 3;
            kittiesRescued = 0;
            gameOver = false;
            bannerMessage = "GAME RESTARTED!";
            bannerTimer = 60;
            initLevel();
        }

        function resizeCanvas() {
            const wrapper = document.getElementById('canvas-wrapper');
            canvas.width = wrapper.clientWidth;
            canvas.height = wrapper.clientHeight;
            cellWidth = canvas.width / cols;
            cellHeight = canvas.height / rows;

            if (grid.length === 0) {
                initLevel();
            } else {
                buildWallsList();
            }
        }

        window.addEventListener('resize', resizeCanvas);

        // INPUT EVENT HANDLERS
        window.addEventListener('keydown', (e) => {
            if (['KeyW', 'KeyA', 'KeyS', 'KeyD', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
                e.preventDefault();
            }
            keys[e.code] = true;

            if (e.code === 'Space') {
                triggerSwing();
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });

        // TOUCH BUTTON BINDINGS
        function bindTouchBtn(btnId, keyName) {
            const btn = document.getElementById(btnId);
            btn.addEventListener('pointerdown', (e) => { e.preventDefault(); keys[keyName] = true; });
            btn.addEventListener('pointerup', (e) => { e.preventDefault(); keys[keyName] = false; });
            btn.addEventListener('pointerleave', (e) => { keys[keyName] = false; });
        }

        bindTouchBtn('btn-up', 'KeyW');
        bindTouchBtn('btn-down', 'KeyS');
        bindTouchBtn('btn-left', 'KeyA');
        bindTouchBtn('btn-right', 'KeyD');

        document.getElementById('btn-swing-touch').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            triggerSwing();
        });

        function triggerSwing() {
            if (!player.isSwinging && player.swingCooldown <= 0) {
                player.isSwinging = true;
                player.swingAngle = 0;
                player.hitEnemiesThisSwing.clear();
            }
        }

        // UPDATE GAME PHYSICS
        function updatePhysics() {
            if (gameOver) return;

            // Player Movement
            let dx = 0;
            let dy = 0;

            if (keys['KeyW'] || keys['Keyw'] || keys['ArrowUp']) dy -= 1;
            if (keys['KeyS'] || keys['Keys'] || keys['ArrowDown']) dy += 1;
            if (keys['KeyA'] || keys['Keya'] || keys['ArrowLeft']) { dx -= 1; player.facing = -1; }
            if (keys['KeyD'] || keys['Keyd'] || keys['ArrowRight']) { dx += 1; player.facing = 1; }

            if (dx !== 0 && dy !== 0) {
                dx *= 0.7071;
                dy *= 0.7071;
            }

            // Smooth Axis-Independent Movement Collision
            let nextX = player.x + dx * player.speed;
            if (!checkWallCollision(nextX, player.y, player.radius)) {
                player.x = nextX;
            }

            let nextY = player.y + dy * player.speed;
            if (!checkWallCollision(player.x, nextY, player.radius)) {
                player.y = nextY;
            }

            // Walk animation frame update
            if (dx !== 0 || dy !== 0) player.walkFrame += 0.25;
            else player.walkFrame = 0;

            // Handle Cactus Swing Arc (360 degrees)
            if (player.isSwinging) {
                player.swingAngle += 0.35; // Sweep speed
                
                // Swing hit radius
                const swingRadius = 42;

                // Check collision with enemies during swing
                for (let enemy of enemies) {
                    if (!player.hitEnemiesThisSwing.has(enemy)) {
                        let dist = Math.hypot(enemy.x - player.x, enemy.y - player.y);
                        if (dist <= swingRadius + enemy.radius) {
                            // Damage enemy
                            enemy.hp -= 1;
                            player.hitEnemiesThisSwing.add(enemy);

                            // Knockback impulse away from Stickman
                            let angle = Math.atan2(enemy.y - player.y, enemy.x - player.x);
                            let knockDist = 35;
                            let targetKx = enemy.x + Math.cos(angle) * knockDist;
                            let targetKy = enemy.y + Math.sin(angle) * knockDist;

                            if (!checkWallCollision(targetKx, targetKy, enemy.radius)) {
                                enemy.x = targetKx;
                                enemy.y = targetKy;
                            }

                            // Spawn hit particles
                            for (let p = 0; p < 6; p++) {
                                particles.push({
                                    x: enemy.x,
                                    y: enemy.y,
                                    vx: (Math.random() - 0.5) * 6,
                                    vy: (Math.random() - 0.5) * 6,
                                    life: 15,
                                    color: '#ffff00'
                                });
                            }
                        }
                    }
                }

                if (player.swingAngle >= Math.PI * 2) {
                    player.isSwinging = false;
                    player.swingCooldown = 6;
                }
            } else if (player.swingCooldown > 0) {
                player.swingCooldown--;
            }

            // Remove Defeated Enemies
            enemies = enemies.filter(enemy => enemy.hp > 0);

            // Enemy Roaming AI Logic
            for (let enemy of enemies) {
                let nextEX = enemy.x + enemy.vx;
                let nextEY = enemy.y + enemy.vy;

                if (!checkWallCollision(nextEX, nextEY, enemy.radius)) {
                    enemy.x = nextEX;
                    enemy.y = nextEY;
                } else {
                    // Wall hit: pick random valid direction
                    let dirs = [
                        { vx: enemy.speed, vy: 0 },
                        { vx: -enemy.speed, vy: 0 },
                        { vx: 0, vy: enemy.speed },
                        { vx: 0, vy: -enemy.speed }
                    ];
                    dirs.sort(() => Math.random() - 0.5);

                    for (let d of dirs) {
                        if (!checkWallCollision(enemy.x + d.vx * 3, enemy.y + d.vy * 3, enemy.radius)) {
                            enemy.vx = d.vx;
                            enemy.vy = d.vy;
                            break;
                        }
                    }
                }

                // Check Enemy Touch Stickman Collision
                let distToPlayer = Math.hypot(enemy.x - player.x, enemy.y - player.y);
                if (distToPlayer < player.radius + enemy.radius) {
                    lives--;
                    updateHUD();

                    if (lives <= 0) {
                        gameOver = true;
                        bannerMessage = "GAME OVER! RESTARTING LEVEL 1...";
                        setTimeout(restartGame, 2200);
                    } else {
                        bannerMessage = `OUCH! LIVES LEFT: ${lives}`;
                        bannerTimer = 60;
                        // Send Stickman back to start position
                        player.x = cellWidth * 0.5;
                        player.y = (rows - 0.5) * cellHeight;
                    }
                }
            }

            // Kitties Rescue Collision Check
            for (let i = kitties.length - 1; i >= 0; i--) {
                let k = kitties[i];
                if (Math.hypot(player.x - k.x, player.y - k.y) < player.radius + k.radius) {
                    kitties.splice(i, 1);
                    kittiesRescued++;
                    updateHUD();

                    // Sparkle particles
                    for (let p = 0; p < 8; p++) {
                        particles.push({
                            x: k.x,
                            y: k.y,
                            vx: (Math.random() - 0.5) * 5,
                            vy: (Math.random() - 0.5) * 5,
                            life: 20,
                            color: '#ff66cc'
                        });
                    }
                }
            }

            // Check Maze Exit Reached (Upper Right Cell)
            const exitCol = cols - 1;
            const exitRow = 0;
            const exitX = (exitCol + 0.5) * cellWidth;
            const exitY = (exitRow + 0.5) * cellHeight;

            if (Math.hypot(player.x - exitX, player.y - exitY) < cellWidth * 0.4) {
                level++;
                bannerMessage = `LEVEL ${level} GENERATED!`;
                bannerTimer = 60;
                initLevel();
            }

            // Update particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }

            if (bannerTimer > 0) bannerTimer--;
        }

        // DRAW FUNCTIONS
        function drawMaze() {
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;

            for (let w of wallsList) {
                ctx.beginPath();
                ctx.moveTo(w.x1, w.y1);
                ctx.lineTo(w.x2, w.y2);
                ctx.stroke();
            }

            // Draw Exit Archway in Upper-Right
            const exitX = (cols - 1) * cellWidth;
            const exitY = 0;
            ctx.fillStyle = 'rgba(0, 255, 102, 0.25)';
            ctx.fillRect(exitX + 4, exitY + 4, cellWidth - 8, cellHeight - 8);

            ctx.strokeStyle = '#00ff66';
            ctx.lineWidth = 2;
            ctx.strokeRect(exitX + 4, exitY + 4, cellWidth - 8, cellHeight - 8);

            ctx.fillStyle = '#00ff66';
            ctx.font = 'bold 12px Courier New';
            ctx.textAlign = 'center';
            ctx.fillText('EXIT ➜', exitX + cellWidth / 2, exitY + cellHeight / 2 + 4);
        }

        function drawKitties() {
            for (let k of kitties) {
                ctx.save();
                ctx.translate(k.x, k.y);

                // Cute Kitty Head
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(0, 0, 7, 0, Math.PI * 2);
                ctx.fill();

                // Pointy Cat Ears
                ctx.fillStyle = '#ff99cc';
                ctx.beginPath();
                ctx.moveTo(-6, -4); ctx.lineTo(-9, -10); ctx.lineTo(-2, -6);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(6, -4); ctx.lineTo(9, -10); ctx.lineTo(2, -6);
                ctx.fill();

                // Eyes & Whiskers
                ctx.fillStyle = '#000000';
                ctx.fillRect(-3, -2, 2, 2);
                ctx.fillRect(1, -2, 2, 2);

                ctx.strokeStyle = '#cccccc';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(-7, 0); ctx.lineTo(-11, -1);
                ctx.moveTo(-7, 2); ctx.lineTo(-11, 3);
                ctx.moveTo(7, 0); ctx.lineTo(11, -1);
                ctx.moveTo(7, 2); ctx.lineTo(11, 3);
                ctx.stroke();

                ctx.restore();
            }
        }

        function drawEnemies() {
            for (let e of enemies) {
                ctx.save();
                ctx.translate(e.x, e.y);

                if (e.type === 'slug') {
                    // Alien Slug
                    ctx.fillStyle = '#39FF14';
                    ctx.beginPath();
                    ctx.ellipse(0, 2, 10, 6, 0, 0, Math.PI * 2);
                    ctx.fill();

                    // Eyestalks
                    ctx.strokeStyle = '#39FF14';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(-4, -2); ctx.lineTo(-6, -8);
                    ctx.moveTo(4, -2); ctx.lineTo(6, -8);
                    ctx.stroke();

                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(-6, -8, 2, 0, Math.PI * 2);
                    ctx.arc(6, -8, 2, 0, Math.PI * 2);
                    ctx.fill();

                } else if (e.type === 'pumpkin') {
                    // Angry Pumpkin
                    ctx.fillStyle = '#FF6600';
                    ctx.beginPath();
                    ctx.arc(0, 0, 11, 0, Math.PI * 2);
                    ctx.fill();

                    // Stem
                    ctx.fillStyle = '#009933';
                    ctx.fillRect(-2, -14, 4, 4);

                    // Evil Triangular Eyes
                    ctx.fillStyle = '#ffff00';
                    ctx.beginPath();
                    ctx.moveTo(-6, -4); ctx.lineTo(-2, -4); ctx.lineTo(-4, 0);
                    ctx.moveTo(6, -4); ctx.lineTo(2, -4); ctx.lineTo(4, 0);
                    ctx.fill();

                    // Jagged Mouth
                    ctx.strokeStyle = '#000000';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(-6, 4); ctx.lineTo(-3, 7); ctx.lineTo(0, 4); ctx.lineTo(3, 7); ctx.lineTo(6, 4);
                    ctx.stroke();

                } else if (e.type === 'toaster') {
                    // Evil Toaster
                    ctx.fillStyle = '#A0A0A0';
                    ctx.fillRect(-12, -9, 24, 18);

                    // Red Slots
                    ctx.fillStyle = '#ff0000';
                    ctx.fillRect(-8, -12, 16, 3);

                    // Evil Red Eyes
                    ctx.fillStyle = '#ff0033';
                    ctx.fillRect(-7, -4, 4, 4);
                    ctx.fillRect(3, -4, 4, 4);

                    // Toast Handle
                    ctx.fillStyle = '#444444';
                    ctx.fillRect(12, -2, 4, 5);
                }

                // Enemy HP Bar Indicator
                if (e.maxHp > 1) {
                    ctx.fillStyle = '#333333';
                    ctx.fillRect(-10, -18, 20, 3);
                    ctx.fillStyle = '#00ffcc';
                    ctx.fillRect(-10, -18, (e.hp / e.maxHp) * 20, 3);
                }

                ctx.restore();
            }
        }

        function drawPottedCactus(x, y, scale = 1) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);

            // Brown Pot
            ctx.fillStyle = '#8B4513';
            ctx.beginPath();
            ctx.moveTo(-5, 0);
            ctx.lineTo(5, 0);
            ctx.lineTo(4, 8);
            ctx.lineTo(-4, 8);
            ctx.closePath();
            ctx.fill();

            // Cactus Stem & Arms
            ctx.fillStyle = '#00CC44';
            ctx.fillRect(-2, -10, 4, 10);
            ctx.fillRect(-6, -7, 4, 3);
            ctx.fillRect(-6, -10, 3, 3);
            ctx.fillRect(2, -5, 4, 3);
            ctx.fillRect(3, -8, 3, 3);

            // Prickly Needle Details
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 0.8;
            ctx.beginPath();
            ctx.moveTo(-1, -8); ctx.lineTo(-3, -9);
            ctx.moveTo(1, -4); ctx.lineTo(3, -5);
            ctx.stroke();

            ctx.restore();
        }

        function drawStickman(x, y, facing, walkFrame) {
            ctx.strokeStyle = '#ffffff';
            ctx.fillStyle = '#ffffff';
            ctx.lineWidth = 1.8;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            const headRadius = 5;
            const bodyLength = 15;
            const legLength = 11;
            const neckY = y - bodyLength;
            const headY = neckY - headRadius;
            const shoulderY = neckY + 4;

            // Head
            ctx.beginPath();
            ctx.arc(x, headY, headRadius, 0, Math.PI * 2);
            ctx.stroke();

            // Eye direction indicator
            ctx.beginPath();
            ctx.arc(x + facing * 2, headY - 0.5, 0.8, 0, Math.PI * 2);
            ctx.fill();

            // Torso
            ctx.beginPath();
            ctx.moveTo(x, neckY);
            ctx.lineTo(x, y);
            ctx.stroke();

            // Animated Legs
            const legSwing = Math.sin(walkFrame) * 5;
            ctx.beginPath();
            ctx.moveTo(x, y); ctx.lineTo(x - legSwing, y + legLength);
            ctx.moveTo(x, y); ctx.lineTo(x + legSwing, y + legLength);
            ctx.stroke();

            // Back Arm
            const armSwing = Math.sin(walkFrame + Math.PI) * 4;
            ctx.beginPath();
            ctx.moveTo(x, shoulderY);
            ctx.lineTo(x - facing * 4 - armSwing, shoulderY + 6);
            ctx.stroke();

            // Front Arm holding Potted Cactus (When not swinging)
            if (!player.isSwinging) {
                const handX = x + facing * 8;
                const handY = shoulderY + 2;
                ctx.beginPath();
                ctx.moveTo(x, shoulderY);
                ctx.lineTo(handX, handY);
                ctx.stroke();

                drawPottedCactus(handX + facing * 2, handY - 4, 0.8);
            } else {
                // Front Arm raised during swing
                ctx.beginPath();
                ctx.moveTo(x, shoulderY);
                ctx.lineTo(x + facing * 6, shoulderY - 4);
                ctx.stroke();
            }

            // 360-degree Swinging Cactus Arc Render
            if (player.isSwinging) {
                const swingRadius = 32;
                const cactusX = x + Math.cos(player.swingAngle) * swingRadius;
                const cactusY = y - 6 + Math.sin(player.swingAngle) * swingRadius;

                // Glowing Trail Arc
                ctx.strokeStyle = 'rgba(0, 255, 102, 0.4)';
                ctx.lineWidth = 6;
                ctx.beginPath();
                ctx.arc(x, y - 6, swingRadius, player.swingAngle - 0.8, player.swingAngle);
                ctx.stroke();

                // Potted Cactus Spinning in Arc
                drawPottedCactus(cactusX, cactusY, 1.1);
            }
        }

        function drawParticles() {
            for (let p of particles) {
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, 3, 3);
            }
        }

        function draw() {
            // Background Clear
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawMaze();
            drawKitties();
            drawEnemies();
            drawParticles();
            drawStickman(player.x, player.y, player.facing, player.walkFrame);

            // Banner Notifications
            if (bannerTimer > 0 || gameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
                ctx.fillRect(0, canvas.height / 2 - 30, canvas.width, 60);

                ctx.fillStyle = gameOver ? '#ff3333' : '#00ffcc';
                ctx.font = 'bold 20px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText(bannerMessage, canvas.width / 2, canvas.height / 2 + 6);
            }
        }

        function animate() {
            updatePhysics();
            draw();
            requestAnimationFrame(animate);
        }

        window.onload = function() {
            resizeCanvas();
            animate();
        };
    </script>
</body>
</html>
